name: callwright

# Local and CI stack. Host ports avoid clashes with locally installed services (BUILD.md).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: callwright
      POSTGRES_PASSWORD: callwright
      POSTGRES_DB: callwright
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callwright -d callwright"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: callwright
      MINIO_ROOT_PASSWORD: callwright-secret
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - miniodata:/data
    profiles: ["storage"]

volumes:
  pgdata:
  miniodata:
