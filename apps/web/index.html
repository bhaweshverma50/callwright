<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Callwright: build, run and keep improving AI voice agents." />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#F4F5FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1030" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="Callwright" />
    <meta property="og:description" content="Build, run and keep improving AI voice agents." />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Callwright</title>
    <script>
      // Apply the saved or system theme before first paint so there is no flash (see src/app/theme.ts).
      (function () {
        var pref = "system";
        try {
          pref = localStorage.getItem("cw.theme") || "system";
        } catch (e) {}
        var dark = pref === "dark" || (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
