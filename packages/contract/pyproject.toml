[project]
name = "callwright-contract"
version = "0.1.0"
description = "Values and shapes the Callwright API and voice worker share: call vocabulary, worker protocol, variables, the HTTP tool core and the outbound URL guard"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["callwright_contract"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
