openapi: 3.1.0
info:
  title: Callwright API, annotations module
  version: 0.1.0
  description: Human labels on calls; one label per user per call. Owned by spec 007.
servers:
  - url: /v1
security:
  - bearerAuth: []
paths:
  /calls/{call_id}/annotations:
    get:
      operationId: listCallAnnotations
      parameters:
        - { name: call_id, in: path, required: true, schema: { type: string, pattern: "^call_" } }
      responses:
        "200":
          description: All labels on the call, the viewer's first
          content:
            application/json:
              schema:
                type: object
                required: [items, mine]
                properties:
                  mine:
                    oneOf:
                      - { $ref: "#/components/schemas/Annotation" }
                      - { type: "null" }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Annotation" }
        "404": { $ref: "#/components/responses/Problem" }
  /calls/{call_id}/annotations/me:
    parameters:
      - { name: call_id, in: path, required: true, schema: { type: string, pattern: "^call_" } }
    put:
      operationId: putMyAnnotation
      description: Create or replace the viewer's label on the call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, enum: [good, bad] }
                note: { type: [string, "null"], maxLength: 2000 }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Annotation" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteMyAnnotation
      responses:
        "204": { description: Removed (idempotent) }
        "404": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status]
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
  schemas:
    Annotation:
      type: object
      required: [id, call_id, user, label, created_at, updated_at]
      properties:
        id: { type: string, pattern: "^ann_" }
        call_id: { type: string }
        user:
          type: object
          required: [id, display_name]
          properties:
            id: { type: string, pattern: "^usr_" }
            display_name: { type: string }
        label: { type: string, enum: [good, bad] }
        note: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
