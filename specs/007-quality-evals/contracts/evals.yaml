openapi: 3.1.0
info:
  title: Callwright API, evals module
  version: 0.1.0
  description: Per-agent evaluator settings, evaluator runs per call, reruns and verdict diffs. Owned by spec 007.
servers:
  - url: /v1
security:
  - bearerAuth: []
paths:
  /agents/{agent_id}/eval-settings:
    get:
      operationId: listAgentEvalSettings
      parameters:
        - { name: agent_id, in: path, required: true, schema: { type: string, pattern: "^agt_" } }
      responses:
        "200":
          description: Every evaluator applicable to the agent type with its effective settings
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AgentEvalSetting" }
        "404": { $ref: "../../001-platform-foundation/contracts/core.yaml#/components/responses/Problem" }
  /agents/{agent_id}/eval-settings/{evaluator_id}:
    put:
      operationId: putAgentEvalSetting
      description: >
        Replaces the whole setting. The quality tab sends this both when the on/off switch is
        flipped (with the saved overrides) and on "Save settings" (with every field value).
        Overrides are validated against the settings schema (type, min, max, options; unknown
        keys rejected).
      parameters:
        - { name: agent_id, in: path, required: true, schema: { type: string, pattern: "^agt_" } }
        - { name: evaluator_id, in: path, required: true, schema: { type: string, pattern: "^evl_" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
                overrides: { type: object, additionalProperties: true, description: Validated against the evaluator's settings_schema }
                is_headline: { type: boolean, default: false }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentEvalSetting" }
        "404": { $ref: "../../001-platform-foundation/contracts/core.yaml#/components/responses/Problem" }
        "409":
          description: More than 4 headline evaluators ("Up to 4 headline checks per agent")
          content:
            application/problem+json:
              schema: { $ref: "../../001-platform-foundation/contracts/core.yaml#/components/schemas/Problem" }
        "422":
          description: Field errors, for example sample_rate_pct 150 gives errors[{field "overrides.sample_rate_pct", message "Enter a whole number from 1 to 100"}]; evaluator not applicable to the agent type
          content:
            application/problem+json:
              schema: { $ref: "../../001-platform-foundation/contracts/core.yaml#/components/schemas/Problem" }
  /calls/{call_id}/evaluations:
    get:
      operationId: getCallEvaluations
      parameters:
        - { name: call_id, in: path, required: true, schema: { type: string, pattern: "^call_" } }
        - { name: include_history, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Current runs (and superseded runs when include_history is true)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallEvaluations" }
        "404": { $ref: "../../001-platform-foundation/contracts/core.yaml#/components/responses/Problem" }
  /calls/{call_id}/evaluations/rerun:
    post:
      operationId: rerunCallEvaluations
      parameters:
        - { name: call_id, in: path, required: true, schema: { type: string, pattern: "^call_" } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                evaluator_ids:
                  type: array
                  description: Subset of enabled evaluators; omit for all enabled.
                  items: { type: string, pattern: "^evl_" }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                required: [run_group_id, runs]
                properties:
                  run_group_id: { type: string }
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/EvaluatorRun" }
        "409":
          description: Call not completed, or checks already running ("Checks are already running")
          content:
            application/problem+json:
              schema: { $ref: "../../001-platform-foundation/contracts/core.yaml#/components/schemas/Problem" }
        "422": { $ref: "../../001-platform-foundation/contracts/core.yaml#/components/responses/Problem" }
  /evals/verdict-diff:
    get:
      operationId: getVerdictDiff
      summary: Verdict differences between two calls of the workspace (used by the compare view)
      parameters:
        - { name: base_call_id, in: query, required: true, schema: { type: string, pattern: "^call_" } }
        - { name: other_call_id, in: query, required: true, schema: { type: string, pattern: "^call_" } }
      responses:
        "200":
          description: One row per evaluator present on either call
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [evaluator_id, evaluator_name]
                      properties:
                        evaluator_id: { type: string }
                        evaluator_name: { type: string }
                        display_name: { type: string }
                        base: { $ref: "#/components/schemas/EvalVerdictSide" }
                        other: { $ref: "#/components/schemas/EvalVerdictSide" }
                        score_delta: { type: [number, "null"] }
                        other_rationale: { type: [string, "null"] }
        "404": { $ref: "../../001-platform-foundation/contracts/core.yaml#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Verdict: { type: string, enum: [pass, fail, not_applicable] }
    EvalVerdictSide:
      type: object
      properties:
        verdict:
          oneOf:
            - { $ref: "#/components/schemas/Verdict" }
            - { type: "null" }
        score: { type: [number, "null"] }
        evaluator_version: { type: [integer, "null"] }
    AgentEvalSetting:
      type: object
      required: [evaluator_id, name, display_name, scope, cost_class, output_kind, kind, enabled, enabled_by_default, is_overridden, is_headline, effective_settings, settings_schema, current_version]
      properties:
        evaluator_id: { type: string }
        name: { type: string }
        display_name: { type: string }
        description: { type: [string, "null"] }
        kind: { type: string, enum: [builtin, custom] }
        scope: { type: string, enum: [call, turn, flow_node] }
        cost_class: { type: string, enum: [free, llm_judge] }
        output_kind: { type: string, enum: [class, anomaly, audio_quality, process_reward] }
        enabled: { type: boolean }
        enabled_by_default: { type: boolean }
        is_overridden: { type: boolean }
        adjusted_fields:
          type: array
          items: { type: string }
          description: Override keys clamped into a newer version's range
        is_headline: { type: boolean }
        headline_position: { type: [integer, "null"], minimum: 1, maximum: 4 }
        overrides: { type: object, additionalProperties: true }
        effective_settings: { type: object, additionalProperties: true }
        settings_schema: { type: object, additionalProperties: true }
        current_version: { type: integer }
        est_cost_per_call_usd: { type: [number, "null"], description: Shown for llm_judge evaluators }
    ResultItem:
      type: object
      required: [verdict, rationale]
      properties:
        turn_index: { type: [integer, "null"] }
        flow_node_id: { type: [string, "null"] }
        flow_node_label: { type: [string, "null"] }
        start_ms: { type: [integer, "null"], description: audio_silence silence start offset }
        duration_ms: { type: [integer, "null"], description: audio_silence silence length }
        verdict: { $ref: "#/components/schemas/Verdict" }
        score: { type: [number, "null"] }
        rationale: { type: string }
        evidence:
          type: object
          properties:
            turn_indices: { type: array, items: { type: integer } }
            quote: { type: [string, "null"] }
    EvaluatorRun:
      type: object
      required: [id, evaluator_id, evaluator_name, evaluator_version, status, trigger, created_at]
      properties:
        id: { type: string, pattern: "^evr_" }
        evaluator_id: { type: string }
        evaluator_name: { type: string }
        evaluator_display_name: { type: string }
        evaluator_version: { type: integer }
        scope: { type: string, enum: [call, turn, flow_node] }
        trigger: { type: string, enum: [pipeline, rerun, dataset, simulation] }
        status: { type: string, enum: [pending, running, completed, skipped, error] }
        skip_reason: { type: [string, "null"], enum: [insufficient_credit, not_applicable_agent_type, evaluator_disabled, not_sampled, null] }
        error: { type: [string, "null"] }
        verdict:
          oneOf:
            - { $ref: "#/components/schemas/Verdict" }
            - { type: "null" }
        score: { type: [number, "null"] }
        rationale: { type: [string, "null"] }
        settings_snapshot: { type: object, additionalProperties: true }
        judge_model: { type: [string, "null"] }
        cost_usd: { type: [number, "null"] }
        items:
          type: array
          items: { $ref: "#/components/schemas/ResultItem" }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        superseded_at: { type: [string, "null"], format: date-time }
    CallEvaluations:
      type: object
      required: [call_id, eval_status, pass_count, fail_count, runs]
      properties:
        call_id: { type: string }
        eval_status: { type: string, enum: [not_evaluated, running, passed, failed, error] }
        pass_count: { type: integer }
        fail_count: { type: integer }
        runs:
          type: array
          items: { $ref: "#/components/schemas/EvaluatorRun" }
        history:
          type: array
          items: { $ref: "#/components/schemas/EvaluatorRun" }
