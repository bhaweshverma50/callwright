openapi: 3.1.0
info:
  title: Callwright API, tools module (005-tools-knowledge)
  version: 0.1.0
  description: |
    Fragment merged into contracts/openapi.yaml. Owned by services/api/app/tools.
    Shared components Problem and Page follow 001 conventions and are repeated here so the
    fragment validates on its own.
servers:
  - url: /v1
security:
  - bearerAuth: []
tags:
  - name: tools
  - name: internal

paths:
  /tools:
    get:
      tags: [tools]
      operationId: listTools
      parameters:
        - {name: type, in: query, schema: {$ref: '#/components/schemas/ToolType'}}
        - {name: search, in: query, schema: {type: string, maxLength: 100}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Page of tools
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/Tool'}}
        '401': {$ref: '#/components/responses/Problem'}
    post:
      tags: [tools]
      operationId: createTool
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ToolCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tool'}
        '422': {$ref: '#/components/responses/Problem'}

  /tools/presets:
    get:
      tags: [tools]
      operationId: listToolPresets
      description: |
        Read-only platform presets that prefill the new-tool dialog (FR-043). Creating a tool
        from a preset is an ordinary `POST /tools` with the (edited) `tool` body.
      responses:
        '200':
          description: Presets
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ToolPreset'}

  /tools/{tool_id}:
    parameters:
      - $ref: '#/components/parameters/ToolId'
    get:
      tags: [tools]
      operationId: getTool
      responses:
        '200':
          description: Tool (secrets masked)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tool'}
        '404': {$ref: '#/components/responses/Problem'}
    patch:
      tags: [tools]
      operationId: updateTool
      description: |
        Partial update. `type` cannot change. A secret header sent without `value` keeps the
        stored secret.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ToolUpdate'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tool'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [tools]
      operationId: deleteTool
      parameters:
        - name: force
          in: query
          description: Required when the tool is attached to agent drafts; detaches it first.
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted, detached_agent_ids]
                properties:
                  deleted: {type: boolean}
                  detached_agent_ids: {type: array, items: {type: string, pattern: '^agt_'}}
        '409':
          description: Attached to agents and force is false (problem type `tool_in_use`, lists agents)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}

  /tools/{tool_id}/duplicate:
    parameters:
      - $ref: '#/components/parameters/ToolId'
    post:
      tags: [tools]
      operationId: duplicateTool
      description: Copies the tool including secrets (new secret rows); name gets a `_copy` suffix.
      responses:
        '201':
          description: Copy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tool'}

  /tools/{tool_id}/usages:
    parameters:
      - $ref: '#/components/parameters/ToolId'
    get:
      tags: [tools]
      operationId: getToolUsages
      responses:
        '200':
          description: Agents using the tool
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [agent_id, agent_name, in_draft, published_version_ids]
                      properties:
                        agent_id: {type: string}
                        agent_name: {type: string}
                        in_draft: {type: boolean}
                        published_version_ids: {type: array, items: {type: string, pattern: '^agv_'}}
                        flow_node_ids: {type: array, items: {type: string}, description: Set by 004 for node-level attachment}

  /tools/test-run:
    post:
      tags: [tools]
      operationId: testRunTool
      description: |
        Runs an HTTP tool (saved by `tool_id`, or unsaved by inline `tool`) with sample
        arguments. Free; 30 per minute per workspace. Only `http` tools can be test-run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tool_id: {type: string, pattern: '^tool_'}
                tool: {$ref: '#/components/schemas/ToolCreate'}
                arguments: {type: object, additionalProperties: true, default: {}}
                dynamic_variables: {type: object, additionalProperties: {type: string}, default: {}}
              oneOf:
                - required: [tool_id]
                - required: [tool]
      responses:
        '200':
          description: Result (also returned for upstream errors, with is_error true)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TestRunResult'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}

  /agents/{agent_id}/tools:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [tools]
      operationId: getAgentTools
      responses:
        '200':
          description: Tools attached to the agent draft
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentToolSet'}
    put:
      tags: [tools]
      operationId: setAgentTools
      description: Replaces the attached set on the agent draft (max 25, unique names).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tool_ids]
              properties:
                tool_ids:
                  type: array
                  maxItems: 25
                  uniqueItems: true
                  items: {type: string, pattern: '^tool_'}
      responses:
        '200':
          description: Updated set
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentToolSet'}
        '404': {$ref: '#/components/responses/Problem'}
        '422':
          description: Unknown id, duplicate names (problem type `tool_name_conflict`) or too many tools
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}

  /agents/{agent_id}/tools/mock-coverage:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [tools]
      operationId: getAgentToolMockCoverage
      description: Attached HTTP tools (and flow webhook nodes, via 004) with no canned response; other tool types have fixed simulated outcomes and are never listed.
      responses:
        '200':
          description: Coverage
          content:
            application/json:
              schema:
                type: object
                required: [ready, missing]
                properties:
                  ready: {type: boolean}
                  missing:
                    type: array
                    items:
                      type: object
                      required: [source, name]
                      properties:
                        source: {type: string, enum: [tool, flow_node]}
                        tool_id: {type: string}
                        node_id: {type: string}
                        name: {type: string}
                        tool_type: {$ref: '#/components/schemas/ToolType'}

  /internal/calls/{call_id}/tool-secrets:
    parameters:
      - name: call_id
        in: path
        required: true
        schema: {type: string, pattern: '^call_'}
    get:
      tags: [internal]
      operationId: getCallToolSecrets
      security:
        - serviceToken: []
      description: |
        Returns plaintext values for every `secret_ref` in the call's AgentVersion snapshot.
        Only for calls in `queued`, `ringing` or `in_progress`. Never logged.
      responses:
        '200':
          description: Secret map
          content:
            application/json:
              schema:
                type: object
                required: [secrets]
                properties:
                  secrets:
                    type: object
                    additionalProperties: {type: string}
                    description: Map of secret_ref to value
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
    serviceToken: {type: http, scheme: bearer, description: Internal worker service token}

  parameters:
    ToolId:
      name: tool_id
      in: path
      required: true
      schema: {type: string, pattern: '^tool_[0-9A-HJKMNP-TV-Z]{26}$'}
    AgentId:
      name: agent_id
      in: path
      required: true
      schema: {type: string, pattern: '^agt_[0-9A-HJKMNP-TV-Z]{26}$'}

  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        errors:
          type: array
          items:
            type: object
            properties:
              loc: {type: array, items: {type: [string, integer]}}
              msg: {type: string}
    Page:
      type: object
      required: [items, total, page, page_size, total_pages]
      properties:
        items: {type: array}
        total: {type: integer}
        page: {type: integer}
        page_size: {type: integer}
        total_pages: {type: integer}

    ToolType:
      type: string
      enum: [end_call, transfer_call, press_digit, http]

    ToolName:
      type: string
      pattern: '^[a-z][a-z0-9_]{0,63}$'
      description: Must not be `kb_search` and must not start with `route_to_`.

    ToolCreate:
      type: object
      required: [type, name, description, config]
      additionalProperties: false
      description: Unknown or outdated fields are rejected with 422 naming the field (FR-045).
      properties:
        type: {$ref: '#/components/schemas/ToolType'}
        name: {$ref: '#/components/schemas/ToolName'}
        description: {type: string, minLength: 1, maxLength: 1000}
        mock_response:
          type: [string, 'null']
          maxLength: 16384
          description: Only for type http; must be null or absent for other types (FR-044).
        config:
          oneOf:
            - $ref: '#/components/schemas/EndCallConfig'
            - $ref: '#/components/schemas/TransferSpec'
            - $ref: '#/components/schemas/PressDigitConfig'
            - $ref: '#/components/schemas/HttpToolConfig'
          description: Must match `type`.

    ToolUpdate:
      type: object
      additionalProperties: false
      properties:
        name: {$ref: '#/components/schemas/ToolName'}
        description: {type: string, minLength: 1, maxLength: 1000}
        mock_response:
          type: [string, 'null']
          maxLength: 16384
          description: Only for http tools (FR-044).
        config:
          oneOf:
            - $ref: '#/components/schemas/EndCallConfig'
            - $ref: '#/components/schemas/TransferSpec'
            - $ref: '#/components/schemas/PressDigitConfig'
            - $ref: '#/components/schemas/HttpToolConfig'

    Tool:
      type: object
      required: [id, type, name, description, config, mock_response, usage_count, created_at, updated_at]
      properties:
        id: {type: string, pattern: '^tool_'}
        type: {$ref: '#/components/schemas/ToolType'}
        name: {$ref: '#/components/schemas/ToolName'}
        description: {type: string}
        config:
          oneOf:
            - $ref: '#/components/schemas/EndCallConfig'
            - $ref: '#/components/schemas/TransferSpec'
            - $ref: '#/components/schemas/PressDigitConfig'
            - $ref: '#/components/schemas/HttpToolConfig'
        mock_response: {type: [string, 'null']}
        usage_count: {type: integer, description: Number of agents using the tool}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    ToolPreset:
      type: object
      required: [preset_id, type, title, summary, tool]
      properties:
        preset_id: {type: string, examples: [end_call_polite, transfer_to_person, press_digit_ivr, http_check_availability]}
        type: {$ref: '#/components/schemas/ToolType'}
        title: {type: string}
        summary: {type: string}
        tool:
          $ref: '#/components/schemas/ToolCreate'

    EndCallConfig:
      type: object
      additionalProperties: false
      properties:
        message: {type: [string, 'null'], maxLength: 500}

    E164:
      type: string
      pattern: '^\+[1-9]\d{6,14}$'

    TransferSpec:
      type: object
      additionalProperties: false
      description: Shared with 004 transfer nodes.
      properties:
        routing_type: {type: string, enum: [static, dynamic], default: static}
        number: {$ref: '#/components/schemas/E164'}
        routing_instructions: {type: string, maxLength: 2000}
        allowed_numbers:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/E164'}
          default: []
        transfer_type: {type: string, enum: [cold, warm], default: cold}
        warm_transfer:
          type: [object, 'null']
          required: [handoff_type, briefing_message_type, briefing_message]
          properties:
            handoff_type: {type: string, enum: [private, public]}
            briefing_message_type: {type: string, enum: [static, prompt]}
            briefing_message: {type: string, maxLength: 1000}
        hold_message: {type: string, maxLength: 500, default: Please hold while I connect you.}
        ring_timeout_s: {type: integer, minimum: 5, maximum: 120, default: 30}

    PressDigitConfig:
      type: object
      additionalProperties: false
      properties:
        delay_ms: {type: integer, minimum: 0, maximum: 10000, default: 1000}
        cooldown_ms: {type: integer, minimum: 0, maximum: 60000, default: 5000}

    HeaderSpec:
      type: object
      required: [name, secret]
      properties:
        name: {type: string, pattern: "^[!#$%&'*+.^_`|~0-9A-Za-z-]{1,128}$"}
        value:
          type: [string, 'null']
          maxLength: 4096
          description: Write-only for secret headers (always null on read when secret is true).
        secret: {type: boolean, default: false}
        secret_ref: {type: [string, 'null'], readOnly: true}
        masked_value: {type: [string, 'null'], readOnly: true, examples: ['****1234']}

    ResponseMapping:
      type: object
      required: [variable_name, json_path]
      properties:
        variable_name: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
        json_path: {type: string, maxLength: 256, examples: ['data.slots[0].time']}

    HttpRequestSpec:
      type: object
      description: Shared with 004 webhook nodes; the tool form and the node form offer the same
        methods, timeout range and options (FR-046). The URL must be absolute https (http only
        in development) and is checked in the editor as it is typed.
      required: [url]
      properties:
        method: {type: string, enum: [GET, POST, PUT, PATCH, DELETE], default: POST}
        url: {type: string, maxLength: 2048}
        headers:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/HeaderSpec'}
        body_template:
          description: "JSON value with {{var}} placeholders inside string values; null sends the arguments (body for POST/PUT/PATCH, query for GET/DELETE)."
        timeout_ms: {type: integer, minimum: 1000, maximum: 30000, default: 8000}
        response_mappings:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/ResponseMapping'}
        speak_during_execution: {type: boolean, default: true}
        execution_message: {type: string, maxLength: 300, default: One moment while I check that.}

    HttpToolConfig:
      allOf:
        - $ref: '#/components/schemas/HttpRequestSpec'
        - type: object
          properties:
            parameters:
              type: object
              description: JSON Schema (Draft 2020-12) with type object.
              default: {type: object, properties: {}, required: []}

    AgentToolSet:
      type: object
      required: [agent_id, tools]
      properties:
        agent_id: {type: string}
        tools:
          type: array
          items: {$ref: '#/components/schemas/Tool'}

    TestRunResult:
      type: object
      required: [is_error, duration_ms]
      properties:
        is_error: {type: boolean}
        error_code:
          type: [string, 'null']
          enum: [timeout, http_status, blocked_address, invalid_arguments, missing_variable, response_too_large, connection_error, null]
        error_message: {type: [string, 'null']}
        request:
          type: object
          description: The request as sent, with secret header values masked.
          properties:
            method: {type: string}
            url: {type: string}
            headers: {type: object, additionalProperties: {type: string}}
            body: {}
        http_status: {type: [integer, 'null']}
        duration_ms: {type: integer}
        response_body: {type: [string, 'null'], description: Truncated to 64 KB}
        mapped_variables: {type: object, additionalProperties: true}
        missing_paths: {type: array, items: {type: string}}
        llm_payload: {type: string, description: Exactly what the agent would receive}
