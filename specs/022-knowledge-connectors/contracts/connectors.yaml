openapi: 3.1.0
info:
  title: Callwright API, connections and knowledge sources (022-knowledge-connectors)
  version: 0.1.0
  description: |
    Fragment merged into contracts/openapi.yaml. Owned by services/api/app/connectors (Google
    connections) and services/api/app/knowledge (Drive sources, sync runs, archive and restore).
    In this version the only connection kind is Google sign-in with read-only Drive access and
    Google Sheets access (requested now, used by the Google Sheets tool in a later spec).
    Connection tokens never appear in any response. When the server has no Google OAuth client
    configured, every operation here returns 503 `connector_unavailable`.

    Changes to 005's knowledge.yaml that ship with this feature: `DocumentStatus` gains
    `archived`; `Document` gains `archived_at`, `managed` and `source` (DocumentSource below);
    `KnowledgeBase` gains `archived_count` and `source_count`; document Replace and Delete return
    409 `managed_by_source` for synced documents.
servers:
  - url: /v1
security:
  - bearerAuth: []
tags:
  - name: connections
  - name: knowledge

paths:
  /connections:
    get:
      tags: [connections]
      operationId: listConnections
      summary: Connections of the workspace, with health and the sources that use them
      responses:
        '200':
          description: All connections (a workspace has a handful; not paged)
          content:
            application/json:
              schema:
                type: object
                required: [items, google_configured]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Connection'}
                  google_configured:
                    type: boolean
                    description: False when the server has no Google OAuth client; the page explains it
        '401': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/Unauthorized'}

  /connections/google/start:
    post:
      tags: [connections]
      operationId: startGoogleConnection
      summary: Begin Google sign-in (owner only); returns the URL to send the browser to
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                connection_id:
                  type: string
                  pattern: '^conn_'
                  description: Reconnect this connection instead of adding a new one
      responses:
        '200':
          description: Authorization URL; the state is single use and expires in 10 minutes
          content:
            application/json:
              schema:
                type: object
                required: [authorization_url, expires_in_s]
                properties:
                  authorization_url: {type: string, format: uri}
                  expires_in_s: {type: integer, const: 600}
        '401': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/Unauthorized'}
        '403': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/Forbidden'}
        '404': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ConnectorUnavailable'}

  /connections/google/complete:
    post:
      tags: [connections]
      operationId: completeGoogleConnection
      summary: Finish Google sign-in with the code and state Google returned to the web app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [state]
              properties:
                state: {type: string, minLength: 16, maxLength: 128}
                code: {type: string, minLength: 1, maxLength: 2048}
                error:
                  type: string
                  maxLength: 200
                  description: Google's error when the user declined (e.g. access_denied); no connection is made
      responses:
        '200':
          description: Existing connection for the same Google account reconnected
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Connection'}
        '201':
          description: New connection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Connection'}
        '400':
          description: >
            `oauth_state_invalid` (unknown, expired, used, or from another workspace or user),
            `oauth_declined` (the user declined), `oauth_scope_missing` (read-only Drive access was
            not granted; Sheets access is optional), `oauth_account_mismatch` (reconnect signed in
            with a different Google account; the connection is unchanged) or `oauth_exchange_failed` (Google refused the code)
          content:
            application/problem+json:
              schema: {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/schemas/Problem'}
        '401': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/Unauthorized'}
        '403': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/ConnectorUnavailable'}

  /connections/{connection_id}:
    parameters:
      - {$ref: '#/components/parameters/ConnectionIdPath'}
    get:
      tags: [connections]
      operationId: getConnection
      responses:
        '200':
          description: Connection with its users and recent activity
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectionDetail'}
        '401': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/Unauthorized'}
        '404': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/NotFound'}
    delete:
      tags: [connections]
      operationId: deleteConnection
      summary: Remove a connection (owner only); revokes access at Google
      responses:
        '204': {description: Removed}
        '401': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/Unauthorized'}
        '403': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/Forbidden'}
        '404': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/NotFound'}
        '409':
          description: '`connection_in_use`; `users` lists the sources that use it'
          content:
            application/problem+json:
              schema:
                allOf:
                  - {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/schemas/Problem'}
                  - type: object
                    properties:
                      users:
                        type: array
                        items: {$ref: '#/components/schemas/ConnectionUser'}

  /connections/{connection_id}/test:
    post:
      tags: [connections]
      operationId: testConnection
      parameters:
        - {$ref: '#/components/parameters/ConnectionIdPath'}
      responses:
        '200':
          description: Result of a live check against Google; health is updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Connection'}
        '401': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/Unauthorized'}
        '404': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ConnectorUnavailable'}

  /connections/{connection_id}/drive/shared-drives:
    get:
      tags: [connections]
      operationId: listSharedDrives
      parameters:
        - {$ref: '#/components/parameters/ConnectionIdPath'}
        - {$ref: '#/components/parameters/DrivePageToken'}
      responses:
        '200':
          description: Shared drives the connection can read
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DriveFolderPage'}
        '401': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/Unauthorized'}
        '404': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ConnectionRevoked'}
        '502': {$ref: '#/components/responses/GoogleUnavailable'}

  /connections/{connection_id}/drive/folders:
    get:
      tags: [connections]
      operationId: listDriveFolders
      summary: Folders inside a parent (My Drive root by default), for the folder picker
      parameters:
        - {$ref: '#/components/parameters/ConnectionIdPath'}
        - name: parent
          in: query
          description: Folder id; `root` for My Drive
          schema: {type: string, default: root, maxLength: 200}
        - name: drive_id
          in: query
          description: Shared drive id when browsing inside a shared drive
          schema: {type: string, maxLength: 200}
        - {$ref: '#/components/parameters/DrivePageToken'}
      responses:
        '200':
          description: Child folders, by name
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DriveFolderPage'}
        '401': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/Unauthorized'}
        '404': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ConnectionRevoked'}
        '502': {$ref: '#/components/responses/GoogleUnavailable'}

  /knowledge-bases/{kb_id}/sources:
    parameters:
      - {$ref: '#/components/parameters/KbIdPath'}
    get:
      tags: [knowledge]
      operationId: listKnowledgeSources
      responses:
        '200':
          description: Drive sources of the knowledge base
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/KnowledgeSource'}
        '401': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/Unauthorized'}
        '404': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/NotFound'}
    post:
      tags: [knowledge]
      operationId: createKnowledgeSource
      summary: Add a Drive folder or shared drive; the first sync starts at once
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KnowledgeSourceCreate'}
      responses:
        '201':
          description: Source created, first sync queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeSource'}
        '401': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/Unauthorized'}
        '402': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/InsufficientCredit'}
        '404': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/NotFound'}
        '409':
          description: '`source_exists` (this folder is already a source of this knowledge base) or `connection_revoked`'
          content:
            application/problem+json:
              schema: {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/schemas/Problem'}
        '422': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/ValidationFailed'}
        '503': {$ref: '#/components/responses/ConnectorUnavailable'}

  /knowledge-bases/{kb_id}/sources/{source_id}:
    parameters:
      - {$ref: '#/components/parameters/KbIdPath'}
      - {$ref: '#/components/parameters/SourceIdPath'}
    get:
      tags: [knowledge]
      operationId: getKnowledgeSource
      responses:
        '200':
          description: Source with its latest run and skipped or failed files
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeSourceDetail'}
        '401': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/Unauthorized'}
        '404': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/NotFound'}
    patch:
      tags: [knowledge]
      operationId: updateKnowledgeSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                include_subfolders: {type: boolean}
                interval_minutes: {type: integer, minimum: 5, maximum: 1440}
      responses:
        '200':
          description: Updated; the next sync is rescheduled from the last one
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeSource'}
        '401': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/Unauthorized'}
        '404': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/NotFound'}
        '422': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/ValidationFailed'}
    delete:
      tags: [knowledge]
      operationId: deleteKnowledgeSource
      summary: Remove a source, keeping its documents as uploads or archiving them
      parameters:
        - name: documents
          in: query
          required: true
          schema: {type: string, enum: [keep, archive]}
      responses:
        '204': {description: Removed}
        '401': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/Unauthorized'}
        '404': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/NotFound'}
        '409':
          description: '`sync_running`; retry when the run finishes'
          content:
            application/problem+json:
              schema: {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/schemas/Problem'}
        '422': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/ValidationFailed'}

  /knowledge-bases/{kb_id}/sources/{source_id}/sync:
    post:
      tags: [knowledge]
      operationId: syncKnowledgeSource
      summary: Sync now
      parameters:
        - {$ref: '#/components/parameters/KbIdPath'}
        - {$ref: '#/components/parameters/SourceIdPath'}
      responses:
        '202':
          description: Sync queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SyncRun'}
        '401': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/Unauthorized'}
        '402': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/InsufficientCredit'}
        '404': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/NotFound'}
        '409':
          description: '`sync_running` (the body''s `run` is the active run) or `connection_revoked`'
          content:
            application/problem+json:
              schema:
                allOf:
                  - {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/schemas/Problem'}
                  - type: object
                    properties:
                      run: {$ref: '#/components/schemas/SyncRun'}
        '503': {$ref: '#/components/responses/ConnectorUnavailable'}

  /knowledge-bases/{kb_id}/sources/{source_id}/held-archive/{decision}:
    post:
      tags: [knowledge]
      operationId: decideHeldArchive
      summary: Confirm or cancel archiving that a sync held back (over 20% of the source)
      parameters:
        - {$ref: '#/components/parameters/KbIdPath'}
        - {$ref: '#/components/parameters/SourceIdPath'}
        - name: decision
          in: path
          required: true
          schema: {type: string, enum: [confirm, cancel]}
      responses:
        '200':
          description: Decision applied; the source is rescheduled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeSource'}
        '401': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/Unauthorized'}
        '404': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/NotFound'}
        '409':
          description: '`nothing_held`'
          content:
            application/problem+json:
              schema: {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/schemas/Problem'}

  /knowledge-bases/{kb_id}/sources/{source_id}/runs:
    get:
      tags: [knowledge]
      operationId: listSyncRuns
      parameters:
        - {$ref: '#/components/parameters/KbIdPath'}
        - {$ref: '#/components/parameters/SourceIdPath'}
        - {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/parameters/Page'}
        - {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/parameters/PageSize'}
      responses:
        '200':
          description: Runs, newest first (kept 90 days)
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/schemas/PageMeta'}
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/SyncRun'}
        '401': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/Unauthorized'}
        '404': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/NotFound'}

  /knowledge-bases/{kb_id}/sources/{source_id}/runs/{run_id}:
    get:
      tags: [knowledge]
      operationId: getSyncRun
      parameters:
        - {$ref: '#/components/parameters/KbIdPath'}
        - {$ref: '#/components/parameters/SourceIdPath'}
        - name: run_id
          in: path
          required: true
          schema: {type: string, pattern: '^ksr_'}
      responses:
        '200':
          description: One run with its per-file errors
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SyncRunDetail'}
        '401': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/Unauthorized'}
        '404': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/NotFound'}

  /knowledge-bases/{kb_id}/documents/{doc_id}/restore:
    post:
      tags: [knowledge]
      operationId: restoreDocument
      summary: Bring an archived document back into search (within 30 days); no processing
      parameters:
        - {$ref: '#/components/parameters/KbIdPath'}
        - name: doc_id
          in: path
          required: true
          schema: {type: string, pattern: '^doc_'}
      responses:
        '200':
          description: Restored; status is ready
          content:
            application/json:
              schema: {$ref: '../../005-tools-knowledge/contracts/knowledge.yaml#/components/schemas/Document'}
        '401': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/Unauthorized'}
        '404': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/NotFound'}
        '409':
          description: '`not_archived`, or `quota_exceeded` (the knowledge base is full)'
          content:
            application/problem+json:
              schema: {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/schemas/Problem'}

  /knowledge-bases/{kb_id}/documents/{doc_id}/archive:
    post:
      tags: [knowledge]
      operationId: archiveDocument
      summary: Archive a synced document kept after a restore while its Drive file is still missing
      parameters:
        - {$ref: '#/components/parameters/KbIdPath'}
        - name: doc_id
          in: path
          required: true
          schema: {type: string, pattern: '^doc_'}
      responses:
        '200':
          description: Archived; restorable for 30 days
          content:
            application/json:
              schema: {$ref: '../../005-tools-knowledge/contracts/knowledge.yaml#/components/schemas/Document'}
        '401': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/Unauthorized'}
        '404': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/NotFound'}
        '409':
          description: '`not_kept` (only documents kept after a restore, whose file is missing, can be archived this way)'
          content:
            application/problem+json:
              schema: {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/schemas/Problem'}

components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}

  parameters:
    ConnectionIdPath:
      name: connection_id
      in: path
      required: true
      schema: {type: string, pattern: '^conn_'}
    KbIdPath:
      name: kb_id
      in: path
      required: true
      schema: {type: string, pattern: '^kb_'}
    SourceIdPath:
      name: source_id
      in: path
      required: true
      schema: {type: string, pattern: '^ksrc_'}
    DrivePageToken:
      name: page_token
      in: query
      schema: {type: string, maxLength: 1024}

  responses:
    ConnectorUnavailable:
      description: '`connector_unavailable`: Google Drive is not configured on this server'
      content:
        application/problem+json:
          schema: {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/schemas/Problem'}
    ConnectionRevoked:
      description: '`connection_revoked`: reconnect the Google account'
      content:
        application/problem+json:
          schema: {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/schemas/Problem'}
    GoogleUnavailable:
      description: '`google_unavailable`: Google did not answer or rate limited the request'
      content:
        application/problem+json:
          schema: {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/schemas/Problem'}

  schemas:
    Connection:
      type: object
      required: [id, provider, kind, account_email, scopes, sheets_access, health, created_at, source_count]
      properties:
        id: {type: string, pattern: '^conn_'}
        provider: {type: string, enum: [google]}
        kind: {type: string, enum: [oauth]}
        account_email: {type: string}
        scopes:
          type: array
          items: {type: string}
          description: Granted access, e.g. read-only Drive
        sheets_access:
          type: boolean
          description: Google Sheets access granted; not used until the Sheets tool ships
        health: {type: string, enum: [healthy, failing, revoked]}
        health_reason: {type: [string, 'null']}
        last_success_at: {type: [string, 'null'], format: date-time}
        last_checked_at: {type: [string, 'null'], format: date-time}
        source_count: {type: integer}
        created_at: {type: string, format: date-time}

    ConnectionUser:
      type: object
      required: [source_id, kb_id, kb_name, root_name]
      properties:
        source_id: {type: string, pattern: '^ksrc_'}
        kb_id: {type: string, pattern: '^kb_'}
        kb_name: {type: string}
        root_name: {type: string}

    ConnectionDetail:
      allOf:
        - {$ref: '#/components/schemas/Connection'}
        - type: object
          required: [users, activity]
          properties:
            users:
              type: array
              items: {$ref: '#/components/schemas/ConnectionUser'}
            activity:
              type: array
              maxItems: 50
              items: {$ref: '#/components/schemas/ConnectorActivity'}

    ConnectorActivity:
      type: object
      required: [action, created_at]
      properties:
        action:
          type: string
          enum: [connection_added, connection_reconnected, connection_removed, source_added, source_removed, held_archive_confirmed, held_archive_cancelled]
        actor_user_id: {type: [string, 'null']}
        detail: {type: object, additionalProperties: true}
        created_at: {type: string, format: date-time}

    DriveFolder:
      type: object
      required: [id, name, kind]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {type: string, enum: [folder, shared_drive]}
        drive_id: {type: [string, 'null']}

    DriveFolderPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/DriveFolder'}
        next_page_token: {type: [string, 'null']}

    KnowledgeSourceCreate:
      type: object
      additionalProperties: false
      required: [connection_id, root_kind, root_id]
      properties:
        connection_id: {type: string, pattern: '^conn_'}
        root_kind: {type: string, enum: [folder, shared_drive]}
        root_id: {type: string, minLength: 1, maxLength: 200}
        drive_id: {type: [string, 'null'], maxLength: 200}
        include_subfolders: {type: boolean, default: true}
        interval_minutes: {type: integer, minimum: 5, maximum: 1440, default: 15}

    KnowledgeSource:
      type: object
      required: [id, kb_id, connection_id, kind, root_kind, root_id, root_name, include_subfolders, interval_minutes, state, document_count, created_at]
      properties:
        id: {type: string, pattern: '^ksrc_'}
        kb_id: {type: string, pattern: '^kb_'}
        connection_id: {type: string, pattern: '^conn_'}
        account_email: {type: string}
        kind: {type: string, enum: [google_drive]}
        root_kind: {type: string, enum: [folder, shared_drive]}
        root_id: {type: string}
        root_name: {type: string}
        include_subfolders: {type: boolean}
        interval_minutes: {type: integer, minimum: 5, maximum: 1440}
        state: {type: string, enum: [pending, syncing, healthy, needs_attention]}
        attention_reason:
          type: [string, 'null']
          enum: [access_lost, mass_archive, kb_full, no_credit, source_too_large, null]
        attention_message: {type: [string, 'null'], description: 'e.g. "This sync would archive 25 of 100 documents"'}
        held_archive:
          type: [object, 'null']
          required: [would_archive, of]
          properties:
            would_archive: {type: integer}
            of: {type: integer}
        document_count: {type: integer, description: Documents currently linked to this source (not archived)}
        last_success_at: {type: [string, 'null'], format: date-time}
        next_sync_at: {type: [string, 'null'], format: date-time}
        last_run: {oneOf: [{$ref: '#/components/schemas/SyncRun'}, {type: 'null'}]}
        created_at: {type: string, format: date-time}

    KnowledgeSourceDetail:
      allOf:
        - {$ref: '#/components/schemas/KnowledgeSource'}
        - type: object
          required: [not_imported]
          properties:
            not_imported:
              type: array
              description: Files currently skipped or failed, with the reason (SC-007)
              maxItems: 500
              items: {$ref: '#/components/schemas/SourceFileIssue'}

    SourceFileIssue:
      type: object
      required: [drive_file_id, name, state, reason]
      properties:
        drive_file_id: {type: string}
        name: {type: string}
        path: {type: string}
        web_view_link: {type: [string, 'null']}
        state: {type: string, enum: [skipped, failed]}
        reason:
          type: string
          enum: [unsupported_type, too_large, export_too_large, shortcut, duplicate, kb_full, workspace_storage_full, download_failed, processing_failed]
        duplicate_of_doc_id: {type: [string, 'null']}
        message: {type: [string, 'null']}

    SyncCounts:
      type: object
      required: [added, updated, unchanged, renamed, archived, held_back, skipped, failed]
      properties:
        added: {type: integer}
        updated: {type: integer}
        unchanged: {type: integer}
        renamed: {type: integer}
        archived: {type: integer}
        held_back: {type: integer}
        skipped: {type: integer}
        failed: {type: integer}

    SyncRun:
      type: object
      required: [id, source_id, trigger, status, started_at, counts]
      properties:
        id: {type: string, pattern: '^ksr_'}
        source_id: {type: string, pattern: '^ksrc_'}
        trigger: {type: string, enum: [first, scheduled, manual, reconnect]}
        status: {type: string, enum: [running, succeeded, held, failed]}
        failure_reason:
          type: [string, 'null']
          enum: [access_lost, connection_revoked, google_unavailable, source_too_large, internal, null]
        started_at: {type: string, format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        counts: {$ref: '#/components/schemas/SyncCounts'}

    SyncRunDetail:
      allOf:
        - {$ref: '#/components/schemas/SyncRun'}
        - type: object
          required: [errors, errors_truncated]
          properties:
            errors:
              type: array
              maxItems: 500
              items: {$ref: '#/components/schemas/SourceFileIssue'}
            errors_truncated: {type: integer}

    DocumentSource:
      type: object
      description: Added to 005's Document as `source` (null for uploads)
      required: [source_id, root_name, path]
      properties:
        source_id: {type: string, pattern: '^ksrc_'}
        root_name: {type: string}
        path: {type: string}
        web_view_link: {type: [string, 'null']}
