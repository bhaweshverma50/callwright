openapi: 3.1.0
info:
  title: Callwright API, auth module
  version: 1.0.0
  description: |
    Thin wrapper over the identity provider (research R5). Adds per-account throttling,
    workspace bootstrap on verification, and global sign-out.
servers:
  - url: /v1
paths:
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      security: []
      summary: Create an account and send a verification email
      description: >-
        On a demo deployment with AUTH_AUTO_VERIFY_EMAIL=true the account is verified at once and
        the response is 200 with session tokens (the workspace and trial credit exist). When the
        email already belongs to an account the password does not open, the answer is the usual
        202. That difference tells a caller the email is taken, one reason auto-verify is for
        demos only (it is refused in production unless explicitly allowed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email, maxLength: 254}
                password: {type: string, minLength: 10, maxLength: 128}
                captcha_token:
                  type: string
                  maxLength: 4096
                  description: >-
                    Cloudflare Turnstile token. Required when the API has TURNSTILE_SECRET_KEY set,
                    ignored otherwise.
      responses:
        '200':
          description: Account verified and signed in (AUTH_AUTO_VERIFY_EMAIL only)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegisteredSession'}
        '202':
          description: Verification email sent (also returned when the email already exists, to avoid enumeration)
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [verification_sent]}
        '400':
          description: >-
            Captcha missing or failed (code captcha_failed; only when TURNSTILE_SECRET_KEY is set),
            or a temporary email domain (code email_not_allowed)
          content:
            application/problem+json:
              schema: {$ref: './core.yaml#/components/schemas/Problem'}
        '422': {$ref: './core.yaml#/components/responses/ValidationFailed'}
        '429': {$ref: './core.yaml#/components/responses/TooManyRequests'}
        '503':
          description: The captcha check could not be reached (code auth_unavailable); try again shortly
          content:
            application/problem+json:
              schema: {$ref: './core.yaml#/components/schemas/Problem'}
  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      security: []
      summary: Confirm the email link; creates the workspace and trial credit on first success
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token_hash]
              properties:
                token_hash: {type: string, minLength: 1}
      responses:
        '200':
          description: Verified and signed in
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '400':
          description: Link invalid, used or expired
          content:
            application/problem+json:
              schema: {$ref: './core.yaml#/components/schemas/Problem'}
  /auth/verify-email/resend:
    post:
      operationId: resendVerification
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        '202':
          description: Sent if the account exists and is unverified
        '429': {$ref: './core.yaml#/components/responses/TooManyRequests'}
  /auth/sign-in:
    post:
      operationId: signIn
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string}
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401':
          description: Wrong email or password (code invalid_credentials)
          content:
            application/problem+json:
              schema: {$ref: './core.yaml#/components/schemas/Problem'}
        '403':
          description: Email not verified (code email_unverified)
          content:
            application/problem+json:
              schema: {$ref: './core.yaml#/components/schemas/Problem'}
        '429': {$ref: './core.yaml#/components/responses/TooManyRequests'}
  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: {type: string}
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: './core.yaml#/components/responses/Unauthorized'}
  /auth/sign-out:
    post:
      operationId: signOut
      tags: [auth]
      security: [{bearerAuth: []}]
      summary: Revoke this session everywhere (all tabs and devices for the session)
      responses:
        '204': {description: Signed out}
        '401': {$ref: './core.yaml#/components/responses/Unauthorized'}
  /auth/password-reset:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        '202': {description: Always returned; a single-use link valid for 60 minutes is sent if the account exists}
        '429': {$ref: './core.yaml#/components/responses/TooManyRequests'}
  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token_hash, new_password]
              properties:
                token_hash: {type: string}
                new_password: {type: string, minLength: 10, maxLength: 128}
      responses:
        '204': {description: Password changed; other sessions are revoked}
        '400':
          description: Link invalid, used or expired
          content:
            application/problem+json:
              schema: {$ref: './core.yaml#/components/schemas/Problem'}
        '422': {$ref: './core.yaml#/components/responses/ValidationFailed'}
  /auth/config:
    get:
      operationId: getAuthConfig
      tags: [auth]
      security: []
      summary: Public sign-in options the web app reads before it shows the sign-in and register pages
      responses:
        '200':
          description: Options
          content:
            application/json:
              schema:
                type: object
                required: [google_signin]
                properties:
                  google_signin:
                    type: boolean
                    description: True when "Continue with Google" is available (GOOGLE_SIGNIN_* set and AUTH_PROVIDER=local)
  /auth/google/start:
    post:
      operationId: startGoogleSignIn
      tags: [auth]
      security: []
      summary: Begin "Sign in with Google" (also sign-up); returns the Google URL to send the browser to
      description: >-
        Stores a single-use state, PKCE verifier (S256) and nonce for 10 minutes. The browser comes
        back to `{WEB_BASE_URL}/auth/google/callback` with `code` and `state`.
      responses:
        '200':
          description: Where to send the browser
          content:
            application/json:
              schema:
                type: object
                required: [authorization_url]
                properties:
                  authorization_url: {type: string, format: uri}
        '404':
          description: Google sign-in is not enabled
          content:
            application/problem+json:
              schema: {$ref: './core.yaml#/components/schemas/Problem'}
        '429': {$ref: './core.yaml#/components/responses/TooManyRequests'}
  /auth/google/complete:
    post:
      operationId: completeGoogleSignIn
      tags: [auth]
      security: []
      summary: Finish "Sign in with Google"; creates the account and workspace on first sign-in
      description: >-
        Exchanges the code with Google and checks the id_token (audience, issuer, expiry, nonce).
        An unknown email gets a confirmed account with no usable password. An existing unverified
        account is confirmed and its password is replaced, so a password set by whoever registered
        it first stops working.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, state]
              properties:
                code: {type: string, minLength: 1, maxLength: 2048}
                state: {type: string, minLength: 1, maxLength: 256}
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '400':
          description: >-
            State missing, expired or already used, or the id_token did not check out (code
            oauth_state_invalid); Google has not verified the email (code google_email_unverified)
          content:
            application/problem+json:
              schema: {$ref: './core.yaml#/components/schemas/Problem'}
        '404':
          description: Google sign-in is not enabled
          content:
            application/problem+json:
              schema: {$ref: './core.yaml#/components/schemas/Problem'}
        '422': {$ref: './core.yaml#/components/responses/ValidationFailed'}
        '429': {$ref: './core.yaml#/components/responses/TooManyRequests'}
        '502':
          description: Google returned an error or timed out (code google_unavailable)
          content:
            application/problem+json:
              schema: {$ref: './core.yaml#/components/schemas/Problem'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Session:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token: {type: string}
        refresh_token: {type: string}
        token_type: {type: string, enum: [bearer]}
        expires_in: {type: integer, description: Seconds until the access token expires}
    RegisteredSession:
      allOf:
        - $ref: '#/components/schemas/Session'
        - type: object
          required: [status]
          properties:
            status: {type: string, enum: [signed_in]}
