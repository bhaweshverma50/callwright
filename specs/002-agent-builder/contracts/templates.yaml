openapi: 3.1.0
info:
  title: Callwright API, templates module
  version: 1.0.0
  description: |
    Platform-curated agent templates (read-only). Using a template is POST /v1/agents with
    template_id (agents module).
servers:
  - url: /v1
paths:
  /templates:
    get:
      operationId: listTemplates
      tags: [templates]
      security: [{bearerAuth: []}]
      parameters:
        - name: category
          in: query
          schema: {$ref: '#/components/schemas/TemplateCategory'}
        - name: search
          in: query
          schema: {type: string, maxLength: 100}
      responses:
        '200':
          description: Active templates ordered by sort_order (no config bodies)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/TemplateSummary'}
        '401': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/Unauthorized'}
  /templates/categories:
    get:
      operationId: listTemplateCategories
      tags: [templates]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Categories that have at least one active template
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, label, count]
                      properties:
                        id: {$ref: '#/components/schemas/TemplateCategory'}
                        label: {type: string, examples: [Healthcare]}
                        count: {type: integer, minimum: 1}
        '401': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/Unauthorized'}
  /templates/{template_id}:
    get:
      operationId: getTemplate
      tags: [templates]
      security: [{bearerAuth: []}]
      parameters:
        - name: template_id
          in: path
          required: true
          schema: {type: string, pattern: '^[a-z0-9-]{3,64}$'}
      responses:
        '200':
          description: Template with its partial config (for preview)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TemplateDetail'}
        '401': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/Unauthorized'}
        '404': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/NotFound'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TemplateCategory:
      type: string
      enum: [healthcare, banking, insurance, retail, telecom, automotive, real_estate, hospitality, support]
    TemplateSummary:
      type: object
      required: [id, name, category, description, icon]
      properties:
        id: {type: string, examples: [healthcare-appointment-booking]}
        name: {type: string}
        category: {$ref: '#/components/schemas/TemplateCategory'}
        description: {type: string}
        icon: {type: string, examples: [stethoscope]}
        language: {type: string}
    TemplateDetail:
      allOf:
        - {$ref: '#/components/schemas/TemplateSummary'}
        - type: object
          required: [config]
          properties:
            config:
              type: object
              description: Partial AgentConfig; always includes prompt, begin_message, start_speaker and language
