openapi: 3.1.0
info:
  title: Callwright API, templates module
  version: 1.0.0
  description: |
    Platform-curated agent templates (read-only). Using a template is POST /v1/agents with
    template_id (agents module).
servers:
  - url: /v1
paths:
  /templates:
    get:
      operationId: listTemplates
      tags: [templates]
      security: [{bearerAuth: []}]
      parameters:
        - name: category
          in: query
          schema: {$ref: '#/components/schemas/TemplateCategory'}
        - name: search
          in: query
          schema: {type: string, maxLength: 100}
        - {$ref: '#/components/parameters/Direction'}
        - {$ref: '#/components/parameters/AgentTypeFilter'}
      responses:
        '200':
          description: Active templates ordered by sort_order (no config bodies)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/TemplateSummary'}
        '401': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/Unauthorized'}
  /templates/categories:
    get:
      operationId: listTemplateCategories
      tags: [templates]
      security: [{bearerAuth: []}]
      parameters:
        - name: search
          in: query
          schema: {type: string, maxLength: 100}
        - {$ref: '#/components/parameters/Direction'}
        - {$ref: '#/components/parameters/AgentTypeFilter'}
      responses:
        '200':
          description: |
            Categories that have at least one active template under the given filters. Counts
            follow the same filters as the list (without the category), so a chip's count is
            what selecting it would return.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, label, count]
                      properties:
                        id: {$ref: '#/components/schemas/TemplateCategory'}
                        label: {type: string, examples: [Healthcare]}
                        count: {type: integer, minimum: 1}
        '401': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/Unauthorized'}
  /templates/{template_id}:
    get:
      operationId: getTemplate
      tags: [templates]
      security: [{bearerAuth: []}]
      parameters:
        - name: template_id
          in: path
          required: true
          schema: {type: string, pattern: '^[a-z0-9-]{3,64}$'}
      responses:
        '200':
          description: Template with its partial config (for preview)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TemplateDetail'}
        '401': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/Unauthorized'}
        '404': {$ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/NotFound'}
components:
  parameters:
    Direction:
      name: direction
      in: query
      schema: {type: string, enum: [inbound, outbound]}
    AgentTypeFilter:
      name: agent_type
      in: query
      schema: {type: string, enum: [single_prompt, flow]}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TemplateCategory:
      type: string
      enum: [automotive, banking, ecommerce, healthcare, telecom, insurance, real_estate, hospitality, logistics, utilities]
      description: |
        Categories (FR-046); labels Automotive, Banking, E-commerce, Healthcare, Telecom,
        Insurance, Real estate, Travel and hospitality, Logistics and delivery, Utilities
    TemplateSummary:
      type: object
      required: [id, name, category, description, icon, direction, agent_type]
      properties:
        id: {type: string, examples: [healthcare-triage-booking]}
        name: {type: string}
        category: {$ref: '#/components/schemas/TemplateCategory'}
        description: {type: string}
        icon: {type: string, examples: [stethoscope]}
        direction:
          type: string
          enum: [inbound, outbound]
          description: Informs the preview; not part of the agent config
        agent_type:
          type: string
          enum: [single_prompt, flow]
          description: |
            The type of agent the template creates. A flow template's config also carries the
            flow graph (see TemplateConfig).
        language: {type: string}
    TemplateDetail:
      allOf:
        - {$ref: '#/components/schemas/TemplateSummary'}
        - type: object
          required: [config]
          properties:
            config: {$ref: '#/components/schemas/TemplateConfig'}
    TemplateConfig:
      type: object
      description: |
        Partial AgentConfig (FR-046); a flow template also carries `graph` (a flow graph, see the
        flows contract) in place of the greeting-driven fields. Always includes agent_name, language, llm.provider,
        llm.model, prompt, begin_message, start_speaker, stt.provider, tts.provider,
        tts.model and dynamic_variables with defaults. Never includes llm.temperature for a
        fixed-temperature model, nor tts.voice_id (the language default voice applies).
      required: [agent_name, language, llm, prompt, stt, tts, dynamic_variables]
      properties:
        graph:
          type: object
          description: Flow templates only; the graph a new flow agent starts with
        agent_name: {type: string}
        language: {type: string}
        llm:
          type: object
          required: [provider, model]
          properties:
            provider: {type: string}
            model: {type: string}
        prompt: {type: string}
        begin_message: {type: [string, 'null']}
        start_speaker: {type: string, enum: [agent, user]}
        stt:
          type: object
          required: [provider]
          properties:
            provider: {type: string}
            model: {type: [string, 'null']}
        tts:
          type: object
          required: [provider, model]
          properties:
            provider: {type: string}
            model: {type: string}
        dynamic_variables:
          type: array
          items: {$ref: './agents.yaml#/components/schemas/DynamicVariable'}
