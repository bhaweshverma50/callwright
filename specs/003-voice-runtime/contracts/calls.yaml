openapi: 3.1.0
info:
  title: Callwright API, calls module (write side, internal)
  version: 0.1.0
  description: >
    Fragment owned by 003-voice-runtime. Internal endpoint the voice worker calls when it
    starts a job. Authenticated with the service token, never with a user JWT. The read side of
    the calls module (list, detail, recording URLs) is defined by 006-calls-analytics; its
    recording URL endpoints return the `CallRecordingState` schema defined here, which reports
    `not_recorded` (with no URL) for calls whose effective recording setting was off.
servers:
  - url: https://api.callwright.example/v1
security:
  - serviceToken: []
paths:
  /internal/calls/claim:
    post:
      operationId: claimCall
      summary: Claim a dispatched job and receive the frozen runtime configuration
      description: >
        For API-created calls (web, outbound) the dispatch metadata carries `call_id`; the API
        marks the call claimed and returns its configuration. For SIP-created calls (inbound
        phone, WhatsApp) the API routes the call with the channel's inbound router (010), runs
        admission, creates the call and returns the configuration, or `admitted: false` with the
        reason. Idempotent per `job_id`: a repeated claim returns the same body.
      tags: [calls-internal]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
      responses:
        '200':
          description: Claim result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '401':
          $ref: '../../001-platform-foundation/contracts/core.yaml#/components/responses/Problem'
        '404':
          description: Unknown `call_id` in metadata
          content:
            application/problem+json:
              schema:
                $ref: '../../001-platform-foundation/contracts/core.yaml#/components/schemas/Problem'
        '409':
          description: Call already claimed by a different job, or already terminal
          content:
            application/problem+json:
              schema:
                $ref: '../../001-platform-foundation/contracts/core.yaml#/components/schemas/Problem'
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      description: Static service token shared by API and voice worker.
  schemas:
    ClaimRequest:
      type: object
      additionalProperties: false
      required: [job_id, room_name, worker_id, dispatch_metadata]
      properties:
        job_id:
          type: string
        room_name:
          type: string
        worker_id:
          type: string
        dispatch_metadata:
          type: object
          description: >
            Opaque JSON from the dispatch. Either `{call_id}` or
            `{channel: sip_inbound|whatsapp, route_ref}`.
          additionalProperties: true
        sip:
          $ref: '#/components/schemas/SipAttributes'
    SipAttributes:
      type: object
      description: Attributes of the SIP participant when the room was created by a SIP call.
      properties:
        call_id:
          type: string
          description: Carrier call identifier.
        trunk_id:
          type: string
        trunk_phone_number:
          type: string
          description: The called number (our number), E.164.
        caller_number:
          type: string
          description: The calling number, E.164 when available.
        participant_identity:
          type: string
    ClaimResponse:
      type: object
      required: [admitted, call_id]
      properties:
        admitted:
          type: boolean
        call_id:
          type: string
          pattern: '^call_[0-9A-HJKMNP-TV-Z]{26}$'
        refusal:
          type: object
          description: Present when `admitted` is false. The worker hangs up without speaking.
          properties:
            disconnect_reason:
              type: string
              enum: [insufficient_credit, concurrency_limit, error]
            diagnostic:
              type: string
        runtime:
          $ref: '#/components/schemas/RuntimeConfig'
    RuntimeConfig:
      type: object
      description: >
        Everything the worker needs, resolved by the API, which owns the catalogs and defaults
        (shape defined once in packages/contract, `callwright_contract.protocol`). The worker keeps
        no defaults or tables of its own.
      required:
        [channel, direction, agent_id, agent_version_id, config, variables, limits, controls, stt_auto_rules, heartbeat_interval_s]
      properties:
        channel:
          type: string
          enum: [web, sip_inbound, sip_outbound, whatsapp]
        direction:
          type: string
          enum: [inbound, outbound]
        from_number:
          type: [string, 'null']
        to_number:
          type: [string, 'null']
        agent_id:
          type: string
        agent_version_id:
          type: string
        agent_type:
          type: string
          enum: [single_prompt, flow]
        config:
          type: object
          description: >
            Frozen AgentConfig from the agent version (schema owned by 002-agent-builder) with
            the language and every vendor resolved (`stt.model` stays null for Auto) and the
            call-behaviour, keypad, voicemail and background-audio defaults applied.
          additionalProperties: true
        variables:
          type: object
          description: Resolved dynamic variables including built-ins.
          additionalProperties:
            type: string
        limits:
          type: object
          required: [end_on_silence_s, max_duration_s, ring_duration_ms]
          properties:
            end_on_silence_s:
              type: integer
              minimum: 10
              maximum: 300
            max_duration_s:
              type: integer
              minimum: 30
              maximum: 3600
            ring_duration_ms:
              type: integer
              minimum: 0
              maximum: 30000
        background_audio_url:
          type: [string, 'null']
          format: uri
          description: Signed URL (10 minutes) for an uploaded ambience file, else null.
        caller_join_timeout_s:
          type: integer
          default: 60
          description: Web calls only; fail the call if the browser has not joined by then.
        outbound_dial:
          description: Set by 010-channels for `sip_outbound` calls; the worker dials this.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/OutboundDial'
        heartbeat_interval_s:
          type: integer
          default: 10
        recording_enabled:
          type: boolean
          description: >
            Effective recording setting resolved at admission from the agent version's
            `advanced.recording` override (002) and the workspace's `recording_default` (001).
            Informational for the worker: the API starts egress only when true; the worker never
            records.
        stt_resolved_model:
          type: [string, 'null']
          description: The speech recognition model Auto resolved to for the agent's language.
        controls:
          type: array
          description: >
            002's control range table (data-model 8.6). The worker clamps call behaviour and
            segment overrides to it.
          items: {$ref: '#/components/schemas/RuntimeControlRange'}
        stt_auto_rules:
          type: object
          description: >
            How speech recognition Auto picks a model, per provider (002 data-model 8.3), for
            flow nodes and overrides that change the language or provider. The same rules
            admission used, so the worker runs the model admission priced.
          additionalProperties: {$ref: '#/components/schemas/SttAutoRule'}
        simulation:
          type: boolean
          default: false
          description: Text runs (008) and the offline harness; tools answer without side effects.
        language_options:
          type: array
          description: >
            Languages the caller can switch to during the call (012), the agent's own language
            first. Empty when language switching is off, the agent is a flow, or no other language
            is supported by both the agent's speech recognition and voice.
          items: {$ref: '#/components/schemas/LanguageOption'}
        caller_language:
          type: [string, 'null']
          description: >
            Phone calls only (012): the caller's saved language when it is one of
            `language_options` and differs from the agent's language. The call starts in it
            (speech recognition, replies and a greeting with the same meaning).
    RuntimeControlRange:
      type: object
      description: One row of 002's ControlRange (voices.yaml) without its display fields.
      required: [path, min, max]
      properties:
        path: {type: string, description: JSON Pointer into the agent config, examples: [/tts/speed]}
        min: {type: number}
        max: {type: number}
        step: {type: [number, 'null']}
    SttAutoRule:
      type: object
      description: >
        The language code exactly, then its base (`en-US` -> `en`), then the default; a model
        whose `languages` does not list the language counts as none.
      properties:
        default: {type: [string, 'null']}
        by_language:
          type: object
          additionalProperties: {type: string}
        languages:
          type: object
          description: Languages each model covers.
          additionalProperties:
            type: array
            items: {type: string}
    LanguageOption:
      type: object
      required: [code, label, stt_model, tts_model]
      properties:
        code: {type: string, examples: [hi, en-US]}
        label: {type: string, examples: [Hindi]}
        stt_model:
          type: [string, 'null']
          description: Speech recognition model for this language (the agent's model when it covers it).
        tts_model:
          type: [string, 'null']
          description: Voice model for this language (a multilingual model when the agent's is English only).
    CallRecordingState:
      type: object
      description: >
        Recording state of one call, returned by 006's recording URL endpoints through
        `calls.service.recording_state()`. When `recording_status` is `not_recorded` the call was
        deliberately not recorded (recording off for the workspace or agent) and `recording_url`
        is null; this is distinct from `failed` ("recording unavailable").
      required: [call_id, recording_enabled, recording_setting_source, recording_status, recording_url]
      properties:
        call_id:
          type: string
          pattern: '^call_[0-9A-HJKMNP-TV-Z]{26}$'
        recording_enabled:
          type: boolean
        recording_setting_source:
          type: string
          enum: [workspace, agent]
        recording_status:
          type: string
          enum: [none, recording, available, failed, not_recorded]
        recording_url:
          type: [string, 'null']
          format: uri
          description: Signed, valid 10 minutes; null unless `recording_status` is `available`.
        expires_at:
          type: [string, 'null']
          format: date-time
    OutboundDial:
      type: object
      required: [sip_trunk_id, to_number, from_number, ring_timeout_s]
      properties:
        sip_trunk_id:
          type: string
        to_number:
          type: string
        from_number:
          type: string
        ring_timeout_s:
          type: integer
          minimum: 10
          maximum: 60
