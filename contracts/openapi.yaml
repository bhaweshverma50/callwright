        inbound_agent_id:
          type: string
          pattern: ^agt_[0-9A-HJKMNP-TV-Z]{26}$
        outbound_agent_id:
          type: string
          pattern: ^agt_[0-9A-HJKMNP-TV-Z]{26}$
        inbound_webhook_url:
          type: string
          format: uri
          maxLength: 2048
    PhoneNumberStatus:
      type: string
