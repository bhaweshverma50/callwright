  /sessions/web-call:
    post:
      operationId: createWebCall
      summary: Start a browser test call for an agent
      description: 'Runs admission (email verified, version resolvable and priced, balance above zero,
        under concurrency limit), creates the call in `queued`, creates the room, dispatches the voice
        worker and returns a join credential. Refused requests still create a call record with status
        `failed` and the reason, and the problem body carries its `call_id`.

        '
      tags:
      - sessions
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebCallRequest'
            examples:
              draft:
                value:
                  agent_id: agt_01JABCDEF0123456789ABCDEFG
                  version: draft
                  dynamic_variables:
                    customer_name: Priya
      responses:
