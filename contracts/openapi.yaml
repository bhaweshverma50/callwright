openapi: 3.1.0
info:
  title: Callwright API
  version: 1.0.0
  description: Assembled from the per-feature fragments in specs/*/contracts/.
servers:
- url: /v1
tags:
- name: admin
- name: agent_versions
- name: agents
- name: auth
- name: billing
- name: call-events-internal
- name: calls-internal
- name: core
- name: livekit-hooks
- name: llms
- name: pricing
- name: prompt_ai
- name: sessions
- name: templates
- name: usage
- name: voices
- name: webhooks
- name: workspaces
paths:
  /admin/pricing/versions:
    get:
      operationId: listPricingVersions
      tags:
      - pricing
      - admin
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Versions newest first
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageMeta'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/CatalogVersionSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-spec: 001-platform-foundation
    post:
      operationId: publishPricingVersion
      tags:
      - pricing
      - admin
      security:
      - bearerAuth: []
      summary: Publish a complete new catalog version (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - effective_from
              - entries
              properties:
                effective_from:
                  type: string
                  format: date-time
                  description: Must be later than the current version's effective_from and not in the
                    past.
                notes:
                  type: string
                  maxLength: 500
                entries:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/CatalogEntry'
      responses:
        '201':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      x-spec: 001-platform-foundation
  /agents:
    get:
      operationId: listAgents
      tags:
      - agents
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: search
        in: query
        description: Partial name (case-insensitive) or an exact agent id
        schema:
          type: string
          maxLength: 100
      - name: type
        in: query
        schema:
          $ref: '#/components/schemas/AgentType'
      responses:
        '200':
          description: Agents, most recently updated first
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageMeta'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/AgentSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-spec: 002-agent-builder
    post:
      operationId: createAgent
      tags:
      - agents
      security:
      - bearerAuth: []
      summary: Create an agent from defaults, a template or a given config; records version 1
      description: 'The resulting config must pass blocking validation (a blank form is saved with this
        call on its first save).

        Repeating the request with the same Idempotency-Key returns the agent created the first time (FR-038).

        '
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - type
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                type:
                  $ref: '#/components/schemas/AgentType'
                language:
                  type: string
                  description: Default en-US; seeds speech and voice defaults
                template_id:
                  type: string
                  pattern: ^[a-z0-9-]{3,64}$
                  description: Overlay this template on the defaults (single_prompt only)
                config:
                  description: Optional partial config overlaid on defaults (and on the template if given)
                  type: object
      responses:
        '201':
          description: Created; ETag carries draft_revision
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: template_id not found or inactive
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      x-spec: 002-agent-builder
  /agents/defaults:
    get:
      operationId: getAgentDefaults
      tags:
      - agents
      security:
      - bearerAuth: []
      summary: Fully defaulted AgentConfig for a type and language (blank form)
      parameters:
      - name: type
        in: query
        schema:
          $ref: '#/components/schemas/AgentType'
      - name: language
        in: query
        schema:
          type: string
          default: en-US
      responses:
        '200':
          description: Defaults
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-spec: 002-agent-builder
  /agents/validate:
    post:
      operationId: validateAgentConfig
      tags:
      - agents
      security:
      - bearerAuth: []
      summary: Validate an unsaved config; same rules as save and publish (research R10)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              - config
              properties:
                type:
                  $ref: '#/components/schemas/AgentType'
                config:
                  type: object
                agent_id:
                  $ref: '#/components/schemas/AgentId'
                  description: Optional; lets attachment validators check workspace references
      responses:
        '200':
          description: Result (always 200; `valid` says whether a save would pass)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigValidationResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-spec: 002-agent-builder
  /agents/{agent_id}:
    parameters:
    - $ref: '#/components/parameters/AgentIdPath'
    get:
      operationId: getAgent
      tags:
      - agents
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Agent with draft config, versions pointers and current publish blockers
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-spec: 002-agent-builder
    patch:
      operationId: renameAgent
      tags:
      - agents
      security:
      - bearerAuth: []
      summary: Change metadata only (no version is recorded)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSummary'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      x-spec: 002-agent-builder
    delete:
      operationId: deleteAgent
      tags:
      - agents
      security:
      - bearerAuth: []
      summary: Soft delete; versions are kept for call history
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Agent is attached to a live channel (code agent_in_use)
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  properties:
                    attachments:
                      type: array
                      items:
                        type: object
                        required:
                        - kind
                        - id
                        - label
                        properties:
                          kind:
                            type: string
                            examples:
                            - phone_number
                            - whatsapp_channel
                            - outbound
                          id:
                            type: string
                          label:
                            type: string
      x-spec: 002-agent-builder
  /agents/{agent_id}/draft:
    parameters:
    - $ref: '#/components/parameters/AgentIdPath'
    put:
      operationId: saveAgentDraft
      tags:
      - agents
      security:
      - bearerAuth: []
      summary: Save the draft; records a new version when the config changed
      parameters:
      - name: If-Match
        in: header
        required: true
        description: The draft_revision ETag the editor loaded
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - config
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                config:
                  $ref: '#/components/schemas/AgentConfig'
                note:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Saved (created=false means nothing changed)
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          description: Draft changed since it was loaded (code draft_changed); body has current_revision
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Problem'
                - type: object
                  properties:
                    current_revision:
                      type: integer
        '422':
          $ref: '#/components/responses/ValidationFailed'
      x-spec: 002-agent-builder
  /agents/{agent_id}/duplicate:
    parameters:
    - $ref: '#/components/parameters/AgentIdPath'
    post:
      operationId: duplicateAgent
      tags:
      - agents
      security:
      - bearerAuth: []
      description: No confirmation step (non-destructive). The same Idempotency-Key returns the first
        copy (FR-038).
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                  description: Default "<name> (copy)"
      responses:
        '201':
          description: New agent with version 1 and no published version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDetail'
        '404':
          $ref: '#/components/responses/NotFound'
      x-spec: 002-agent-builder
  /agents/{agent_id}/published-version:
    parameters:
    - $ref: '#/components/parameters/AgentIdPath'
    put:
      operationId: publishAgentVersion
      tags:
      - agent_versions
      security:
      - bearerAuth: []
      summary: Publish (pin) a version for live channels
      description: Publish blockers are re-evaluated now against the current catalog and attachments.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - version_id
              properties:
                version_id:
                  $ref: '#/components/schemas/AgentVersionId'
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSummary'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Version has publish blockers (code publish_blocked); `errors` lists them
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-spec: 002-agent-builder
    delete:
      operationId: unpublishAgent
      tags:
      - agent_versions
      security:
      - bearerAuth: []
      summary: Remove the published version; live channels then refuse calls for this agent
      responses:
        '204':
          description: Unpublished
        '404':
          $ref: '#/components/responses/NotFound'
      x-spec: 002-agent-builder
  /agents/{agent_id}/versions:
    parameters:
    - $ref: '#/components/parameters/AgentIdPath'
    get:
      operationId: listAgentVersions
      tags:
      - agent_versions
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: include_test
        in: query
        description: Include versions created only for test calls
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Versions newest first (no config bodies)
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageMeta'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/VersionSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-spec: 002-agent-builder
  /agents/{agent_id}/versions/{version_id}:
    parameters:
    - $ref: '#/components/parameters/AgentIdPath'
    - $ref: '#/components/parameters/VersionIdPath'
    get:
      operationId: getAgentVersion
      tags:
      - agent_versions
      security:
      - bearerAuth: []
      description: Readable even after the agent is deleted, so call detail pages can show the config.
      responses:
        '200':
          description: Full version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-spec: 002-agent-builder
  /agents/{agent_id}/versions/{version_id}/diff:
    parameters:
    - $ref: '#/components/parameters/AgentIdPath'
    - $ref: '#/components/parameters/VersionIdPath'
    get:
      operationId: diffAgentVersion
      tags:
      - agent_versions
      security:
      - bearerAuth: []
      summary: Changes from `against` to this version (keyed list matching, research R12)
      parameters:
      - name: against
        in: query
        required: true
        description: Another version id of the same agent, or the literal `draft`
        schema:
          oneOf:
          - $ref: '#/components/schemas/AgentVersionId'
          - const: draft
      responses:
        '200':
          description: Ordered change list
          content:
            application/json:
              schema:
                type: object
                required:
                - from
                - to
                - changes
                properties:
                  from:
                    type: string
                    description: Version id or "draft"
                  to:
                    $ref: '#/components/schemas/AgentVersionId'
                  changes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Change'
        '404':
          $ref: '#/components/responses/NotFound'
      x-spec: 002-agent-builder
  /agents/{agent_id}/versions/{version_id}/restore:
    parameters:
    - $ref: '#/components/parameters/AgentIdPath'
    - $ref: '#/components/parameters/VersionIdPath'
    post:
      operationId: restoreAgentVersion
      tags:
      - agent_versions
      security:
      - bearerAuth: []
      summary: Copy this version into the draft as a new version; optionally publish it
      parameters:
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 500
                publish:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Restored; `version` is the new version
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          description: Draft changed since it was loaded (code draft_changed)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: publish=true but the restored version has publish blockers (restore is not applied)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-spec: 002-agent-builder
  /analytics/catalog:
    get:
      operationId: getAnalyticsCatalog
      summary: Metrics, groupings, filters and periods the assistant can use
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Catalog
          content:
            application/json:
              schema:
                type: object
                required:
                - metrics
                - group_by
                - filters
                - periods
                - suggested_questions
                properties:
                  metrics:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          $ref: '#/components/schemas/MetricName'
                        label:
                          type: string
                        unit:
                          type: string
                          enum:
                          - count
                          - seconds
                          - usd
                          - ms
                          - ratio
                  group_by:
                    type: array
                    items:
                      $ref: '#/components/schemas/Dimension'
                  filters:
                    type: array
                    items:
                      type: string
                  periods:
                    type: array
                    items:
                      type: string
                  suggested_questions:
                    type: array
                    items:
                      type: string
      x-spec: 006-calls-analytics
  /analytics/chat:
    post:
      operationId: askAnalytics
      summary: Ask a question about the workspace's data (charged as feature analytics_chat)
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyRequired'
        description: Same key returns the stored answer and is charged at most once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Answer (outcome answered or declined)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatAnswer'
        '402':
          description: Balance at or below zero (problem type insufficient_credit)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: More than 20 questions per user per minute
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Model provider unavailable; not charged (problem type assistant_unavailable)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-spec: 006-calls-analytics
  /auth/password-reset:
    post:
      operationId: requestPasswordReset
      tags:
      - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Always returned; a single-use link valid for 60 minutes is sent if the account
            exists
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-spec: 001-platform-foundation
  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags:
      - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token_hash
              - new_password
              properties:
                token_hash:
                  type: string
                new_password:
                  type: string
                  minLength: 10
                  maxLength: 128
      responses:
        '204':
          description: Password changed; other sessions are revoked
        '400':
          description: Link invalid, used or expired
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      x-spec: 001-platform-foundation
  /auth/refresh:
    post:
      operationId: refreshSession
      tags:
      - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-spec: 001-platform-foundation
  /auth/register:
    post:
      operationId: register
      tags:
      - auth
      security: []
      summary: Create an account and send a verification email
      description: On a demo deployment with AUTH_AUTO_VERIFY_EMAIL=true the account is verified at once
        and the response is 200 with session tokens (the workspace and trial credit exist). When the email
        already belongs to an account the password does not open, the answer is the usual 202. That difference
        tells a caller the email is taken, one reason auto-verify is for demos only (it is refused in
        production unless explicitly allowed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  minLength: 10
                  maxLength: 128
      responses:
        '200':
          description: Account verified and signed in (AUTH_AUTO_VERIFY_EMAIL only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredSession'
        '202':
          description: Verification email sent (also returned when the email already exists, to avoid
            enumeration)
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - verification_sent
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-spec: 001-platform-foundation
  /auth/sign-in:
    post:
      operationId: signIn
      tags:
      - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          description: Wrong email or password (code invalid_credentials)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Email not verified (code email_unverified)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-spec: 001-platform-foundation
  /auth/sign-out:
    post:
      operationId: signOut
      tags:
      - auth
      security:
      - bearerAuth: []
      summary: Revoke this session everywhere (all tabs and devices for the session)
      responses:
        '204':
          description: Signed out
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-spec: 001-platform-foundation
  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags:
      - auth
      security: []
      summary: Confirm the email link; creates the workspace and trial credit on first success
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token_hash
              properties:
                token_hash:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Verified and signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: Link invalid, used or expired
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-spec: 001-platform-foundation
  /auth/verify-email/resend:
