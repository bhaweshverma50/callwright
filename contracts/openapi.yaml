      - $ref: '#/components/parameters/PageSize'
      - name: search
        in: query
        description: Partial name (case-insensitive) or an exact agent id
        schema:
          type: string
          maxLength: 100
      - name: type
        in: query
        schema:
          $ref: '#/components/schemas/AgentType'
      - name: status
        in: query
        description: live (has a published version), draft (never published) or attention (the draft has
          publish blockers)
        schema:
          type: string
          enum:
          - live
          - draft
          - attention
      - name: sort
        in: query
        description: updated (newest first, default), created (newest first) or name (A to Z)
        schema:
          type: string
          enum:
          - updated
          - name
          - created
          default: updated
      responses:
        '200':
          description: Agents, most recently updated first unless sorted otherwise
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageMeta'
                - type: object
                  required:
                  - items
                  - counts
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/AgentSummary'
                    counts:
                      description: Agents per status for the same search and type (status ignored), for
