      - server_time
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/LiveCall'
        count:
          type: integer
          minimum: 0
          description: All calls on air, even beyond the 50 listed.
        server_time:
          type: string
          format: date-time
          description: The server clock, so clients can correct their own when ticking durations.
    LivekitWebhookEvent:
      type: object
      required:
      - event
      - id
      - createdAt
      description: 'Subset of the LiveKit webhook payload the API reads. Handled events: `room_finished`
        (end any open call for the room with reason `error` if the worker did not report an end), `participant_left`
        (logged; the worker reports hangups), `egress_started`, `egress_ended` (set recording status and
        key; ignored for calls with `recording_enabled = false`, whose status stays `not_recorded`, since
        no egress is started for them).

        '
      properties:
        event:
          type: string
          examples:
          - room_finished
          - participant_left
          - egress_started
          - egress_ended
        id:
          type: string
        createdAt:
          type:
          - integer
          - string
        room:
          type: object
          properties:
            name:
              type: string
            sid:
              type: string
            metadata:
              type: string
        participant:
          type: object
          properties:
            identity:
              type: string
            kind:
              type: string
            attributes:
              type: object
              additionalProperties:
                type: string
        egressInfo:
          type: object
          properties:
            egressId:
              type: string
            roomName:
              type: string
            status:
              type: string
              examples:
              - EGRESS_COMPLETE
              - EGRESS_FAILED
              - EGRESS_ABORTED
              - EGRESS_LIMIT_REACHED
            error:
              type: string
            fileResults:
              type: array
              items:
                type: object
                properties:
                  filename:
                    type: string
                  location:
                    type: string
                  duration:
                    type:
                    - integer
                    - string
                  size:
                    type:
                    - integer
                    - string
    LlmCatalog:
      type: object
      required:
      - default
      - providers
