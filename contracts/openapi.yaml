          type: string
          format: date-time
        content_type:
          type: string
          examples:
          - audio/ogg
          - audio/mpeg
        filename:
          type: string
          examples:
          - call_01JABCDEFGHJKMNPQRSTVWXYZ0.ogg
        duration_s:
          type:
          - integer
          - 'null'
    RegisteredAction:
      type: object
