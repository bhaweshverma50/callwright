      - bearerAuth: []
      summary: Publish a complete new catalog version (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - effective_from
              - entries
              properties:
                effective_from:
                  type: string
                  format: date-time
