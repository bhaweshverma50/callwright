          - keypad
        ref:
          type: string
        name:
          type: string
        arguments:
          type: object
          additionalProperties: true
        output:
          type: string
          maxLength: 8192
        is_error:
          type: boolean
        duration_ms:
          type: integer
        from_node_id:
          type: string
        to_node_id:
          type: string
        label:
          type: string
        event:
          type: string
