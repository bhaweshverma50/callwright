        '400':
          description: Link invalid, used or expired
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      x-spec: 001-platform-foundation
  /auth/refresh:
