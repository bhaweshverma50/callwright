      type: string
      enum:
      - dnc_listed
      - outside_calling_hours
    OutboundCallAccepted:
      type: object
      required:
      - call_id
      - status
      - to_number
      - from_number
      - agent_id
      - agent_version_id
      - phone_number_id
      properties:
        call_id:
          type: string
          pattern: ^call_[0-9A-HJKMNP-TV-Z]{26}$
        status:
          type: string
          enum:
          - queued
          - ringing
          - in_progress
          - ended
          - processing
          - completed
          - failed
          - no_answer
          - busy
          - voicemail
        to_number:
          $ref: '#/components/schemas/E164'
        from_number:
          $ref: '#/components/schemas/E164'
        agent_id:
          type: string
        agent_version_id:
          type: string
        phone_number_id:
          type: string
        missing_variables:
          type: array
          items:
            type: string
        idempotent_replay:
          type: boolean
          description: True when this response replays an earlier request with the same key.
        recipient_timezones:
          type: array
          items:
            type: string
          description: Zone(s) the calling-hour check used.
        timezone_source:
          type: string
          enum:
          - override
          - number_region
    OutboundCallRequest:
      type: object
      additionalProperties: false
      required:
      - to_number
      - from_number
      properties:
        to_number:
          $ref: '#/components/schemas/E164'
        from_number:
          description: An active imported number in this workspace.
          allOf:
          - $ref: '#/components/schemas/E164'
        agent_id:
          type: string
          pattern: ^agt_[0-9A-HJKMNP-TV-Z]{26}$
          description: Defaults to the from number's outbound agent.
        dynamic_variables:
          type: object
          maxProperties: 50
          propertyNames:
            pattern: ^[A-Za-z_][A-Za-z0-9_]{0,63}$
          additionalProperties:
            type: string
            maxLength: 2000
        metadata:
          type: object
          maxProperties: 20
          additionalProperties: true
          description: Max 4 KB serialized; echoed in webhooks.
        ring_timeout_s:
          type: integer
          minimum: 10
          maximum: 60
          default: 30
        recipient_timezone:
          type: string
          maxLength: 64
          description: 'IANA timezone name (for example `America/New_York`) used for the calling-hour
            check instead of the zone derived from `to_number`. Unknown names are rejected with `invalid-timezone`.

            '
    OutboundDial:
      type: object
      required:
      - sip_trunk_id
      - to_number
      - from_number
      - ring_timeout_s
      properties:
        sip_trunk_id:
          type: string
        to_number:
          type: string
        from_number:
          type: string
        ring_timeout_s:
          type: integer
          minimum: 10
          maximum: 60
    Overrides:
      type: object
      properties:
        llm:
          type:
          - object
          - 'null'
          properties:
            provider:
              type: string
            model:
              type: string
            temperature:
              type:
              - number
              - 'null'
              minimum: 0
              maximum: 2
        tts:
          type:
          - object
          - 'null'
          description: Numbers are checked against the 002 controls range table (validate_override)
          properties:
            provider:
              type: string
            model:
              type:
              - string
              - 'null'
            voice_id:
              type: string
            speed:
              type:
              - number
              - 'null'
            volume:
              type:
              - number
              - 'null'
            expressiveness:
              type:
              - number
              - 'null'
        stt:
          type:
          - object
          - 'null'
          properties:
            provider:
              type: string
            model:
              type:
              - string
              - 'null'
        language:
          type:
          - string
          - 'null'
    PageMeta:
      type: object
      required:
      - total
      - page
      - page_size
      - total_pages
      properties:
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        total_pages:
          type: integer
          minimum: 0
    PairCounts:
