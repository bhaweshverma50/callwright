        node_path:
          type: array
          items:
            type: object
            properties:
              node_id:
                type: string
              node_label:
                type: string
    CostBreakdown:
      type: object
      required:
      - catalog_version
      - duration_ms
      - billed_seconds
      - duration_minutes
      - lines
      - total_usd
      properties:
        call_id:
          oneOf:
          - $ref: '#/components/schemas/CallId'
          - type: 'null'
        catalog_version:
          type: integer
        duration_ms:
          type: integer
        billed_seconds:
          type: integer
          description: ceil(duration_ms / 1000)
        duration_minutes:
          type: string
          examples:
          - '4.516667'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CostLine'
        total_usd:
          $ref: '#/components/schemas/MoneyUsd'
          description: Sum of line cost_usd values
    CostLine:
      type: object
      required:
      - component
      - provider
      - model
      - rate_per_min_usd
      - billed_minutes
      - cost_usd
      - surcharge_usd
      - bundle_multiplier
      - meters
      properties:
        component:
          $ref: '#/components/schemas/Component'
        provider:
          type: string
        model:
          type:
          - string
          - 'null'
        rate_per_min_usd:
          $ref: '#/components/schemas/MoneyUsd'
        billed_minutes:
          type: string
          description: max(duration_minutes, usage / bundle_per_min) as a decimal string, 6 places
          examples:
          - '5.117400'
        cost_usd:
          $ref: '#/components/schemas/MoneyUsd'
          description: rate times billed_minutes, rounded up to $0.001
        surcharge_usd:
          $ref: '#/components/schemas/MoneyUsd'
          description: rate times (billed_minutes minus duration_minutes); informational, already inside
            cost_usd
        bundle_multiplier:
          type: string
          description: billed_minutes / duration_minutes, e.g. "1.1330"
        meters:
          type: array
          items:
            $ref: '#/components/schemas/MeterUsage'
    CostView:
      type: object
