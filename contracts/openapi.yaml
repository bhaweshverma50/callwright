        context_window:
          type:
          - integer
          - 'null'
        input_tokens_bundle_per_min:
          type:
          - integer
          - 'null'
          description: From pricing; used by the surcharge-risk notice
        price_per_min_usd:
          oneOf:
          - $ref: '#/components/schemas/MoneyUsd'
          - type: 'null'
          description: null means price unavailable
        withdrawn:
          type: boolean
    LlmProvider:
      type: object
      required:
      - id
      - label
      - models
      properties:
        id:
          type: string
          examples:
          - azure_openai
          - openai
        label:
          type: string
        available:
          type: boolean
          description: False when the voice worker holds no credentials for this provider on this deployment
            (agents on it cannot take live calls); true when the deployment does not gate
        models:
          type: array
          items:
            $ref: '#/components/schemas/LlmModel'
    Me:
      type: object
      required:
      - user
      - workspace
      - balance_usd
      properties:
        user:
          $ref: '#/components/schemas/User'
        workspace:
          $ref: '#/components/schemas/Workspace'
        balance_usd:
          $ref: '#/components/schemas/MoneyUsd'
    MeterUsage:
      type: object
      required:
      - unit
