      - bearerAuth: []
      responses:
        '200':
          description: Current balance, derived from the ledger
          content:
            application/json:
              schema:
                type: object
                required:
                - balance_usd
                - as_of_seq
                properties:
                  balance_usd:
                    $ref: '#/components/schemas/MoneyUsd'
                  as_of_seq:
                    type: integer
