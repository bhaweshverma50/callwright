      - provisioning
      - active
      - error
      - draining
    PhoneNumberUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
        termination_address:
          $ref: '#/components/schemas/TerminationAddress'
        transport:
          $ref: '#/components/schemas/Transport'
        auth_username:
          type:
          - string
          - 'null'
          maxLength: 128
        auth_password:
          type: string
          maxLength: 256
          writeOnly: true
        remove_auth_password:
          type: boolean
        inbound_allowed_cidrs:
          type: array
          maxItems: 20
          items:
            type: string
        inbound_agent_id:
          type:
          - string
          - 'null'
        outbound_agent_id:
          type:
          - string
          - 'null'
        inbound_webhook_url:
          type:
          - string
          - 'null'
