      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - kb_ids
              properties:
                kb_ids:
                  type: array
                  maxItems: 10
                  uniqueItems: true
                  items:
                    type: string
                    pattern: ^kb_
      responses:
        '200':
          description: Updated set
          content:
            application/json:
              schema:
                type: object
                required:
                - agent_id
                - knowledge_bases
                properties:
                  agent_id:
                    type: string
                  knowledge_bases:
                    type: array
                    items:
                      $ref: '#/components/schemas/KnowledgeBase'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          description: Unknown id, KB not attachable (`knowledge_base_not_ready`) or too many
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-spec: 005-tools-knowledge
  /agents/{agent_id}/published-version:
    parameters:
    - $ref: '#/components/parameters/AgentIdPath'
    put:
      operationId: publishAgentVersion
      tags:
