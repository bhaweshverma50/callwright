            '
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 'Validation (`invalid-number`, `same-number`, `invalid-timezone`, variables), `idempotency-key-reused`,
            `unsupported-vendor`, `pricing-unavailable`, or a compliance block (`outbound-policy` with
            `reason` `dnc_listed` or `outside_calling_hours`, schema `PolicyBlockedProblem`). A compliance
            block creates no call record, is not billed, is logged as a policy decision and is not stored
            against the Idempotency-Key.

            '
          content:
            application/problem+json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/CallRefusedProblem'
                - $ref: '#/components/schemas/PolicyBlockedProblem'
                - $ref: '#/components/schemas/Problem'
              examples:
                dnc:
                  value:
                    type: https://docs.callwright.example/problems/outbound-policy
                    title: Destination is on the do-not-call list
                    status: 422
                    reason: dnc_listed
                    to_number: '+14155550199'
                    dnc_entry_id: dnc_01JB2Z3Y4X5W6V7T8S9R0Q1P2N
                hours:
                  value:
                    type: https://docs.callwright.example/problems/outbound-policy
                    title: Outside calling hours for the recipient
                    status: 422
                    reason: outside_calling_hours
                    to_number: '+14155550199'
                    recipient_timezones:
                    - America/Los_Angeles
                    timezone_source: number_region
                    recipient_local_time: '2026-10-16T21:30:00'
                    next_allowed_at: '2026-10-17T16:00:00Z'
        '503':
          description: '`telephony-unavailable` (this deployment has no SIP service; nothing is created)
            or `media-unavailable` (the room could not be created; the call is `failed` and not charged).

            '
          content:
            application/problem+json:
              schema:
