          examples:
          - /prompt
          - /tts/speed
          - /dynamic_variables[order_id]/default
          - /advanced/pronunciation[sql]/replacement
        old:
          description: Previous value (absent for add)
        new:
          description: New value (absent for remove)
    Channel:
      type: string
      enum:
      - web
      - sip_inbound
      - sip_outbound
      - whatsapp
    ChatAnswer:
