              - 'null'
    RevisionConflictProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        required:
        - current_revision
        properties:
          current_revision:
            type: integer
    RuntimeConfig:
      type: object
      description: 'Everything the worker needs, resolved by the API, which owns the catalogs and defaults
        (shape defined once in packages/contract, `callwright_contract.protocol`). The worker keeps no
        defaults or tables of its own.

        '
      required:
      - channel
      - direction
      - agent_id
      - agent_version_id
      - config
      - variables
      - limits
      - controls
      - stt_auto_rules
      - heartbeat_interval_s
      properties:
        channel:
          type: string
          enum:
          - web
          - sip_inbound
          - sip_outbound
          - whatsapp
        direction:
          type: string
          enum:
          - inbound
          - outbound
        from_number:
          type:
          - string
          - 'null'
        to_number:
          type:
          - string
          - 'null'
        agent_id:
          type: string
        agent_version_id:
          type: string
        agent_type:
          type: string
          enum:
          - single_prompt
          - flow
        config:
          type: object
          description: 'Frozen AgentConfig from the agent version (schema owned by 002-agent-builder)
            with the language and every vendor resolved (`stt.model` stays null for Auto) and the call-behaviour,
            keypad, voicemail and background-audio defaults applied.

            '
          additionalProperties: true
        variables:
          type: object
          description: Resolved dynamic variables including built-ins.
          additionalProperties:
            type: string
        limits:
          type: object
          required:
          - end_on_silence_s
          - max_duration_s
          - ring_duration_ms
          properties:
            end_on_silence_s:
              type: integer
              minimum: 10
              maximum: 300
            max_duration_s:
              type: integer
              minimum: 30
              maximum: 3600
            ring_duration_ms:
              type: integer
              minimum: 0
              maximum: 30000
        background_audio_url:
          type:
          - string
          - 'null'
          format: uri
          description: Signed URL (10 minutes) for an uploaded ambience file, else null.
        caller_join_timeout_s:
          type: integer
          default: 60
          description: Web calls only; fail the call if the browser has not joined by then.
        outbound_dial:
          description: Set by 010-channels for `sip_outbound` calls; the worker dials this.
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/OutboundDial'
        heartbeat_interval_s:
          type: integer
          default: 10
        recording_enabled:
          type: boolean
          description: 'Effective recording setting resolved at admission from the agent version''s `advanced.recording`
            override (002) and the workspace''s `recording_default` (001). Informational for the worker:
            the API starts egress only when true; the worker never records.

            '
        stt_resolved_model:
          type:
          - string
          - 'null'
          description: The speech recognition model Auto resolved to for the agent's language.
        controls:
          type: array
          description: '002''s control range table (data-model 8.6). The worker clamps call behaviour
            and segment overrides to it.

            '
          items:
            $ref: '#/components/schemas/RuntimeControlRange'
        stt_auto_rules:
          type: object
          description: 'How speech recognition Auto picks a model, per provider (002 data-model 8.3),
            for flow nodes and overrides that change the language or provider. The same rules admission
            used, so the worker runs the model admission priced.

            '
          additionalProperties:
            $ref: '#/components/schemas/SttAutoRule'
        simulation:
          type: boolean
          default: false
          description: Text runs (008) and the offline harness; tools answer without side effects.
        language_options:
          type: array
          description: 'Languages the caller can switch to during the call (012), the agent''s own language
            first. Empty when language switching is off, the agent is a flow, or no other language is
            supported by both the agent''s speech recognition and voice.

            '
          items:
            $ref: '#/components/schemas/LanguageOption'
        caller_language:
          type:
          - string
          - 'null'
          description: 'Phone calls only (012): the caller''s saved language when it is one of `language_options`
            and differs from the agent''s language. The call starts in it (speech recognition, replies
            and a greeting with the same meaning).

            '
    RuntimeControlRange:
      type: object
      description: One row of 002's ControlRange (voices.yaml) without its display fields.
      required:
      - path
      - min
      - max
      properties:
        path:
          type: string
          description: JSON Pointer into the agent config
          examples:
          - /tts/speed
        min:
          type: number
        max:
          type: number
        step:
          type:
          - number
          - 'null'
    RuntimeTranscriptItem:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - message
          - tool_call
          - tool_result
          - flow_transition
          - system
        role:
