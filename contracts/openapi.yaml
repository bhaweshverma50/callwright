          default: false
    PolicyBlockedProblem:
      description: 'Compliance block (type `outbound-policy`). No call record exists, nothing is billed,
        and a policy decision is logged.

        '
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        required:
        - reason
        - to_number
        properties:
          reason:
            $ref: '#/components/schemas/OutboundBlockReason'
          to_number:
            $ref: '#/components/schemas/E164'
          dnc_entry_id:
            type: string
            pattern: ^dnc_[0-9A-HJKMNP-TV-Z]{26}$
            description: '`dnc_listed` only.'
          recipient_timezones:
            type: array
            items:
              type: string
            description: '`outside_calling_hours` only; empty when no zone could be derived.'
          timezone_source:
            type: string
            enum:
            - override
            - number_region
            - unknown
          recipient_local_time:
            type:
            - string
            - 'null'
            description: Local wall-clock time (ISO 8601 without offset) in the first evaluated zone.
          next_allowed_at:
            type:
            - string
            - 'null'
            format: date-time
            description: Earliest UTC instant the request would pass; null when the zone is unknown.
    PolicyDecision:
      type: object
      required:
      - id
      - decided_at
      - reason
      - to_number
      - from_number
      - requested_by
      properties:
        id:
          type: integer
        decided_at:
          type: string
          format: date-time
        reason:
          $ref: '#/components/schemas/OutboundBlockReason'
        to_number:
          $ref: '#/components/schemas/E164'
        from_number:
          $ref: '#/components/schemas/E164'
        phone_number_id:
          type:
          - string
          - 'null'
        agent_id:
          type:
          - string
          - 'null'
        requested_by:
          type: string
          description: User id or API key id
        dnc_entry_id:
          type:
          - string
          - 'null'
        dnc_number:
          type:
          - string
          - 'null'
        recipient_timezones:
          type: array
          items:
            type: string
        timezone_source:
          type:
          - string
          - 'null'
          enum:
          - override
          - number_region
          - unknown
          - null
        recipient_local_time:
          type:
          - string
          - 'null'
        next_allowed_at:
          type:
          - string
          - 'null'
          format: date-time
    PostApply:
