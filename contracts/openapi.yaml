          examples:
          - '4.516667'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CostLine'
        total_usd:
          $ref: '#/components/schemas/MoneyUsd'
          description: Sum of line cost_usd values
    CostLine:
      type: object
      required:
      - component
      - provider
      - model
      - rate_per_min_usd
      - billed_minutes
      - cost_usd
      - surcharge_usd
      - bundle_multiplier
      - meters
      properties:
        component:
          $ref: '#/components/schemas/Component'
        provider:
          type: string
        model:
          type:
          - string
          - 'null'
        rate_per_min_usd:
          $ref: '#/components/schemas/MoneyUsd'
        billed_minutes:
          type: string
          description: max(duration_minutes, usage / bundle_per_min) as a decimal string, 6 places
          examples:
          - '5.117400'
        cost_usd:
          $ref: '#/components/schemas/MoneyUsd'
          description: rate times billed_minutes, rounded up to $0.001
        surcharge_usd:
          $ref: '#/components/schemas/MoneyUsd'
          description: rate times (billed_minutes minus duration_minutes); informational, already inside
            cost_usd
        bundle_multiplier:
          type: string
          description: billed_minutes / duration_minutes, e.g. "1.1330"
        meters:
          type: array
          items:
            $ref: '#/components/schemas/MeterUsage'
    CostView:
      type: object
      required:
      - header
      - lines
      - surcharges
      - catalog_version
      properties:
        header:
          type: object
          required:
          - duration_s
          - billed_minutes
          - avg_rate_per_min_usd
          - total_usd
          properties:
            duration_s:
              type: integer
            billed_minutes:
              type: number
            avg_rate_per_min_usd:
              type: number
            total_usd:
              type: number
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CallCostLine'
        surcharges:
          type: array
          items:
            $ref: '#/components/schemas/SurchargeLine'
        catalog_version:
          type: string
    DashboardQuality:
      type: object
      required:
      - window
      - total_calls_evaluated
      - per_evaluator
      properties:
        window:
          $ref: '#/components/schemas/Window'
        prior_window:
          oneOf:
          - $ref: '#/components/schemas/Window'
          - type: 'null'
        total_calls_evaluated:
          type: integer
        per_evaluator:
          type: array
          items:
            $ref: '#/components/schemas/EvaluatorStat'
        per_evaluator_prior:
          type: array
          items:
            $ref: '#/components/schemas/EvaluatorStat'
    DashboardStats:
      type: object
      required:
      - window
      - bucket
      - kpis
      - sparklines
      - series
      - disconnect_reasons
      - sentiment
      - channels
      - leaderboard
      - distribution
      properties:
        window:
          $ref: '#/components/schemas/Window'
        bucket:
          type: string
          enum:
          - day
          - week
        kpis:
          type: object
          required:
          - total_calls
          - daily_avg_calls
          - total_duration_s
          - total_cost_usd
          - cost_per_call_usd
          - avg_duration_s
          properties:
            total_calls:
              type: integer
            daily_avg_calls:
              type: number
            total_duration_s:
              type: integer
            peak_day:
              type:
              - object
              - 'null'
              properties:
                date:
                  type: string
                  format: date
                total_calls:
                  type: integer
            total_cost_usd:
              type: number
            cost_per_call_usd:
              type: number
            avg_duration_s:
              type: number
            median_turn_latency_ms:
              type:
              - integer
              - 'null'
            p95_turn_latency_ms:
              type:
              - integer
              - 'null'
        sparklines:
          type: object
          properties:
            calls:
              type: array
              items:
                type: integer
            duration_s:
              type: array
              items:
                type: integer
            cost_usd:
              type: array
              items:
                type: number
            avg_duration_s:
              type: array
              items:
                type: number
        series:
          type: array
          items:
            type: object
            required:
            - bucket_start
            - total_calls
            - total_duration_s
            - avg_duration_s
            properties:
              bucket_start:
                type: string
                format: date
              total_calls:
                type: integer
              total_duration_s:
                type: integer
              avg_duration_s:
                type: number
        disconnect_reasons:
          type: object
          additionalProperties:
            type: integer
          description: Keys are DisconnectReason values from the calls contract.
        sentiment:
          type: object
          required:
          - positive
          - neutral
          - negative
          - unknown
          properties:
            positive:
              type: integer
            neutral:
              type: integer
            negative:
              type: integer
            unknown:
              type: integer
        channels:
          type: object
          required:
          - web
          - sip_inbound
          - sip_outbound
          - whatsapp
          properties:
            web:
              type: integer
            sip_inbound:
              type: integer
            sip_outbound:
              type: integer
            whatsapp:
              type: integer
        leaderboard:
          type: array
          maxItems: 5
          items:
            type: object
            required:
            - agent_id
            - agent_name
            - total_calls
            - positive_calls
            - negative_calls
            properties:
              agent_id:
                type: string
              agent_name:
                type: string
              total_calls:
                type: integer
              positive_calls:
                type: integer
              negative_calls:
                type: integer
        distribution:
          type: array
          maxItems: 11
          items:
            type: object
            required:
            - agent_id
            - agent_name
            - total_calls
            - share
            properties:
              agent_id:
                type: string
                description: agt_ ID, or the literal others
              agent_name:
                type: string
              total_calls:
                type: integer
              share:
                type: number
                minimum: 0
                maximum: 1
    DeliveryAttempt:
      type: object
      required:
      - n
      - at
      properties:
        n:
          type: integer
          minimum: 1
          maximum: 6
        at:
          type: string
          format: date-time
        status_code:
          type:
          - integer
          - 'null'
        duration_ms:
          type:
          - integer
          - 'null'
        error:
          type:
          - string
          - 'null'
          description: '`timeout`, `connection_error`, `url_not_allowed`, or a short message.'
        response_excerpt:
          type:
          - string
          - 'null'
          maxLength: 1024
    DeliveryStatus:
      type: string
      enum:
      - pending
      - delivering
      - succeeded
      - failed
      - blocked
    Dimension:
      type: string
      enum:
      - day
      - week
      - month
      - hour_of_day
      - weekday
      - agent
      - channel
      - status
      - disconnect_reason
      - sentiment
      - evaluator
    DisconnectReason:
      type: string
      enum:
      - user_hangup
      - agent_hangup
      - call_transfer
      - voicemail_reached
      - inactivity
      - max_duration_reached
      - error
      - concurrency_limit
      - insufficient_credit
    DtmfEvent:
      allOf:
      - $ref: '#/components/schemas/EventBase'
      - type: object
        required:
        - digits
        - direction
        properties:
          type:
            const: dtmf
          digits:
            type: string
            pattern: ^[0-9*#]{1,99}$
          direction:
            type: string
            enum:
            - received
            - sent
          flush_reason:
            type: string
            enum:
            - termination_key
            - digit_limit
            - timeout
    DynamicVariable:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          pattern: ^[A-Za-z_][A-Za-z0-9_]{0,63}$
        default:
          type:
          - string
          - 'null'
          maxLength: 2000
        description:
          type:
          - string
          - 'null'
          maxLength: 200
    DynamicVariables:
      type: object
      maxProperties: 50
      propertyNames:
        pattern: ^[A-Za-z_][A-Za-z0-9_]{0,63}$
      additionalProperties:
        type: string
        maxLength: 2000
    E164:
      type: string
      description: Phone number in E.164 form, a plus sign and 7 to 15 digits.
      pattern: ^\+[1-9]\d{6,14}$
      examples:
      - '+14155550123'
    EvalStatus:
      type: string
      enum:
      - not_evaluated
      - running
      - passed
      - failed
      - error
    EvaluatorStat:
      type: object
      required:
      - evaluator_id
      - evaluator_name
      - display_name
      - scope
      - pass_count
      - fail_count
      - not_applicable_count
      - total_runs
      - calls_evaluated
      properties:
        evaluator_id:
          type: string
        evaluator_name:
          type: string
        display_name:
          type: string
        scope:
          type: string
          enum:
          - call
          - turn
          - flow_node
        pass_rate:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        avg_score:
          type:
          - number
          - 'null'
        pass_count:
          type: integer
        fail_count:
          type: integer
        not_applicable_count:
          type: integer
        total_runs:
          type: integer
        calls_evaluated:
          type: integer
    EventBase:
      type: object
      required:
      - seq
      - type
      - occurred_at
      properties:
        seq:
          type: integer
          minimum: 1
        type:
          type: string
        occurred_at:
          type: string
          format: date-time
        offset_ms:
          type:
          - integer
          - 'null'
          description: Milliseconds since connection; null before connection.
    EventBatch:
      type: object
      required:
      - events
      properties:
        events:
          type: array
          minItems: 0
          maxItems: 200
          description: Empty batch is a pure heartbeat.
          items:
            $ref: '#/components/schemas/CallEvent'
    EventBatchResult:
      type: object
      required:
      - accepted
      - duplicates
      - control
      properties:
        accepted:
          type: integer
        duplicates:
          type: integer
        control:
          type: object
          required:
          - action
          properties:
            action:
              type: string
              enum:
              - none
              - end_call
            disconnect_reason:
              type: string
              enum:
              - insufficient_credit
              - error
    FeatureFamily:
      type: string
      description: 'Prefix of the feature key before the first dot, with `eval` reported as `evaluations`
        and

        `simulator` as `simulations`. The registry in services/api/app/pricing/features.py is the

        source of truth; every family it accepts is listed here (T090).

        '
      enum:
      - calls
      - evaluations
      - simulations
      - testing
      - analytics_chat
      - prompt_generation
      - post_call_analysis
      - flow_assistant
      - voice_copilot
      - issues
      - knowledge_ingestion
      - embedding
    FieldError:
      type: object
      required:
      - pointer
      - code
      - message
      properties:
        pointer:
          type: string
          description: JSON Pointer into the request body, e.g. /config/llm/temperature
        code:
          type: string
          examples:
          - required
          - out_of_range
          - invalid_format
          - not_in_catalog
        message:
          type: string
    FlowTransitionEvent:
      allOf:
      - $ref: '#/components/schemas/EventBase'
      - type: object
        required:
        - to_node_id
        description: Emitted through the 004 flow hook.
        properties:
          type:
            const: flow_transition
          from_node_id:
            type:
            - string
            - 'null'
          to_node_id:
            type: string
          label:
            type: string
    InterpretRequest:
      type: object
      required:
      - transcript
      - visual_state
      properties:
        transcript:
          type: string
          minLength: 1
          maxLength: 1000
        visual_state:
          $ref: '#/components/schemas/VisualState'
        conversation_history:
          type: array
          maxItems: 12
          items:
            type: object
            properties:
              role:
                type: string
                enum:
                - user
                - copilot
              content:
                type: string
                maxLength: 1000
    InterpretResult:
      type: object
      required:
      - action
      properties:
        action:
          type: string
          enum:
          - navigate
          - route_to_copilot
          - ui_action
          - answer
          - decline
        target:
          type:
          - string
          - 'null'
          description: 'navigate: an allowlisted route (for example /calls). route_to_copilot: analytics_chat,

            prompt_builder or flow_builder. ui_action: a key from visual_state.available_actions.

            '
        params:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: For navigate to /calls, filter params (status, channel, agent_id, date_range of
            today, yesterday, this_week, last_7_days).
        query:
          type:
          - string
          - 'null'
          description: Prefilled question for route_to_copilot
        speak:
          type:
          - string
          - 'null'
          maxLength: 280
        highlight_element:
          type:
          - string
          - 'null'
          description: A key from visual_state.highlightable_elements
        fallback_suggestion:
          type:
          - string
          - 'null'
    Language:
      type: object
      required:
      - code
      - label
      - stt_default
      - tts_default
      properties:
        code:
          type: string
          examples:
          - en-US
          - hi
          - multi
        label:
          type: string
          examples:
          - English (US)
        stt_default:
          type: object
          required:
          - provider
          - model
          properties:
            provider:
              type: string
            model:
              type:
              - string
              - 'null'
        tts_default:
          type: object
          required:
          - provider
          - model
          - voice_id
          properties:
            provider:
              type: string
            model:
              type: string
            voice_id:
              type: string
    LatencySummary:
      type: object
      required:
      - turns_measured
      properties:
        avg_ms:
          type:
          - integer
          - 'null'
        p50_ms:
          type:
          - integer
          - 'null'
        p95_ms:
          type:
          - integer
          - 'null'
        turns_measured:
          type: integer
    LivekitWebhookEvent:
      type: object
      required:
      - event
      - id
      - createdAt
      description: 'Subset of the LiveKit webhook payload the API reads. Handled events: `room_finished`
        (end any open call for the room with reason `error` if the worker did not report an end), `participant_left`
        (logged; the worker reports hangups), `egress_started`, `egress_ended` (set recording status and
        key; ignored for calls with `recording_enabled = false`, whose status stays `not_recorded`, since
        no egress is started for them).

        '
      properties:
        event:
          type: string
          examples:
          - room_finished
          - participant_left
          - egress_started
          - egress_ended
        id:
          type: string
        createdAt:
          type:
          - integer
          - string
        room:
          type: object
          properties:
            name:
              type: string
            sid:
              type: string
            metadata:
              type: string
        participant:
          type: object
          properties:
            identity:
              type: string
            kind:
              type: string
            attributes:
              type: object
              additionalProperties:
                type: string
        egressInfo:
          type: object
          properties:
            egressId:
              type: string
            roomName:
              type: string
            status:
              type: string
              examples:
              - EGRESS_COMPLETE
              - EGRESS_FAILED
              - EGRESS_ABORTED
              - EGRESS_LIMIT_REACHED
            error:
              type: string
            fileResults:
              type: array
              items:
                type: object
                properties:
                  filename:
                    type: string
                  location:
                    type: string
                  duration:
                    type:
                    - integer
                    - string
                  size:
                    type:
                    - integer
                    - string
    LlmCatalog:
      type: object
      required:
      - default
      - providers
      properties:
        default:
          type: object
          required:
          - provider
          - model
          properties:
            provider:
              type: string
            model:
              type: string
        providers:
          type: array
          items:
            $ref: '#/components/schemas/LlmProvider'
    LlmModel:
      type: object
      required:
      - id
      - label
      - temperature
      - supports_tools
      - price_per_min_usd
      - withdrawn
      properties:
        id:
          type: string
          examples:
          - gpt-5.1
          description: Canonical id
          identical under every provider that offers the model: null
        label:
          type: string
        family:
          type: string
          examples:
          - gpt-5
        temperature:
          $ref: '#/components/schemas/TemperatureRule'
        supports_tools:
          type: boolean
        context_window:
          type:
          - integer
          - 'null'
        input_tokens_bundle_per_min:
          type:
          - integer
          - 'null'
          description: From pricing; used by the surcharge-risk notice
        price_per_min_usd:
          oneOf:
          - $ref: '#/components/schemas/MoneyUsd'
          - type: 'null'
          description: null means price unavailable
        withdrawn:
          type: boolean
    LlmProvider:
      type: object
      required:
      - id
      - label
      - models
      properties:
        id:
          type: string
          examples:
          - azure_openai
          - openai
        label:
          type: string
        models:
          type: array
          items:
            $ref: '#/components/schemas/LlmModel'
    Me:
      type: object
      required:
      - user
      - workspace
      - balance_usd
      properties:
        user:
          $ref: '#/components/schemas/User'
        workspace:
          $ref: '#/components/schemas/Workspace'
        balance_usd:
          $ref: '#/components/schemas/MoneyUsd'
    MeterUsage:
      type: object
      required:
      - unit
      - used
      - bundle_per_min
      - included
      properties:
        unit:
          $ref: '#/components/schemas/BundleUnit'
        used:
          type: integer
        bundle_per_min:
          type: integer
        included:
          type: string
          description: bundle_per_min times duration_minutes, decimal string
    MetricName:
      type: string
      enum:
      - call_count
      - total_duration_s
      - avg_duration_s
      - total_cost_usd
      - avg_cost_usd
      - median_turn_latency_ms
      - p95_turn_latency_ms
      - evaluator_pass_rate
      - evaluator_run_count
      - positive_sentiment_share
      - negative_sentiment_share
    MetricQuery:
      type: object
      required:
      - metrics
      - period
      additionalProperties: false
      properties:
        metrics:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: '#/components/schemas/MetricName'
        group_by:
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/Dimension'
        filters:
          type: object
          additionalProperties: false
          properties:
            agent_ids:
              type: array
              items:
                type: string
                pattern: ^agt_
            channels:
              type: array
              items:
                type: string
                enum:
                - web
                - sip_inbound
                - sip_outbound
                - whatsapp
            statuses:
              type: array
              items:
                type: string
            disconnect_reasons:
              type: array
              items:
                type: string
            sentiments:
              type: array
              items:
                type: string
                enum:
                - positive
                - neutral
                - negative
                - unknown
            evaluator_names:
              type: array
              items:
                type: string
        period:
          type: object
          required:
          - preset
          additionalProperties: false
          properties:
            preset:
              type: string
              enum:
              - today
              - yesterday
              - this_week
              - last_week
              - this_month
              - last_month
              - last_n_days
              - between
            n_days:
              type: integer
              minimum: 1
              maximum: 365
            start_date:
              type: string
              format: date
            end_date:
              type: string
              format: date
        order_by:
          type: object
          properties:
            key:
              type: string
            direction:
              type: string
              enum:
              - asc
              - desc
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
    ModelRef:
      type: object
      required:
      - provider
      - model
      properties:
        provider:
          type: string
          pattern: ^[a-z0-9_]+$
        model:
          type: string
          minLength: 1
    MoneyUsd:
      type: string
      description: USD amount as a decimal string with up to 6 fractional digits.
      pattern: ^-?\d+\.\d{1,6}$
      examples:
      - '30.000000'
      - '-0.477000'
    NoiseCancellationOption:
      type: object
      required:
      - provider
      - model
      - label
      - default
      - price_per_min_usd
      properties:
        provider:
          type: string
        model:
          type: string
        label:
          type: string
        description:
          type:
          - string
          - 'null'
        default:
          type: boolean
        price_per_min_usd:
          $ref: '#/components/schemas/PricePerMin'
    Origin:
      type: string
      enum:
      - live
      - test
      - simulation
    OutboundDial:
      type: object
      required:
      - sip_trunk_id
      - to_number
      - from_number
      - ring_timeout_s
      properties:
        sip_trunk_id:
          type: string
        to_number:
          type: string
        from_number:
          type: string
        ring_timeout_s:
          type: integer
          minimum: 10
          maximum: 60
    PageMeta:
      type: object
      required:
      - total
      - page
      - page_size
      - total_pages
      properties:
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        total_pages:
          type: integer
          minimum: 0
    PricePerMin:
      oneOf:
      - $ref: '#/components/schemas/MoneyUsd'
      - type: 'null'
      description: null means price unavailable
    Problem:
      type: object
      description: RFC 9457 problem details. `type` is a URI under https://callwright.dev/problems/.
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable machine-readable code, e.g. insufficient_credit, email_unverified.
        retry_after_s:
          type: integer
          description: Present on 429 responses.
        trace_id:
          type: string
          description: Present on 5xx responses; the reference support uses to find the trace (FR-019).
            5xx `title` and `detail` are generic and never carry database, stack or vendor text.
        errors:
          type: array
          description: Present on 422 responses; every failing field in one list.
          items:
            $ref: '#/components/schemas/FieldError'
    PronunciationEntry:
      type: object
      required:
      - word
      - replacement
      properties:
        word:
          type: string
          minLength: 1
          maxLength: 100
        replacement:
          type: string
          minLength: 1
          maxLength: 200
    QualitySummary:
      type: object
      required:
      - eval_status
      - pass_count
      - fail_count
      - label
      properties:
        eval_status:
          $ref: '#/components/schemas/EvalStatus'
        pass_count:
          type: integer
          minimum: 0
        fail_count:
          type: integer
          minimum: 0
        label:
          type:
          - string
