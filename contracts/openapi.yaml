            - signed_in
    RuntimeConfig:
      type: object
      required:
      - channel
      - direction
      - agent_id
      - agent_version_id
      - config
      - variables
      - limits
      - heartbeat_interval_s
      properties:
        channel:
          type: string
          enum:
          - web
          - sip_inbound
          - sip_outbound
          - whatsapp
        direction:
          type: string
          enum:
          - inbound
          - outbound
