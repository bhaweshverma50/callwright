        '401':
          $ref: '#/components/responses/Unauthorized'
      x-spec: 001-platform-foundation
  /billing/checkout-sessions:
    post:
      operationId: createCheckoutSession
      tags:
      - billing
      security:
      - bearerAuth: []
      summary: Start a hosted checkout for a top-up
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - amount_usd
              properties:
                amount_usd:
                  $ref: '#/components/schemas/MoneyUsd'
                  description: Minimum 5.00, maximum 10000.00, at most two decimal places (FR-008). Out-of-range
                    or over-precise amounts return 422 with a field error. Presets in the UI are 25, 100,
                    500, 1000 and only fill the amount.
      responses:
        '201':
          description: Redirect the browser to checkout_url
          content:
            application/json:
              schema:
                type: object
                required:
                - checkout_url
                - expires_at
                properties:
                  checkout_url:
                    type: string
                    format: uri
                  expires_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      x-spec: 001-platform-foundation
  /billing/transactions:
    get:
      operationId: listTransactions
      tags:
      - billing
      security:
      - bearerAuth: []
      summary: Ledger rows newest first (FR-009)
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: type
        in: query
        schema:
          $ref: '#/components/schemas/TransactionType'
      responses:
        '200':
          description: Page of transactions
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageMeta'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Transaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-spec: 001-platform-foundation
  /billing/transactions/{transaction_id}:
    get:
      operationId: getTransaction
      tags:
      - billing
      security:
      - bearerAuth: []
      parameters:
      - name: transaction_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/TransactionId'
      responses:
        '200':
          description: One transaction; call charges include the cost breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-spec: 001-platform-foundation
  /health:
    get:
      operationId: getHealth
      tags:
      - core
      summary: Liveness and build info
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - version
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                  version:
                    type: string
                    examples:
                    - 2026.10.16+abc1234
      x-spec: 001-platform-foundation
  /me:
    get:
      operationId: getMe
      tags:
      - workspaces
      summary: Current user, workspace, balance and limits (FR-004)
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Identity payload used by the app shell
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-spec: 001-platform-foundation
  /pricing/catalog:
    get:
      operationId: getPricingCatalog
      tags:
      - pricing
      security: []
      summary: Catalog version in effect at `at` (default now). Cacheable for 5 minutes.
      parameters:
      - name: at
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Catalog
          headers:
            Cache-Control:
              schema:
                type: string
                examples:
                - public, max-age=300
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
      x-spec: 001-platform-foundation
  /pricing/quote:
    post:
      operationId: quotePrice
      tags:
      - pricing
      security: []
      summary: Price a component selection per minute, and optionally a concrete call usage
      description: 'Without `usage`, returns per-minute lines and the base total (agent builder cost card,

        public calculator). With `usage`, also returns the full call breakdown exactly as

        `charge_call` would bill it. Rate limited to 60 requests per minute per IP.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
      responses:
        '200':
          description: Quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-spec: 001-platform-foundation
  /usage:
    get:
      operationId: getUsage
      tags:
      - usage
      security:
      - bearerAuth: []
      summary: Raw and billable cost per feature for a date window (FR-014)
      parameters:
      - name: from
        in: query
        description: Inclusive start date (UTC). Default 30 days before `to`.
        schema:
          type: string
          format: date
      - name: to
        in: query
        description: Inclusive end date (UTC). Default today. Window may not exceed 366 days.
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Usage report; `rows` is empty when there is no usage in the window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      x-spec: 001-platform-foundation
  /webhooks/stripe:
    post:
      operationId: stripeWebhook
      tags:
      - billing
      - webhooks
      security: []
      summary: Payment provider events; verified with the Stripe-Signature header
      description: 'Handled events: checkout.session.completed (paid), checkout.session.async_payment_succeeded,

        checkout.session.expired, charge.refunded, charge.dispute.created. Every event is

        idempotent on its payment intent, refund or dispute id. Unknown events return 200.

        '
      parameters:
      - name: Stripe-Signature
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Accepted (including duplicates and ignored event types)
        '400':
          description: Signature invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-spec: 001-platform-foundation
  /workspaces/current:
    patch:
      operationId: updateCurrentWorkspace
      tags:
      - workspaces
      summary: Settings page save (FR-017); only the fields sent change
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                recording_default:
                  type: boolean
                  description: Workspace call recording default; agents set to inherit follow it (003
                    admission)
      responses:
        '200':
          description: Updated workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      x-spec: 001-platform-foundation
components:
  parameters:
    AgentIdPath:
      name: agent_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AgentId'
    CallIdPath:
      name: call_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CallId'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated key (max 255 chars). A repeat with the same key returns the first
        result.
      schema:
        type: string
        maxLength: 255
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key (8 to 255 chars), required on POSTs that spend credit or place
        calls. A replay within 24 h returns the original response.
      schema:
        type: string
        minLength: 8
        maxLength: 255
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Conflict:
      description: State conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InsufficientCredit:
      description: Balance at or below zero (code insufficient_credit)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource does not exist in this workspace, or the ID in the path is malformed (never
        a 5xx; FR-019)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem:
      description: RFC 9457 problem; the status code and `code` say what went wrong
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limited; `retry_after_s` says when to retry
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, expired or revoked token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: Request failed validation; `errors` lists every problem
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    AgentId:
      type: string
      pattern: ^agt_[0-9A-HJKMNP-TV-Z]{26}$
    Bundle:
      type: object
      required:
      - unit
      - per_min
      properties:
        unit:
          $ref: '#/components/schemas/BundleUnit'
        per_min:
          type: integer
          minimum: 1
          examples:
          - 20000
          - 200
          - 750
    BundleUnit:
      type: string
      enum:
      - llm_input_tokens
      - llm_output_tokens
      - tts_chars
    CallId:
      type: string
      pattern: ^call_[0-9A-HJKMNP-TV-Z]{26}$
    CallUsageMeters:
      type: object
      required:
      - duration_ms
      properties:
        duration_ms:
          type: integer
          minimum: 0
        llm_input_tokens:
          type: integer
          minimum: 0
          default: 0
        llm_output_tokens:
          type: integer
          minimum: 0
          default: 0
        tts_chars:
          type: integer
          minimum: 0
          default: 0
    Catalog:
      type: object
      required:
      - version
      - effective_from
      - entries
      properties:
        version:
          type: integer
        effective_from:
          type: string
          format: date-time
        entries:
          type: array
          items:
            $ref: '#/components/schemas/CatalogEntry'
    CatalogEntry:
      type: object
      required:
      - component
      - provider
      - model
      - label
      - rate_per_min_usd
      - bundles
      properties:
        component:
          $ref: '#/components/schemas/Component'
        provider:
          type: string
          pattern: ^[a-z0-9_]+$
          examples:
          - deepgram
          - azure_openai
          - callwright
        model:
          type:
          - string
          - 'null'
          description: null means the provider-level fallback rate
        label:
          type: string
        rate_per_min_usd:
          $ref: '#/components/schemas/MoneyUsd'
        bundles:
          type: array
          description: Only llm and tts entries may carry bundles
          items:
            $ref: '#/components/schemas/Bundle'
    CatalogVersionSummary:
      type: object
      required:
      - version
      - effective_from
      - created_at
      properties:
        version:
          type: integer
          minimum: 1
        effective_from:
          type: string
          format: date-time
        effective_to:
          type:
          - string
          - 'null'
          format: date-time
        notes:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
    Component:
      type: string
      enum:
      - stt
      - llm
      - tts
      - nc
      - platform
    ComponentSelection:
      type: object
      required:
      - provider
      properties:
        provider:
          type: string
        model:
          type:
          - string
          - 'null'
    CostBreakdown:
      type: object
      required:
      - catalog_version
      - duration_ms
      - billed_seconds
      - duration_minutes
      - lines
      - total_usd
      properties:
        call_id:
          oneOf:
          - $ref: '#/components/schemas/CallId'
          - type: 'null'
        catalog_version:
          type: integer
        duration_ms:
          type: integer
        billed_seconds:
          type: integer
          description: ceil(duration_ms / 1000)
        duration_minutes:
          type: string
          examples:
          - '4.516667'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CostLine'
        total_usd:
          $ref: '#/components/schemas/MoneyUsd'
          description: Sum of line cost_usd values
    CostLine:
      type: object
      required:
      - component
      - provider
      - model
      - rate_per_min_usd
      - billed_minutes
      - cost_usd
      - surcharge_usd
      - bundle_multiplier
      - meters
      properties:
        component:
          $ref: '#/components/schemas/Component'
        provider:
          type: string
        model:
          type:
          - string
          - 'null'
        rate_per_min_usd:
          $ref: '#/components/schemas/MoneyUsd'
        billed_minutes:
          type: string
          description: max(duration_minutes, usage / bundle_per_min) as a decimal string, 6 places
          examples:
          - '5.117400'
        cost_usd:
          $ref: '#/components/schemas/MoneyUsd'
          description: rate times billed_minutes, rounded up to $0.001
        surcharge_usd:
          $ref: '#/components/schemas/MoneyUsd'
          description: rate times (billed_minutes minus duration_minutes); informational, already inside
            cost_usd
        bundle_multiplier:
          type: string
          description: billed_minutes / duration_minutes, e.g. "1.1330"
        meters:
          type: array
          items:
            $ref: '#/components/schemas/MeterUsage'
    E164:
      type: string
      description: Phone number in E.164 form, a plus sign and 7 to 15 digits.
      pattern: ^\+[1-9]\d{6,14}$
      examples:
      - '+14155550123'
    FeatureFamily:
      type: string
      description: 'Prefix of the feature key before the first dot, with `eval` reported as `evaluations`
        and

        `simulator` as `simulations`. The registry in services/api/app/pricing/features.py is the

        source of truth; every family it accepts is listed here (T090).

        '
      enum:
      - calls
      - evaluations
      - simulations
      - testing
      - analytics_chat
      - prompt_generation
      - post_call_analysis
      - flow_assistant
      - voice_copilot
      - issues
      - knowledge_ingestion
      - embedding
    FieldError:
      type: object
      required:
      - pointer
      - code
      - message
      properties:
        pointer:
          type: string
          description: JSON Pointer into the request body, e.g. /config/llm/temperature
        code:
          type: string
          examples:
          - required
          - out_of_range
          - invalid_format
          - not_in_catalog
        message:
          type: string
    Me:
      type: object
      required:
      - user
      - workspace
      - balance_usd
      properties:
        user:
          $ref: '#/components/schemas/User'
        workspace:
          $ref: '#/components/schemas/Workspace'
        balance_usd:
          $ref: '#/components/schemas/MoneyUsd'
    MeterUsage:
      type: object
      required:
      - unit
      - used
      - bundle_per_min
      - included
      properties:
        unit:
          $ref: '#/components/schemas/BundleUnit'
        used:
          type: integer
        bundle_per_min:
          type: integer
        included:
          type: string
          description: bundle_per_min times duration_minutes, decimal string
    MoneyUsd:
      type: string
      description: USD amount as a decimal string with up to 6 fractional digits.
      pattern: ^-?\d+\.\d{1,6}$
      examples:
      - '30.000000'
      - '-0.477000'
    PageMeta:
      type: object
      required:
      - total
      - page
      - page_size
      - total_pages
      properties:
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        total_pages:
          type: integer
          minimum: 0
    Problem:
      type: object
      description: RFC 9457 problem details. `type` is a URI under https://callwright.dev/problems/.
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable machine-readable code, e.g. insufficient_credit, email_unverified.
        retry_after_s:
          type: integer
          description: Present on 429 responses.
        trace_id:
          type: string
          description: Present on 5xx responses; the reference support uses to find the trace (FR-019).
            5xx `title` and `detail` are generic and never carry database, stack or vendor text.
        errors:
          type: array
          description: Present on 422 responses; every failing field in one list.
          items:
            $ref: '#/components/schemas/FieldError'
    Quote:
      type: object
      required:
      - catalog_version
      - lines
      - per_minute_total_usd
      - complete
      properties:
        catalog_version:
          type: integer
        lines:
          type: array
          description: Always includes a platform line
          items:
            $ref: '#/components/schemas/QuoteLine'
        per_minute_total_usd:
          $ref: '#/components/schemas/MoneyUsd'
        complete:
          type: boolean
          description: false when any line is unpriced; the total then covers priced lines only
        call:
          description: Present when `usage` was sent
          $ref: '#/components/schemas/CostBreakdown'
    QuoteLine:
      type: object
      required:
      - component
      - provider
      - model
      - status
      properties:
        component:
          $ref: '#/components/schemas/Component'
        provider:
          type: string
        model:
          type:
          - string
          - 'null'
        label:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - priced
          - unpriced
          description: unpriced means no catalog row matched; the UI shows "price unavailable"
        rate_per_min_usd:
          oneOf:
          - $ref: '#/components/schemas/MoneyUsd'
          - type: 'null'
        bundles:
          type: array
          items:
            $ref: '#/components/schemas/Bundle'
    QuoteRequest:
      type: object
      required:
      - components
      properties:
        components:
          type: object
          required:
          - stt
          - llm
          - tts
          properties:
            stt:
              $ref: '#/components/schemas/ComponentSelection'
            llm:
              $ref: '#/components/schemas/ComponentSelection'
            tts:
              $ref: '#/components/schemas/ComponentSelection'
            nc:
              description: null or absent means no noise cancellation
              oneOf:
              - $ref: '#/components/schemas/ComponentSelection'
              - type: 'null'
        usage:
          $ref: '#/components/schemas/CallUsageMeters'
        at:
          type: string
          format: date-time
          description: Price with the catalog version in effect at this instant (default now)
    Session:
      type: object
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum:
          - bearer
        expires_in:
          type: integer
          description: Seconds until the access token expires
    Transaction:
      type: object
      required:
      - id
      - type
      - amount_usd
      - balance_after_usd
      - description
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/TransactionId'
        type:
          $ref: '#/components/schemas/TransactionType'
        amount_usd:
          $ref: '#/components/schemas/MoneyUsd'
          description: Positive for credits, negative for charges
        balance_after_usd:
          $ref: '#/components/schemas/MoneyUsd'
        call_id:
          oneOf:
          - $ref: '#/components/schemas/CallId'
          - type: 'null'
        feature_key:
          type:
          - string
          - 'null'
          examples:
          - prompt_generation
          - eval.intent_fulfillment
        description:
          type: string
        created_at:
          type: string
          format: date-time
        cost_breakdown:
          description: Present on call_charge rows
          oneOf:
          - $ref: '#/components/schemas/CostBreakdown'
          - type: 'null'
    TransactionId:
      type: string
      pattern: ^txn_[0-9A-HJKMNP-TV-Z]{26}$
    TransactionType:
      type: string
      enum:
      - top_up
      - call_charge
      - feature_charge
      - trial_grant
      - refund
      - adjustment
    UsageDetail:
      type: object
      required:
      - feature_key
      - event_count
      - raw_cost_usd
      - billable_cost_usd
      properties:
        feature_key:
          type: string
          examples:
          - eval.intent_fulfillment
        event_count:
          type: integer
        raw_cost_usd:
          $ref: '#/components/schemas/MoneyUsd'
        billable_cost_usd:
          $ref: '#/components/schemas/MoneyUsd'
    UsageReport:
      type: object
      required:
      - window
      - rows
      - total_raw_cost_usd
      - total_billable_cost_usd
      properties:
        window:
          type: object
          required:
          - from
          - to
          properties:
            from:
              type: string
              format: date
            to:
              type: string
              format: date
        rows:
          type: array
          items:
            $ref: '#/components/schemas/UsageRow'
        total_raw_cost_usd:
          $ref: '#/components/schemas/MoneyUsd'
        total_billable_cost_usd:
          $ref: '#/components/schemas/MoneyUsd'
    UsageRow:
      type: object
      required:
      - feature
      - event_count
      - raw_cost_usd
      - billable_cost_usd
      - details
      properties:
        feature:
          $ref: '#/components/schemas/FeatureFamily'
        event_count:
          type: integer
        raw_cost_usd:
          $ref: '#/components/schemas/MoneyUsd'
        billable_cost_usd:
          $ref: '#/components/schemas/MoneyUsd'
        details:
          type: array
          items:
            $ref: '#/components/schemas/UsageDetail'
    User:
      type: object
      required:
      - id
      - email
      - email_verified
      - is_admin
      properties:
        id:
          $ref: '#/components/schemas/UserId'
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        is_admin:
          type: boolean
    UserId:
      type: string
      pattern: ^usr_[0-9A-HJKMNP-TV-Z]{26}$
    Workspace:
      type: object
      required:
      - id
      - name
      - concurrency_limit
      - recording_default
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/WorkspaceId'
        name:
          type: string
        concurrency_limit:
          type: integer
          minimum: 1
          description: Read-only for users; shown on the Settings page
        recording_default:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
    WorkspaceId:
      type: string
      pattern: ^ws_[0-9A-HJKMNP-TV-Z]{26}$
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by the identity provider via /v1/auth endpoints.
    serviceToken:
      type: http
      scheme: bearer
      description: Static service token for /v1/internal/* endpoints (voice worker only).
