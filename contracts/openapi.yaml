    post:
      operationId: sendWebhookTest
      summary: Send a signed `ping` event to a URL and wait for the result
      tags:
      - webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              properties:
                url:
                  type: string
                  format: uri
                  maxLength: 2048
                timeout_ms:
                  type: integer
                  minimum: 1000
                  maximum: 30000
                  default: 3000
      responses:
        '401':
          $ref: '#/components/responses/Problem'
        '200':
          description: Result of the single attempt (no retries for tests)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryAttempt'
        '422':
          description: URL rejected (`url-not-allowed`), for example a private address
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-spec: 003-voice-runtime
  /workspaces/current:
    patch:
      operationId: updateCurrentWorkspace
      tags:
      - workspaces
      summary: Settings page save (FR-017); only the fields sent change
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                recording_default:
                  type: boolean
                  description: Workspace call recording default; agents set to inherit follow it (003
                    admission)
      responses:
        '200':
          description: Updated workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      x-spec: 001-platform-foundation
components:
  parameters:
    AgentIdPath:
      name: agent_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AgentId'
    CallIdPath:
      name: call_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CallId'
    DeliveryHeader:
      name: Callwright-Delivery
      in: header
      required: true
      schema:
        type: string
    DeliveryId:
      name: delivery_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^whd_[0-9A-HJKMNP-TV-Z]{26}$
    EventHeader:
      name: Callwright-Event
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/WebhookEventName'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated key (max 255 chars). A repeat with the same key returns the first
        result.
      schema:
        type: string
        maxLength: 255
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key (8 to 255 chars), required on POSTs that spend credit or place
        calls. A replay within 24 h returns the original response.
      schema:
        type: string
        minLength: 8
        maxLength: 255
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SignatureHeader:
      name: Callwright-Signature
      in: header
      required: true
      schema:
        type: string
        examples:
        - t=1760600000,v1=5257a869e7ecebeda32affa62cdca3fa51cad7e77a0e56ff536d0ce8e108d8bd
  responses:
    Conflict:
      description: State conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InsufficientCredit:
      description: Balance at or below zero (code insufficient_credit)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource does not exist in this workspace, or the ID in the path is malformed (never
        a 5xx; FR-019)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem:
      description: RFC 9457 problem; the status code and `code` say what went wrong
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limited; `retry_after_s` says when to retry
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, expired or revoked token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: Request failed validation; `errors` lists every problem
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    AgentId:
      type: string
      pattern: ^agt_[0-9A-HJKMNP-TV-Z]{26}$
    Bundle:
      type: object
      required:
      - unit
      - per_min
      properties:
        unit:
          $ref: '#/components/schemas/BundleUnit'
        per_min:
          type: integer
          minimum: 1
          examples:
          - 20000
          - 200
          - 750
    BundleUnit:
      type: string
      enum:
      - llm_input_tokens
      - llm_output_tokens
      - tts_chars
    CallEvent:
      oneOf:
      - $ref: '#/components/schemas/StatusEvent'
      - $ref: '#/components/schemas/TurnEvent'
      - $ref: '#/components/schemas/TranscriptItemEvent'
      - $ref: '#/components/schemas/UsageEvent'
      - $ref: '#/components/schemas/ToolCallEvent'
      - $ref: '#/components/schemas/FlowTransitionEvent'
      - $ref: '#/components/schemas/DtmfEvent'
      - $ref: '#/components/schemas/WarningEvent'
      discriminator:
        propertyName: type
        mapping:
          status: '#/components/schemas/StatusEvent'
          turn: '#/components/schemas/TurnEvent'
          transcript_item: '#/components/schemas/TranscriptItemEvent'
          usage: '#/components/schemas/UsageEvent'
          tool_call: '#/components/schemas/ToolCallEvent'
          flow_transition: '#/components/schemas/FlowTransitionEvent'
          dtmf: '#/components/schemas/DtmfEvent'
          warning: '#/components/schemas/WarningEvent'
          error: '#/components/schemas/WarningEvent'
    CallId:
      type: string
      pattern: ^call_[0-9A-HJKMNP-TV-Z]{26}$
    CallRecordingState:
      type: object
      description: 'Recording state of one call, returned by 006''s recording URL endpoints through `calls.service.recording_state()`.
        When `recording_status` is `not_recorded` the call was deliberately not recorded (recording off
        for the workspace or agent) and `recording_url` is null; this is distinct from `failed` ("recording
        unavailable").

        '
      required:
      - call_id
      - recording_enabled
      - recording_setting_source
      - recording_status
      - recording_url
      properties:
        call_id:
          type: string
          pattern: ^call_[0-9A-HJKMNP-TV-Z]{26}$
        recording_enabled:
          type: boolean
        recording_setting_source:
          type: string
          enum:
          - workspace
          - agent
        recording_status:
          type: string
          enum:
          - none
          - recording
          - available
          - failed
          - not_recorded
        recording_url:
          type:
          - string
          - 'null'
          format: uri
          description: Signed, valid 10 minutes; null unless `recording_status` is `available`.
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
    CallRefusedProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        properties:
          call_id:
            type: string
            description: The `failed` call record created for the refused attempt.
          disconnect_reason:
            type: string
            enum:
            - insufficient_credit
            - concurrency_limit
            - error
          diagnostic:
            type: string
    CallUsageMeters:
      type: object
      required:
      - duration_ms
      properties:
        duration_ms:
          type: integer
          minimum: 0
        llm_input_tokens:
          type: integer
          minimum: 0
          default: 0
        llm_output_tokens:
          type: integer
          minimum: 0
          default: 0
        tts_chars:
          type: integer
          minimum: 0
          default: 0
    Catalog:
      type: object
      required:
      - version
      - effective_from
      - entries
      properties:
        version:
          type: integer
        effective_from:
          type: string
          format: date-time
        entries:
          type: array
          items:
            $ref: '#/components/schemas/CatalogEntry'
    CatalogEntry:
      type: object
      required:
      - component
      - provider
      - model
      - label
      - rate_per_min_usd
      - bundles
      properties:
        component:
          $ref: '#/components/schemas/Component'
        provider:
          type: string
          pattern: ^[a-z0-9_]+$
          examples:
          - deepgram
          - azure_openai
          - callwright
        model:
          type:
          - string
          - 'null'
          description: null means the provider-level fallback rate
        label:
          type: string
        rate_per_min_usd:
          $ref: '#/components/schemas/MoneyUsd'
        bundles:
          type: array
          description: Only llm and tts entries may carry bundles
          items:
            $ref: '#/components/schemas/Bundle'
    CatalogVersionSummary:
      type: object
      required:
      - version
      - effective_from
      - created_at
      properties:
        version:
          type: integer
          minimum: 1
        effective_from:
          type: string
          format: date-time
        effective_to:
          type:
          - string
          - 'null'
          format: date-time
        notes:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
    ClaimRequest:
      type: object
      additionalProperties: false
      required:
      - job_id
      - room_name
      - worker_id
      - dispatch_metadata
      properties:
        job_id:
          type: string
        room_name:
          type: string
        worker_id:
          type: string
        dispatch_metadata:
          type: object
          description: 'Opaque JSON from the dispatch. Either `{call_id}` or `{channel: sip_inbound|whatsapp,
            route_ref}`.

            '
          additionalProperties: true
        sip:
          $ref: '#/components/schemas/SipAttributes'
    ClaimResponse:
      type: object
      required:
      - admitted
      - call_id
      properties:
        admitted:
          type: boolean
        call_id:
          type: string
          pattern: ^call_[0-9A-HJKMNP-TV-Z]{26}$
        refusal:
          type: object
          description: Present when `admitted` is false. The worker hangs up without speaking.
          properties:
            disconnect_reason:
              type: string
              enum:
              - insufficient_credit
              - concurrency_limit
              - error
            diagnostic:
              type: string
        runtime:
          $ref: '#/components/schemas/RuntimeConfig'
    Component:
      type: string
      enum:
      - stt
      - llm
      - tts
      - nc
      - platform
    ComponentSelection:
      type: object
      required:
      - provider
      properties:
        provider:
          type: string
        model:
          type:
          - string
          - 'null'
    CostBreakdown:
      type: object
      required:
      - catalog_version
      - duration_ms
      - billed_seconds
      - duration_minutes
      - lines
      - total_usd
      properties:
        call_id:
          oneOf:
          - $ref: '#/components/schemas/CallId'
          - type: 'null'
        catalog_version:
          type: integer
        duration_ms:
          type: integer
        billed_seconds:
          type: integer
          description: ceil(duration_ms / 1000)
        duration_minutes:
          type: string
          examples:
          - '4.516667'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CostLine'
        total_usd:
          $ref: '#/components/schemas/MoneyUsd'
          description: Sum of line cost_usd values
    CostLine:
      type: object
      required:
      - component
      - provider
      - model
      - rate_per_min_usd
      - billed_minutes
      - cost_usd
      - surcharge_usd
      - bundle_multiplier
      - meters
      properties:
        component:
          $ref: '#/components/schemas/Component'
        provider:
          type: string
        model:
          type:
          - string
          - 'null'
        rate_per_min_usd:
          $ref: '#/components/schemas/MoneyUsd'
        billed_minutes:
          type: string
          description: max(duration_minutes, usage / bundle_per_min) as a decimal string, 6 places
          examples:
          - '5.117400'
        cost_usd:
          $ref: '#/components/schemas/MoneyUsd'
          description: rate times billed_minutes, rounded up to $0.001
        surcharge_usd:
          $ref: '#/components/schemas/MoneyUsd'
          description: rate times (billed_minutes minus duration_minutes); informational, already inside
            cost_usd
        bundle_multiplier:
          type: string
          description: billed_minutes / duration_minutes, e.g. "1.1330"
        meters:
          type: array
          items:
            $ref: '#/components/schemas/MeterUsage'
    DeliveryAttempt:
      type: object
      required:
      - n
      - at
      properties:
        n:
          type: integer
          minimum: 1
          maximum: 6
        at:
          type: string
          format: date-time
        status_code:
          type:
          - integer
          - 'null'
        duration_ms:
          type:
          - integer
          - 'null'
        error:
          type:
          - string
          - 'null'
          description: '`timeout`, `connection_error`, `url_not_allowed`, or a short message.'
        response_excerpt:
          type:
          - string
          - 'null'
          maxLength: 1024
    DeliveryStatus:
      type: string
      enum:
      - pending
      - delivering
      - succeeded
      - failed
      - blocked
    DtmfEvent:
      allOf:
      - $ref: '#/components/schemas/EventBase'
      - type: object
        required:
        - digits
        - direction
        properties:
          type:
            const: dtmf
          digits:
            type: string
            pattern: ^[0-9*#]{1,99}$
          direction:
            type: string
            enum:
            - received
            - sent
          flush_reason:
            type: string
            enum:
            - termination_key
            - digit_limit
            - timeout
    DynamicVariables:
      type: object
      maxProperties: 50
      propertyNames:
        pattern: ^[A-Za-z_][A-Za-z0-9_]{0,63}$
      additionalProperties:
        type: string
        maxLength: 2000
    E164:
      type: string
      description: Phone number in E.164 form, a plus sign and 7 to 15 digits.
      pattern: ^\+[1-9]\d{6,14}$
      examples:
      - '+14155550123'
    EventBase:
      type: object
      required:
      - seq
      - type
      - occurred_at
      properties:
        seq:
          type: integer
          minimum: 1
        type:
          type: string
        occurred_at:
          type: string
          format: date-time
        offset_ms:
          type:
          - integer
          - 'null'
          description: Milliseconds since connection; null before connection.
    EventBatch:
      type: object
      required:
      - events
      properties:
        events:
          type: array
          minItems: 0
          maxItems: 200
          description: Empty batch is a pure heartbeat.
          items:
            $ref: '#/components/schemas/CallEvent'
    EventBatchResult:
      type: object
      required:
      - accepted
      - duplicates
      - control
      properties:
        accepted:
          type: integer
        duplicates:
          type: integer
        control:
          type: object
          required:
          - action
          properties:
            action:
              type: string
              enum:
              - none
              - end_call
            disconnect_reason:
              type: string
              enum:
              - insufficient_credit
              - error
    FeatureFamily:
      type: string
      description: 'Prefix of the feature key before the first dot, with `eval` reported as `evaluations`
        and

        `simulator` as `simulations`. The registry in services/api/app/pricing/features.py is the

        source of truth; every family it accepts is listed here (T090).

        '
      enum:
      - calls
      - evaluations
      - simulations
      - testing
      - analytics_chat
      - prompt_generation
      - post_call_analysis
      - flow_assistant
      - voice_copilot
      - issues
      - knowledge_ingestion
      - embedding
    FieldError:
      type: object
      required:
      - pointer
      - code
      - message
      properties:
        pointer:
          type: string
          description: JSON Pointer into the request body, e.g. /config/llm/temperature
        code:
          type: string
          examples:
          - required
          - out_of_range
          - invalid_format
          - not_in_catalog
        message:
          type: string
    FlowTransitionEvent:
      allOf:
      - $ref: '#/components/schemas/EventBase'
      - type: object
        required:
        - to_node_id
        description: Emitted through the 004 flow hook.
        properties:
          type:
            const: flow_transition
          from_node_id:
            type:
            - string
            - 'null'
          to_node_id:
            type: string
          label:
            type: string
    LivekitWebhookEvent:
      type: object
      required:
      - event
      - id
      - createdAt
      description: 'Subset of the LiveKit webhook payload the API reads. Handled events: `room_finished`
        (end any open call for the room with reason `error` if the worker did not report an end), `participant_left`
        (logged; the worker reports hangups), `egress_started`, `egress_ended` (set recording status and
        key; ignored for calls with `recording_enabled = false`, whose status stays `not_recorded`, since
        no egress is started for them).

        '
      properties:
        event:
          type: string
          examples:
          - room_finished
          - participant_left
          - egress_started
          - egress_ended
        id:
          type: string
        createdAt:
          type:
          - integer
          - string
        room:
          type: object
          properties:
            name:
              type: string
            sid:
              type: string
            metadata:
              type: string
        participant:
          type: object
          properties:
            identity:
              type: string
            kind:
              type: string
            attributes:
              type: object
              additionalProperties:
                type: string
        egressInfo:
          type: object
          properties:
            egressId:
              type: string
            roomName:
              type: string
            status:
              type: string
              examples:
              - EGRESS_COMPLETE
              - EGRESS_FAILED
              - EGRESS_ABORTED
              - EGRESS_LIMIT_REACHED
            error:
              type: string
            fileResults:
              type: array
              items:
                type: object
                properties:
                  filename:
                    type: string
                  location:
                    type: string
                  duration:
                    type:
                    - integer
                    - string
                  size:
                    type:
                    - integer
                    - string
    Me:
      type: object
      required:
      - user
      - workspace
      - balance_usd
      properties:
        user:
          $ref: '#/components/schemas/User'
        workspace:
          $ref: '#/components/schemas/Workspace'
        balance_usd:
          $ref: '#/components/schemas/MoneyUsd'
    MeterUsage:
      type: object
      required:
      - unit
      - used
      - bundle_per_min
      - included
      properties:
        unit:
          $ref: '#/components/schemas/BundleUnit'
        used:
          type: integer
        bundle_per_min:
          type: integer
        included:
          type: string
          description: bundle_per_min times duration_minutes, decimal string
    MoneyUsd:
      type: string
      description: USD amount as a decimal string with up to 6 fractional digits.
      pattern: ^-?\d+\.\d{1,6}$
      examples:
      - '30.000000'
      - '-0.477000'
    OutboundDial:
      type: object
      required:
      - sip_trunk_id
      - to_number
      - from_number
      - ring_timeout_s
      properties:
        sip_trunk_id:
          type: string
        to_number:
          type: string
        from_number:
          type: string
        ring_timeout_s:
          type: integer
          minimum: 10
          maximum: 60
    PageMeta:
      type: object
      required:
      - total
      - page
      - page_size
      - total_pages
      properties:
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        total_pages:
          type: integer
          minimum: 0
    Problem:
      type: object
      description: RFC 9457 problem details. `type` is a URI under https://callwright.dev/problems/.
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable machine-readable code, e.g. insufficient_credit, email_unverified.
        retry_after_s:
          type: integer
          description: Present on 429 responses.
        trace_id:
          type: string
          description: Present on 5xx responses; the reference support uses to find the trace (FR-019).
            5xx `title` and `detail` are generic and never carry database, stack or vendor text.
        errors:
          type: array
          description: Present on 422 responses; every failing field in one list.
          items:
            $ref: '#/components/schemas/FieldError'
    Quote:
      type: object
      required:
      - catalog_version
      - lines
      - per_minute_total_usd
      - complete
      properties:
        catalog_version:
          type: integer
        lines:
          type: array
          description: Always includes a platform line
          items:
            $ref: '#/components/schemas/QuoteLine'
        per_minute_total_usd:
          $ref: '#/components/schemas/MoneyUsd'
        complete:
          type: boolean
          description: false when any line is unpriced; the total then covers priced lines only
        call:
          description: Present when `usage` was sent
          $ref: '#/components/schemas/CostBreakdown'
    QuoteLine:
      type: object
      required:
      - component
      - provider
      - model
      - status
      properties:
        component:
          $ref: '#/components/schemas/Component'
        provider:
          type: string
        model:
          type:
          - string
          - 'null'
        label:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - priced
          - unpriced
          description: unpriced means no catalog row matched; the UI shows "price unavailable"
        rate_per_min_usd:
          oneOf:
          - $ref: '#/components/schemas/MoneyUsd'
          - type: 'null'
        bundles:
          type: array
          items:
            $ref: '#/components/schemas/Bundle'
    QuoteRequest:
      type: object
      required:
      - components
      properties:
        components:
          type: object
          required:
          - stt
          - llm
          - tts
          properties:
            stt:
              $ref: '#/components/schemas/ComponentSelection'
            llm:
              $ref: '#/components/schemas/ComponentSelection'
            tts:
              $ref: '#/components/schemas/ComponentSelection'
            nc:
              description: null or absent means no noise cancellation
              oneOf:
              - $ref: '#/components/schemas/ComponentSelection'
              - type: 'null'
        usage:
          $ref: '#/components/schemas/CallUsageMeters'
        at:
          type: string
          format: date-time
          description: Price with the catalog version in effect at this instant (default now)
    RuntimeConfig:
      type: object
      required:
      - channel
      - direction
      - agent_id
      - agent_version_id
      - config
      - variables
      - limits
      - heartbeat_interval_s
      properties:
        channel:
          type: string
          enum:
          - web
          - sip_inbound
          - sip_outbound
          - whatsapp
        direction:
          type: string
          enum:
          - inbound
          - outbound
        from_number:
          type:
          - string
          - 'null'
        to_number:
          type:
          - string
          - 'null'
        agent_id:
          type: string
        agent_version_id:
          type: string
        agent_type:
          type: string
          enum:
          - single_prompt
          - flow
        config:
          type: object
          description: Frozen AgentConfig from the agent version (schema owned by 002-agent-builder).
          additionalProperties: true
        variables:
          type: object
          description: Resolved dynamic variables including built-ins.
          additionalProperties:
            type: string
        limits:
          type: object
          required:
          - end_on_silence_s
          - max_duration_s
          - ring_duration_ms
          properties:
            end_on_silence_s:
              type: integer
              minimum: 10
              maximum: 300
            max_duration_s:
              type: integer
              minimum: 30
              maximum: 3600
            ring_duration_ms:
              type: integer
              minimum: 0
              maximum: 30000
        background_audio_url:
          type:
          - string
          - 'null'
          format: uri
          description: Signed URL (10 minutes) for an uploaded ambience file, else null.
        caller_join_timeout_s:
          type: integer
          default: 60
          description: Web calls only; fail the call if the browser has not joined by then.
        outbound_dial:
          description: Set by 010-channels for `sip_outbound` calls; the worker dials this.
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/OutboundDial'
        heartbeat_interval_s:
          type: integer
          default: 10
        recording_enabled:
          type: boolean
          description: 'Effective recording setting resolved at admission from the agent version''s `advanced.recording`
            override (002) and the workspace''s `recording_default` (001). Informational for the worker:
            the API starts egress only when true; the worker never records.

            '
    RuntimeTranscriptItem:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - message
          - tool_call
          - tool_result
          - flow_transition
          - system
        role:
          type: string
          enum:
          - user
          - agent
        text:
          type: string
        started_ms:
          type: integer
        ended_ms:
          type: integer
        turn_index:
          type: integer
        interrupted:
          type: boolean
        confidence:
          type: number
          minimum: 0
          maximum: 1
        source:
          type: string
          enum:
          - voice
          - keypad
        ref:
          type: string
        name:
          type: string
        arguments:
          type: object
          additionalProperties: true
        output:
          type: string
          maxLength: 8192
        is_error:
          type: boolean
        duration_ms:
          type: integer
        from_node_id:
          type: string
        to_node_id:
          type: string
        label:
          type: string
        event:
          type: string
          enum:
          - voicemail_detected
          - silence_timeout
          - max_duration
          - credit_exhausted
          - vendor_error
          - segment_override
          - override_clamped
          description: 'segment_override: a flow segment switched the model, voice or speech recognition
            settings (detail lists the paths; FR-046).

            override_clamped: an override value was outside the shared control range and was clamped (FR-046).

            '
        detail:
          type: string
        at_ms:
          type: integer
    Session:
      type: object
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum:
          - bearer
        expires_in:
          type: integer
          description: Seconds until the access token expires
    SigningSecretMasked:
      type: object
      required:
      - secret_last4
      - created_at
      properties:
        secret_last4:
          type: string
        created_at:
          type: string
          format: date-time
        rotated_at:
          type:
          - string
          - 'null'
          format: date-time
        previous_expires_at:
          type:
          - string
          - 'null'
          format: date-time
    SigningSecretRevealed:
      allOf:
      - $ref: '#/components/schemas/SigningSecretMasked'
      - type: object
        required:
        - secret
        properties:
          secret:
            type: string
            pattern: ^whsec_[A-Za-z0-9_-]{43}$
    SipAttributes:
      type: object
      description: Attributes of the SIP participant when the room was created by a SIP call.
      properties:
        call_id:
          type: string
          description: Carrier call identifier.
        trunk_id:
          type: string
        trunk_phone_number:
          type: string
          description: The called number (our number), E.164.
        caller_number:
          type: string
          description: The calling number, E.164 when available.
        participant_identity:
          type: string
    StatusEvent:
      allOf:
      - $ref: '#/components/schemas/EventBase'
      - type: object
        required:
        - status
        properties:
          type:
            const: status
          status:
            type: string
            enum:
            - ringing
            - in_progress
            - ended
            - no_answer
            - busy
            - failed
          disconnect_reason:
            type: string
            enum:
            - user_hangup
            - agent_hangup
            - call_transfer
            - voicemail_reached
            - inactivity
            - max_duration_reached
            - error
            - concurrency_limit
            - insufficient_credit
          diagnostic:
            type: string
          sip_status_code:
            type: integer
    ToolCallEvent:
      allOf:
      - $ref: '#/components/schemas/EventBase'
      - type: object
        required:
        - name
        description: Emitted through the 005 tool hook; mirrored as transcript items.
        properties:
          type:
            const: tool_call
          ref:
            type: string
          name:
            type: string
          arguments:
            type: object
            additionalProperties: true
          output:
            type: string
            maxLength: 8192
          is_error:
            type: boolean
          duration_ms:
            type: integer
    Transaction:
      type: object
      required:
      - id
      - type
      - amount_usd
      - balance_after_usd
      - description
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/TransactionId'
        type:
          $ref: '#/components/schemas/TransactionType'
        amount_usd:
          $ref: '#/components/schemas/MoneyUsd'
          description: Positive for credits, negative for charges
        balance_after_usd:
          $ref: '#/components/schemas/MoneyUsd'
        call_id:
          oneOf:
          - $ref: '#/components/schemas/CallId'
          - type: 'null'
        feature_key:
          type:
          - string
          - 'null'
          examples:
          - prompt_generation
          - eval.intent_fulfillment
        description:
          type: string
        created_at:
          type: string
          format: date-time
        cost_breakdown:
          description: Present on call_charge rows
          oneOf:
          - $ref: '#/components/schemas/CostBreakdown'
          - type: 'null'
    TransactionId:
      type: string
      pattern: ^txn_[0-9A-HJKMNP-TV-Z]{26}$
    TransactionType:
      type: string
      enum:
      - top_up
      - call_charge
      - feature_charge
      - trial_grant
      - refund
      - adjustment
    TranscriptItemEvent:
      allOf:
      - $ref: '#/components/schemas/EventBase'
      - type: object
        required:
        - item
        properties:
          type:
            const: transcript_item
          item:
            $ref: '#/components/schemas/RuntimeTranscriptItem'
    TurnEvent:
      allOf:
      - $ref: '#/components/schemas/EventBase'
      - type: object
        required:
        - turn_index
        properties:
          type:
            const: turn
          turn_index:
            type: integer
            minimum: 0
            description: 0 is the opening line; e2e_ms then holds greeting latency.
          stt_final_ms:
            type:
            - integer
            - 'null'
          eou_delay_ms:
            type:
            - integer
            - 'null'
          llm_ttft_ms:
            type:
            - integer
            - 'null'
          tts_ttfb_ms:
            type:
            - integer
            - 'null'
          e2e_ms:
            type:
            - integer
            - 'null'
          tool_ms:
            type:
            - integer
            - 'null'
          interrupted:
            type: boolean
    UsageDetail:
      type: object
      required:
      - feature_key
      - event_count
      - raw_cost_usd
      - billable_cost_usd
      properties:
        feature_key:
          type: string
          examples:
          - eval.intent_fulfillment
        event_count:
          type: integer
        raw_cost_usd:
          $ref: '#/components/schemas/MoneyUsd'
        billable_cost_usd:
          $ref: '#/components/schemas/MoneyUsd'
    UsageEvent:
      allOf:
      - $ref: '#/components/schemas/EventBase'
      - type: object
        required:
        - usage
        properties:
          type:
            const: usage
          usage:
            $ref: '#/components/schemas/UsageSnapshot'
    UsageReport:
      type: object
      required:
      - window
      - rows
      - total_raw_cost_usd
      - total_billable_cost_usd
      properties:
        window:
          type: object
          required:
          - from
          - to
          properties:
            from:
              type: string
              format: date
            to:
              type: string
              format: date
        rows:
          type: array
          items:
            $ref: '#/components/schemas/UsageRow'
        total_raw_cost_usd:
          $ref: '#/components/schemas/MoneyUsd'
        total_billable_cost_usd:
          $ref: '#/components/schemas/MoneyUsd'
    UsageRow:
      type: object
      required:
      - feature
      - event_count
      - raw_cost_usd
      - billable_cost_usd
      - details
      properties:
        feature:
          $ref: '#/components/schemas/FeatureFamily'
        event_count:
          type: integer
        raw_cost_usd:
          $ref: '#/components/schemas/MoneyUsd'
        billable_cost_usd:
          $ref: '#/components/schemas/MoneyUsd'
        details:
          type: array
          items:
            $ref: '#/components/schemas/UsageDetail'
    UsageSnapshot:
      type: object
      description: Cumulative counters since call start. Lower `seq` than stored is ignored.
      properties:
        stt:
          type: array
          items:
            type: object
            required:
            - provider
            - model
            - audio_ms
            properties:
              provider:
                type: string
              model:
                type: string
                description: The model actually used; Auto is reported as the model it resolved to for
                  the language (FR-045)
              audio_ms:
                type: integer
                minimum: 0
        llm:
          type: array
          items:
            type: object
            required:
            - provider
            - model
            - input_tokens
            - output_tokens
            properties:
              provider:
                type: string
              model:
                type: string
              input_tokens:
                type: integer
                minimum: 0
              cached_input_tokens:
                type: integer
                minimum: 0
              output_tokens:
                type: integer
                minimum: 0
        tts:
          type: array
          items:
            type: object
            required:
            - provider
            - characters
            properties:
              provider:
                type: string
              model:
                type:
                - string
                - 'null'
              characters:
                type: integer
                minimum: 0
        nc:
          type: array
          items:
            type: object
            required:
            - provider
            - audio_ms
            properties:
              provider:
                type: string
                examples:
                - sanas
                - ai_coustics
              model:
                type: string
                examples:
                - vi
                - st
                - standard
              audio_ms:
                type: integer
                minimum: 0
    User:
      type: object
      required:
      - id
      - email
      - email_verified
      - is_admin
      properties:
        id:
          $ref: '#/components/schemas/UserId'
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        is_admin:
          type: boolean
    UserId:
      type: string
      pattern: ^usr_[0-9A-HJKMNP-TV-Z]{26}$
    WarningEvent:
      allOf:
      - $ref: '#/components/schemas/EventBase'
      - type: object
        required:
        - code
        properties:
          type:
            enum:
            - warning
            - error
          code:
            type: string
            examples:
            - background_audio_unavailable
            - config_value_clamped
            - vendor_retry
            - vendor_error
          component:
            type: string
            enum:
            - stt
            - llm
            - tts
            - nc
            - vad
            - runtime
            - recording
          provider:
            type: string
          detail:
            type: string
            maxLength: 2000
    WebCallRequest:
      type: object
      additionalProperties: false
      required:
      - agent_id
      properties:
        agent_id:
          type: string
          pattern: ^agt_[0-9A-HJKMNP-TV-Z]{26}$
        version:
          description: '`draft` (default), `published`, or a specific `agv_` id of this agent.'
          type: string
          default: draft
          pattern: ^(draft|published|agv_[0-9A-HJKMNP-TV-Z]{26})$
        dynamic_variables:
          $ref: '#/components/schemas/DynamicVariables'
        metadata:
          type: object
          description: Passthrough echoed in webhooks; max 4 KB serialized, max 20 keys.
          maxProperties: 20
          additionalProperties: true
    WebCallSession:
      type: object
      required:
      - call_id
      - agent_version_id
      - room_name
      - server_url
      - participant_token
      - expires_at
      - status
      properties:
        call_id:
          type: string
          pattern: ^call_[0-9A-HJKMNP-TV-Z]{26}$
        agent_version_id:
          type: string
          pattern: ^agv_[0-9A-HJKMNP-TV-Z]{26}$
        room_name:
          type: string
        server_url:
          type: string
          format: uri
          description: WebSocket URL of the realtime media server.
        participant_token:
          type: string
          description: Join credential for this room only; publish microphone and data, subscribe.
        expires_at:
          type: string
          format: date-time
          description: Join deadline (15 minutes after issue).
        status:
          type: string
          const: queued
        missing_variables:
          type: array
          items:
            type: string
        ignored_overrides:
          type: array
          items:
            type: string
    WebhookCall:
      type: object
      required:
      - call_id
      - agent_id
      - agent_version_id
      - channel
      - direction
      - status
      - created_at
      properties:
        call_id:
          type: string
        agent_id:
          type: string
        agent_version_id:
          type: string
        channel:
          type: string
          enum:
          - web
          - sip_inbound
          - sip_outbound
          - whatsapp
        direction:
          type: string
          enum:
          - inbound
          - outbound
        from_number:
          type:
          - string
          - 'null'
        to_number:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - queued
          - ringing
          - in_progress
          - ended
          - processing
          - completed
          - failed
          - no_answer
          - busy
          - voicemail
        disconnect_reason:
          type:
          - string
          - 'null'
          enum:
          - user_hangup
          - agent_hangup
          - call_transfer
          - voicemail_reached
          - inactivity
          - max_duration_reached
          - error
          - concurrency_limit
          - insufficient_credit
          - null
        created_at:
          type: string
          format: date-time
        connected_at:
          type:
          - string
          - 'null'
          format: date-time
        ended_at:
          type:
          - string
          - 'null'
          format: date-time
        billable_seconds:
          type:
          - integer
          - 'null'
        dynamic_variables:
          type: object
          additionalProperties:
            type: string
        metadata:
          type: object
          additionalProperties: true
        transcript:
          description: call_analyzed only
          type:
          - object
          - 'null'
          properties:
            items:
              type: array
              items:
                type: object
                additionalProperties: true
        summary:
          type:
          - string
          - 'null'
        sentiment:
          type:
          - string
          - 'null'
        analysis:
          type:
          - object
          - 'null'
          additionalProperties: true
        cost:
          description: call_analyzed only; breakdown as defined by 001 pricing
          type:
          - object
          - 'null'
          additionalProperties: true
        latency:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - integer
            - 'null'
        recording_enabled:
          type: boolean
          description: Effective recording setting resolved at admission (workspace default and agent
            override).
        recording_status:
          type: string
          enum:
          - none
          - recording
          - available
          - failed
          - not_recorded
          description: '`not_recorded` when recording was off for this call (no audio exists); `failed`
            when a recording was expected but is unavailable.

            '
        recording_url:
          type:
          - string
          - 'null'
          format: uri
          description: 'Signed, valid 10 minutes. Fetch a fresh one from the calls API after that. Always
            null when `recording_status` is `not_recorded`.

            '
        processing_warnings:
          type: array
          items:
            type: string
    WebhookDelivery:
      type: object
      required:
      - id
      - event
      - url
      - status
      - attempts
      - created_at
      properties:
        id:
          type: string
        call_id:
          type:
          - string
          - 'null'
        event:
          $ref: '#/components/schemas/WebhookEventName'
        url:
          type: string
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryAttempt'
        next_attempt_at:
          type:
          - string
          - 'null'
          format: date-time
        redelivery_of:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
    WebhookEnvelope:
      type: object
      required:
      - event
      - event_id
      - occurred_at
      - call
      properties:
        event:
          $ref: '#/components/schemas/WebhookEventName'
        event_id:
          type: string
          description: Stable across retries and redeliveries of the same event; use it to de-duplicate.
        occurred_at:
          type: string
          format: date-time
        call:
          $ref: '#/components/schemas/WebhookCall'
    WebhookEventName:
      type: string
      enum:
      - call_started
      - call_ended
      - call_analyzed
      - ping
    Workspace:
      type: object
      required:
      - id
      - name
      - concurrency_limit
      - recording_default
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/WorkspaceId'
        name:
          type: string
        concurrency_limit:
          type: integer
          minimum: 1
          description: Read-only for users; shown on the Settings page
        recording_default:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
    WorkspaceId:
      type: string
      pattern: ^ws_[0-9A-HJKMNP-TV-Z]{26}$
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by the identity provider via /v1/auth endpoints.
    serviceToken:
      type: http
      scheme: bearer
      description: Static service token for /v1/internal/* endpoints (voice worker only).
