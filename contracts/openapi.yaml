      responses:
        '200':
          description: Coverage
          content:
            application/json:
              schema:
                type: object
                required:
                - ready
                - missing
                properties:
                  ready:
                    type: boolean
                  missing:
                    type: array
                    items:
                      type: object
                      required:
                      - source
                      - name
                      properties:
                        source:
                          type: string
                          enum:
                          - tool
                          - flow_node
                        tool_id:
                          type: string
                        node_id:
                          type: string
                        name:
                          type: string
                        tool_type:
                          $ref: '#/components/schemas/ToolType'
        '404':
          $ref: '#/components/responses/Problem'
      x-spec: 005-tools-knowledge
  /agents/{agent_id}/versions:
