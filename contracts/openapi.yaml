          maxLength: 1000
        known_facts:
          type: array
          maxItems: 30
          items:
            type: string
            maxLength: 300
        temperament:
          type: string
          maxLength: 300
        speaking_style:
          type: string
          maxLength: 300
        constraints:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 300
        opening_line:
          type:
          - string
          - 'null'
          maxLength: 500
    PhoneNumber:
