      required:
      - outcome
      - content
      - computed_with
      - truncated
      properties:
        outcome:
          type: string
          enum:
          - answered
          - declined
        content:
          type: string
        chart:
          type:
          - object
          - 'null'
          required:
          - chart_type
          - x_key
          - series
          - data
          properties:
            chart_type:
              type: string
              enum:
              - bar
              - line
              - area
              - pie
            x_key:
              type: string
            series:
              type: array
              items:
                type: object
                properties:
                  key:
                    type: string
                  label:
                    type: string
            data:
              type: array
              maxItems: 100
              items:
                type: object
                additionalProperties: true
        table:
          type:
          - object
          - 'null'
          required:
          - columns
          - rows
          properties:
            columns:
              type: array
              items:
                type: object
                properties:
                  key:
                    type: string
                  label:
                    type: string
                  type:
                    type: string
                    enum:
                    - string
                    - integer
                    - number
                    - usd
                    - seconds
                    - ms
                    - ratio
                    - date
                    - datetime
                    - call
                    description: 'call: a call ID the client links to /calls?call=<id>; datetime: an ISO
                      timestamp.'
            rows:
              type: array
              maxItems: 100
              items:
                type: object
                additionalProperties: true
        truncated:
          type: boolean
