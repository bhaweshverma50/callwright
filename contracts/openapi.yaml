      security:
      - bearerAuth: []
      summary: Create an agent from defaults, a template or a given config; records version 1
      description: 'The resulting config must pass blocking validation (a blank form is saved with this
        call on its first save).

        Repeating the request with the same Idempotency-Key returns the agent created the first time (FR-038).

        '
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
