          minimum: 1
        effective_from:
          type: string
          format: date-time
        effective_to:
          type:
          - string
          - 'null'
          format: date-time
        notes:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
    Change:
      type: object
