          type: boolean
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
        compiled:
          oneOf:
          - $ref: '#/components/schemas/CompiledFlow'
          - type: 'null'
    CompiledFlow:
      type: object
      description: Runnable form stored in AgentVersion.config.flow.compiled. Full shape in data-model.md
        section 4; worker validates against compiled_schema.json.
      required:
      - schema_version
      - flow_id
      - graph_hash
      - entry_node_id
      - nodes
      properties:
        schema_version:
          type: integer
          const: 1
        flow_id:
          type: string
        graph_hash:
          type: string
          pattern: ^[a-f0-9]{64}$
        compiled_at:
          type: string
          format: date-time
        entry_node_id:
          type: string
        persona_prompt:
          type: string
        builtin_variables:
          type: array
          items:
            type: string
        declared_variables:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              source_node_id:
                type: string
              type:
                type: string
        nodes:
          type: object
          additionalProperties:
            type: object
            required:
            - type
            - label
            properties:
              type:
                $ref: '#/components/schemas/NodeType'
              label:
                type: string
              transitions:
                type: array
                items:
                  type: object
                  required:
                  - edge_id
                  - function_name
                  - description
                  - target_node_id
                  - trigger
                  properties:
                    edge_id:
                      type: string
                    function_name:
                      type: string
                    description:
                      type: string
                    target_node_id:
                      type: string
                    trigger:
                      $ref: '#/components/schemas/Trigger'
            additionalProperties: true
    Component:
      type: string
