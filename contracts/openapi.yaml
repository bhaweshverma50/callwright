          type: string
          maxLength: 2048
        headers:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/HeaderSpec'
        body_template:
          description: JSON value with {{var}} placeholders inside string values; null sends the arguments
            (body for POST/PUT/PATCH, query for GET/DELETE).
        timeout_ms:
          type: integer
          minimum: 1000
          maximum: 30000
          default: 8000
        response_mappings:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ResponseMapping'
        speak_during_execution:
          type: boolean
