              items:
                type: string
                pattern: ^agt_
            channels:
              type: array
              items:
                type: string
                enum:
                - web
                - sip_inbound
                - sip_outbound
                - whatsapp
            statuses:
              type: array
              items:
                type: string
            disconnect_reasons:
              type: array
              items:
                type: string
            sentiments:
              type: array
              items:
                type: string
                enum:
                - positive
                - neutral
                - negative
                - unknown
            evaluator_names:
              type: array
              items:
                type: string
        period:
          $ref: '#/components/schemas/AnalyticsPeriod'
        order_by:
          type: object
          properties:
            key:
              type: string
            direction:
              type: string
              enum:
              - asc
              - desc
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
        origins:
          type: array
          minItems: 1
          maxItems: 3
          default:
          - live
          description: Call origins counted; live only unless the user asks to include test calls.
          items:
            $ref: '#/components/schemas/Origin'
    ModelRef:
      type: object
      required:
      - provider
      - model
      properties:
        provider:
          type: string
          pattern: ^[a-z0-9_]+$
        model:
          type: string
          minLength: 1
    MoneyUsd:
      type: string
      description: USD amount as a decimal string with up to 6 fractional digits.
      pattern: ^-?\d+\.\d{1,6}$
      examples:
      - '30.000000'
      - '-0.477000'
    Node:
      type: object
      required:
      - id
      - type
      - label
      - position
      - config
      properties:
        id:
          type: string
          pattern: ^n_[a-z0-9]{8}$
        type:
          $ref: '#/components/schemas/NodeType'
        label:
          type: string
          minLength: 1
          maxLength: 80
        position:
          type: object
          required:
          - x
          - y
          properties:
            x:
              type: number
            y:
              type: number
        config:
          description: Shape depends on type; drafts may hold incomplete configs, so only the type-specific
            schema below is applied when validating for publish. Listed with anyOf because a draft config
            can match several of them.
          anyOf:
          - $ref: '#/components/schemas/StartConfig'
          - $ref: '#/components/schemas/AgentConfigNode'
          - $ref: '#/components/schemas/TaskConfig'
          - $ref: '#/components/schemas/ConditionConfig'
          - $ref: '#/components/schemas/SayConfig'
          - $ref: '#/components/schemas/ExtractConfig'
          - $ref: '#/components/schemas/WebhookConfig'
          - $ref: '#/components/schemas/TransferConfig'
          - $ref: '#/components/schemas/EndConfig'
    NodeType:
      type: string
      enum:
      - start
      - agent
      - task
      - condition
      - say
      - extract_variable
      - webhook
      - transfer
      - end
    NoiseCancellationOption:
      type: object
      required:
      - provider
      - model
      - label
      - default
      - price_per_min_usd
      properties:
        provider:
          type: string
        available:
          type: boolean
          description: False when the voice worker holds no credentials for this provider on this deployment
            (agents on it cannot take live calls); true when the deployment does not gate
        model:
          type: string
        label:
          type: string
        description:
          type:
          - string
          - 'null'
        default:
          type: boolean
        price_per_min_usd:
          $ref: '#/components/schemas/PricePerMin'
    Onboarding:
      type: object
      required:
      - status
      - step
      - updated_at
      properties:
        status:
          $ref: '#/components/schemas/OnboardingStatus'
        step:
          oneOf:
          - $ref: '#/components/schemas/OnboardingStep'
          - type: 'null'
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the tour progress was last saved; null when never saved.
    OnboardingStatus:
      type: string
      enum:
      - not_started
      - in_progress
      - skipped
      - completed
      description: '`not_started` until the user starts or skips the tour; `in_progress` while it runs
        or is paused (the step says where); `skipped` when they left it; `completed` after the last step.
        Any status can follow any other (the tour can be restarted from the app).

        '
    OnboardingStep:
      type: string
      pattern: ^[a-z][a-z0-9_-]{0,39}$
      description: A step id of the web app's tour, such as `agents` or `test-call`. Opaque to the API.
    Operation:
      oneOf:
      - type: object
        required:
        - op
        - node
        properties:
          op:
            const: add_node
          node:
            $ref: '#/components/schemas/Node'
      - type: object
        required:
        - op
        - node_id
        - changes
        properties:
          op:
            const: update_node
          node_id:
            type: string
          changes:
            type: object
            properties:
              label:
                type: string
              config:
                type: object
      - type: object
        required:
        - op
        - node_id
        properties:
          op:
            const: remove_node
          node_id:
            type: string
      - type: object
        required:
        - op
        - edge
        properties:
          op:
            const: add_edge
          edge:
            $ref: '#/components/schemas/Edge'
      - type: object
        required:
        - op
        - edge_id
        - changes
        properties:
          op:
            const: update_edge
          edge_id:
            type: string
          changes:
            type: object
      - type: object
        required:
        - op
        - edge_id
        properties:
          op:
            const: remove_edge
          edge_id:
            type: string
      - type: object
        required:
        - op
        - name
        properties:
          op:
            const: rename_flow
          name:
            type: string
            maxLength: 120
