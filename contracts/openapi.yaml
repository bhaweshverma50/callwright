        phone_number:
          $ref: '#/components/schemas/E164'
        language:
          $ref: '#/components/schemas/LanguageRef'
        updated_at:
          type: string
          format: date-time
        last_call_id:
          type:
          - string
          - 'null'
          description: The call on which the caller last switched.
    CallerPreferenceId:
      type: string
      pattern: ^cpf_[0-9A-HJKMNP-TV-Z]{26}$
    CallerRoute:
      type: object
      required:
      - id
      - channel_id
      - caller_number
      - agent_id
      - created_at
      properties:
        id:
          type: string
        channel_id:
          type: string
        caller_number:
          $ref: '#/components/schemas/E164'
        agent_id:
          type: string
        agent_published:
          type: boolean
          description: False means the route is currently skipped.
        created_at:
          type: string
          format: date-time
    CallingHours:
      type: object
