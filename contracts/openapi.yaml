      - total_cost_usd
      - avg_cost_usd
      - median_turn_latency_ms
      - p95_turn_latency_ms
      - evaluator_pass_rate
      - evaluator_run_count
      - positive_sentiment_share
      - negative_sentiment_share
    MetricQuery:
      type: object
      required:
