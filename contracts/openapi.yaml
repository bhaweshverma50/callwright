  /sessions/web-call:
    post:
      operationId: createWebCall
      summary: Start a browser test call for an agent
      description: 'Runs admission (email verified, version resolvable and priced, balance above zero,
        under concurrency limit), creates the call in `queued`, creates the room, dispatches the voice
        worker and returns a join credential. Refused requests still create a call record with status
        `failed` and the reason, and the problem body carries its `call_id`.

        '
      tags:
      - sessions
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebCallRequest'
            examples:
              draft:
                value:
                  agent_id: agt_01JABCDEF0123456789ABCDEFG
                  version: draft
                  dynamic_variables:
                    customer_name: Priya
      responses:
        '201':
          description: Call admitted and room ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebCallSession'
        '400':
          description: Missing or malformed `Idempotency-Key` header (`idempotency-key-required`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '402':
          description: Insufficient credit (`type` ends with `/insufficient-credit`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CallRefusedProblem'
        '403':
          description: Email not verified (`type` ends with `/email-unverified`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: '`agent-not-published` (version=published with none pinned), `flow-not-compiled`
            (a flow agent whose graph has no compiled flow, 004) or `idempotency-key-in-use` (same key,
            request still running).

            '
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 'Invalid variables, unsupported vendor (`unsupported_vendor`), unpriced configuration
            (`pricing_unavailable`), or idempotency key reused with a different body.

            '
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CallRefusedProblem'
        '429':
          description: Concurrency limit reached (`type` ends with `/concurrency-limit`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CallRefusedProblem'
        '503':
          description: 'The media server could not create the room or dispatch the worker (`media-unavailable`).
            The call is recorded as `failed` and not charged.

            '
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CallRefusedProblem'
      x-spec: 003-voice-runtime
