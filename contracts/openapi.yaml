          - error
        pass_count:
          type: integer
        fail_count:
          type: integer
        runs:
          type: array
          items:
            $ref: '#/components/schemas/EvaluatorRun'
        history:
          type: array
          items:
            $ref: '#/components/schemas/EvaluatorRun'
    CallEvent:
      oneOf:
      - $ref: '#/components/schemas/StatusEvent'
      - $ref: '#/components/schemas/TurnEvent'
      - $ref: '#/components/schemas/TranscriptItemEvent'
      - $ref: '#/components/schemas/UsageEvent'
      - $ref: '#/components/schemas/ToolCallEvent'
      - $ref: '#/components/schemas/FlowTransitionEvent'
      - $ref: '#/components/schemas/DtmfEvent'
      - $ref: '#/components/schemas/WarningEvent'
      discriminator:
        propertyName: type
        mapping:
          status: '#/components/schemas/StatusEvent'
          turn: '#/components/schemas/TurnEvent'
          transcript_item: '#/components/schemas/TranscriptItemEvent'
          usage: '#/components/schemas/UsageEvent'
          tool_call: '#/components/schemas/ToolCallEvent'
          flow_transition: '#/components/schemas/FlowTransitionEvent'
          dtmf: '#/components/schemas/DtmfEvent'
          warning: '#/components/schemas/WarningEvent'
          error: '#/components/schemas/WarningEvent'
    CallId:
      type: string
      pattern: ^call_[0-9A-HJKMNP-TV-Z]{26}$
    CallLanguage:
      type: object
      required:
      - call_id
      - agent_language
      - started_language
      - started_from
      - switches
      - caller_number
      - preference
      properties:
        call_id:
          type: string
        agent_language:
          $ref: '#/components/schemas/LanguageRef'
        started_language:
          $ref: '#/components/schemas/LanguageRef'
        started_from:
          type: string
          enum:
          - agent
          - saved_preference
          description: '`saved_preference` when the call started in the caller''s saved language.'
        switches:
          type: array
          items:
            $ref: '#/components/schemas/CallLanguageSwitch'
        caller_number:
          description: The number whose language is saved (caller on inbound, dialled number on outbound);
            null on browser calls.
          oneOf:
          - $ref: '#/components/schemas/E164'
          - type: 'null'
        preference:
          description: The caller's current saved language, if any.
          oneOf:
          - $ref: '#/components/schemas/CallerPreference'
          - type: 'null'
    CallLanguageSwitch:
      type: object
      required:
      - offset_ms
      - from
      - to
      properties:
        offset_ms:
          type:
          - integer
          - 'null'
          description: Time into the connected call.
        from:
          $ref: '#/components/schemas/LanguageRef'
        to:
          $ref: '#/components/schemas/LanguageRef'
    CallListItem:
      type: object
      required:
      - call_id
      - started_at
      - agent
      - channel
      - origin
      - status
      - duration_s
      - has_recording
      - quality
      properties:
        call_id:
          type: string
        started_at:
          type: string
          format: date-time
        agent:
          $ref: '#/components/schemas/AgentRef'
        from_number:
          type:
          - string
          - 'null'
        to_number:
          type:
          - string
          - 'null'
        channel:
          $ref: '#/components/schemas/Channel'
        origin:
          $ref: '#/components/schemas/Origin'
        disconnect_reason:
          oneOf:
          - $ref: '#/components/schemas/DisconnectReason'
          - type: 'null'
        diagnostic:
          type:
          - string
          - 'null'
          description: Machine code of why the call failed or was refused, for example `unsupported_vendor:stt/sarvam`
            (code, then its parts joined by `/`); null otherwise.
        duration_s:
          type: integer
          minimum: 0
        status:
          $ref: '#/components/schemas/CallStatus'
        connected_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the call was answered; null before that and for calls that never connected.
        cost_usd:
          type:
          - number
          - 'null'
        latency_avg_ms:
          type:
          - integer
          - 'null'
        has_recording:
          type: boolean
        summary:
          type:
          - string
          - 'null'
        sentiment:
          oneOf:
          - $ref: '#/components/schemas/Sentiment'
          - type: 'null'
        analysis_values:
          type:
          - object
          - 'null'
          additionalProperties: true
        analysis_status:
          type:
          - string
          - 'null'
          enum:
          - completed
          - running
          - too_short
          - not_run
          - error
          - insufficient_credit
          - null
          description: Why the call does or does not have a summary yet (null while the call is still
            in progress).
        quality:
          $ref: '#/components/schemas/QualitySummary'
    CallPage:
      type: object
      required:
      - items
      - total
      - page
      - page_size
      - total_pages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CallListItem'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        total_pages:
          type: integer
    CallQuery:
      type: object
      description: 'Specific or recent calls (the last call, the last N, the most expensive, longest or
        slowest,

        one by ID), newest first by default. Rows carry call_id, started_at, agent_name, origin,

        channel, status, duration_s, cost_usd and avg_latency_ms.

        '
      required:
      - kind
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
          - calls
        call_id:
          type: string
          pattern: ^call_[0-9A-HJKMNP-TV-Z]{26}$
        order:
          type: string
          enum:
          - recent
          - cost
          - duration
          - latency
          default: recent
        direction:
          type: string
          enum:
          - asc
          - desc
          default: desc
        period:
          $ref: '#/components/schemas/AnalyticsPeriod'
        filters:
          type: object
          additionalProperties: false
          properties:
            agent_ids:
              type: array
              items:
                type: string
                pattern: ^agt_
            channels:
              type: array
              items:
                type: string
                enum:
                - web
                - sip_inbound
                - sip_outbound
                - whatsapp
            statuses:
              type: array
              items:
                type: string
        origins:
          type: array
          minItems: 1
          maxItems: 3
          default:
          - live
          - test
          items:
            $ref: '#/components/schemas/Origin'
        limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
    CallRecordingState:
      type: object
      description: 'Recording state of one call, returned by 006''s recording URL endpoints through `calls.service.recording_state()`.
        When `recording_status` is `not_recorded` the call was deliberately not recorded (recording off
        for the workspace or agent) and `recording_url` is null; this is distinct from `failed` ("recording
        unavailable").

        '
      required:
      - call_id
      - recording_enabled
      - recording_setting_source
      - recording_status
      - recording_url
      properties:
        call_id:
          type: string
          pattern: ^call_[0-9A-HJKMNP-TV-Z]{26}$
        recording_enabled:
          type: boolean
        recording_setting_source:
          type: string
          enum:
          - workspace
          - agent
        recording_status:
          type: string
          enum:
          - none
          - recording
          - available
          - failed
          - not_recorded
        recording_url:
          type:
          - string
          - 'null'
          format: uri
          description: Signed, valid 10 minutes; null unless `recording_status` is `available`.
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
    CallRefusedProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        properties:
          call_id:
            type: string
            description: The `failed` call record created for the refused attempt.
          disconnect_reason:
            type: string
            enum:
            - insufficient_credit
            - concurrency_limit
            - error
          diagnostic:
            type: string
    CallStatus:
      type: string
      enum:
      - queued
      - ringing
      - in_progress
      - ended
      - processing
      - completed
      - failed
      - no_answer
      - busy
      - voicemail
      x-on-air:
      - queued
      - ringing
      - in_progress
      x-still-changing:
      - queued
      - ringing
      - in_progress
      - ended
      - processing
    CallTranscriptItem:
      oneOf:
      - $ref: '#/components/schemas/TranscriptMessage'
      - $ref: '#/components/schemas/TranscriptToolCall'
      - $ref: '#/components/schemas/TranscriptToolResult'
      discriminator:
        propertyName: type
        mapping:
          message: '#/components/schemas/TranscriptMessage'
          tool_call: '#/components/schemas/TranscriptToolCall'
          tool_result: '#/components/schemas/TranscriptToolResult'
    CallUsageMeters:
      type: object
      required:
      - duration_ms
      properties:
        duration_ms:
          type: integer
          minimum: 0
        llm_input_tokens:
          type: integer
          minimum: 0
          default: 0
        llm_output_tokens:
          type: integer
          minimum: 0
          default: 0
        tts_chars:
          type: integer
          minimum: 0
          default: 0
    CallVerdictSide:
      type: object
      properties:
        verdict:
          type:
          - string
          - 'null'
          enum:
          - pass
          - fail
          - not_applicable
          - null
        score:
          type:
          - number
          - 'null'
    Callback:
      type: object
      required:
      - id
      - status
      - scheduled_at
      - timezone
      - local_time
      - to_number
      - from_number
      - phone_number_id
      - agent_id
      - agent_name
      - note
      - source_call_id
      - call_id
      - created_via
      - created_by_user_id
      - dynamic_variables
      - failure_reason
      - failure_detail
      - attempts
      - created_at
      - updated_at
      - placed_at
      - cancelled_at
      properties:
        id:
          $ref: '#/components/schemas/CallbackId'
        status:
          $ref: '#/components/schemas/CallbackStatus'
        scheduled_at:
          type: string
          format: date-time
          description: UTC instant.
        timezone:
          type: string
          description: Recipient IANA zone the time is shown in.
        local_time:
          type: string
          description: Recipient wall-clock time, ISO 8601 without offset.
          examples:
          - '2026-11-04T17:00:00'
        to_number:
          $ref: '#/components/schemas/E164'
        from_number:
          $ref: '#/components/schemas/E164'
        phone_number_id:
          type:
          - string
          - 'null'
        agent_id:
          type:
          - string
          - 'null'
          description: Null when the agent was deleted; the number's outbound agent is used.
        agent_name:
          type:
          - string
          - 'null'
        note:
          type: string
          maxLength: 500
        source_call_id:
          type:
          - string
          - 'null'
          description: The call the callback was booked on.
        call_id:
          type:
          - string
          - 'null'
          description: The outbound call that was placed.
        created_via:
          type: string
          enum:
          - agent
          - api
        created_by_user_id:
          type:
          - string
          - 'null'
        dynamic_variables:
          type: object
          additionalProperties:
            type: string
        failure_reason:
          type:
          - string
          - 'null'
          description: '`dnc_listed`, `outside_calling_hours`, `missed` (not placed within 30 minutes
            of the time), `insufficient_credit`, `concurrency_limit`, `from_number_not_active`, `no_outbound_agent`,
            `agent_not_published`, or another admission refusal code.

            '
        failure_detail:
          type:
          - string
          - 'null'
        attempts:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        placed_at:
          type:
          - string
          - 'null'
          format: date-time
        cancelled_at:
          type:
          - string
          - 'null'
          format: date-time
    CallbackBookRequest:
      type: object
      additionalProperties: false
      description: Exactly one of `at` and `in_minutes`.
      properties:
        at:
          type: string
          maxLength: 40
          description: Local date and time the caller agreed to, ISO 8601 (an offset is optional).
          examples:
          - 2026-11-04T17:00
        in_minutes:
          type: integer
          minimum: 1
          maximum: 43200
        note:
          type: string
          maxLength: 500
          default: ''
    CallbackBooked:
      type: object
      required:
      - scheduled
      - mocked
      - callback_id
      - scheduled_at
      - timezone
      - local_time
      - spoken_time
      - rescheduled
      properties:
        scheduled:
          type: boolean
          const: true
        mocked:
          type: boolean
        callback_id:
          type:
          - string
          - 'null'
        scheduled_at:
          type: string
          format: date-time
        timezone:
          type: string
        local_time:
          type: string
        spoken_time:
          type: string
          description: The time to say back, for example "tomorrow, Wednesday 4 November, at 5:00 pm".
        rescheduled:
          type: boolean
          description: An earlier callback booked on this call was moved.
    CallbackCreate:
      type: object
      additionalProperties: false
      required:
      - to_number
      - from_number
      - scheduled_at
      properties:
        to_number:
          $ref: '#/components/schemas/E164'
        from_number:
          $ref: '#/components/schemas/E164'
        agent_id:
          type: string
          pattern: ^agt_[0-9A-HJKMNP-TV-Z]{26}$
          description: Defaults to the number's outbound agent.
        scheduled_at:
          type: string
          format: date-time
          description: With an offset; from one minute to 30 days ahead.
        recipient_timezone:
          type: string
          maxLength: 64
          description: IANA zone overriding the one derived from the destination number.
        note:
          type: string
          maxLength: 500
          default: ''
        dynamic_variables:
          type: object
          maxProperties: 49
          additionalProperties:
            type: string
            maxLength: 2000
    CallbackId:
      type: string
      pattern: ^cbk_[0-9A-HJKMNP-TV-Z]{26}$
    CallbackRefusedProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        required:
        - reason
        properties:
          reason:
            type: string
            enum:
            - channel_unsupported
            - number_unavailable
            - agent_unavailable
            - unknown_timezone
            - invalid_time
            - dnc_listed
            - outside_calling_hours
          next_allowed_at:
            type:
            - string
            - 'null'
            format: date-time
          next_allowed_spoken:
            type:
            - string
            - 'null'
    CallbackStatus:
      type: string
      enum:
      - scheduled
      - placing
      - placed
      - cancelled
      - failed
      description: '`scheduled` until due; `placing` while the cron dials; `placed` once admitted (`call_id`
        is the outbound call); `failed` with `failure_reason`; `cancelled` by a user.

        '
    CallerPreference:
      type: object
      required:
      - id
      - phone_number
      - language
      - updated_at
      - last_call_id
      properties:
        id:
