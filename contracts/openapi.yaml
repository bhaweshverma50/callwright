            '
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 'Invalid variables, unsupported vendor (`unsupported-vendor`), unpriced configuration
            (`pricing-unavailable`), flow agent without flow runtime (`flow-runtime-unavailable`), or
            idempotency key reused with a different body.

            '
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CallRefusedProblem'
        '429':
          description: Concurrency limit reached (`type` ends with `/concurrency-limit`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CallRefusedProblem'
        '503':
          description: 'The media server could not create the room or dispatch the worker (`media-unavailable`).
