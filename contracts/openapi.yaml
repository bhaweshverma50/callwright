          type: array
          items:
            type: object
            required:
            - provider
            - characters
            properties:
              provider:
                type: string
              model:
                type:
                - string
                - 'null'
              characters:
                type: integer
                minimum: 0
        nc:
          type: array
          items:
            type: object
            required:
            - provider
            - audio_ms
            properties:
              provider:
                type: string
                examples:
                - sanas
                - ai_coustics
              model:
                type: string
                examples:
                - vi
                - st
                - standard
              audio_ms:
                type: integer
                minimum: 0
    User:
      type: object
      required:
      - id
      - email
      - email_verified
      - is_admin
      properties:
        id:
          $ref: '#/components/schemas/UserId'
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        is_admin:
          type: boolean
    UserId:
      type: string
      pattern: ^usr_[0-9A-HJKMNP-TV-Z]{26}$
    VersionDetail:
      allOf:
      - $ref: '#/components/schemas/VersionSummary'
      - type: object
        required:
        - agent_id
        - schema_version
        - config
        - publish_blockers
        properties:
          agent_id:
            $ref: '#/components/schemas/AgentId'
          schema_version:
            type: integer
          config:
            $ref: '#/components/schemas/AgentConfig'
          publish_blockers:
            type: array
            items:
              $ref: '#/components/schemas/ConfigIssue'
    VersionRef:
      type: object
      required:
      - id
      - version_number
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/AgentVersionId'
        version_number:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
    VersionSource:
      type: string
      enum:
      - create
      - save
      - restore
      - template
      - duplicate
      - flow_publish
      - test
    VersionSummary:
      type: object
      required:
      - id
      - version_number
      - source
      - created_at
      - content_hash
      - is_published
      - is_draft
      - has_publish_blockers
      properties:
        id:
          $ref: '#/components/schemas/AgentVersionId'
        version_number:
          type: integer
          minimum: 1
        source:
          $ref: '#/components/schemas/VersionSource'
        note:
          type:
          - string
          - 'null'
        restored_from_version_number:
          type:
          - integer
          - 'null'
        parent_version_number:
          type:
          - integer
          - 'null'
          description: Draft version this one was saved over; null for version 1
        summary:
          type: object
          description: At-a-glance contents for the history list
          required:
          - llm_model
          - tts_provider
          - tts_voice_id
          - tool_count
          - kb_count
          properties:
            llm_model:
              type: string
              examples:
              - gpt-5.1
            tts_provider:
              type: string
            tts_voice_id:
              type: string
            tool_count:
              type: integer
              minimum: 0
            kb_count:
              type: integer
              minimum: 0
            node_count:
              type:
              - integer
              - 'null'
              description: Flow agents only
        created_by_email:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        content_hash:
          type: string
          pattern: ^[0-9a-f]{64}$
        is_published:
          type: boolean
        is_draft:
          type: boolean
          description: True for the version matching the saved draft
        has_publish_blockers:
          type: boolean
    VisualState:
      type: object
      required:
      - current_route
      - current_datetime
      - timezone
      - available_actions
      properties:
        current_route:
          type: string
          examples:
          - /dashboard
        page_title:
          type: string
        current_datetime:
          type: string
          format: date-time
        timezone:
          type: string
        available_actions:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/RegisteredAction'
        highlightable_elements:
          type: array
          items:
            type: string
        visible_entities:
          type: array
          maxItems: 50
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                - agent
                - flow
                - call
                - evaluator
              id:
                type: string
              name:
                type: string
        open_panels:
          type: array
          items:
            type: string
    Voice:
      type: object
      required:
      - voice_id
      - name
      - provider
      - languages
      - model_ids
      properties:
        voice_id:
          type: string
        provider:
          type: string
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        gender:
          type:
          - string
          - 'null'
          enum:
          - female
          - male
          - neutral
          - null
        languages:
          type: array
          items:
            type: string
        preview_url:
          type:
          - string
          - 'null'
          format: uri
        model_ids:
          type: array
          items:
            type: string
          description: Empty means usable with every model of the provider
    VoiceCatalog:
      type: object
      required:
      - languages
      - stt
      - tts
      - noise_cancellation
      - ambient_sounds
      - controls
      properties:
        controls:
          type: array
          description: Single source of ranges, steps and labels for every tunable setting (FR-042, FR-047)
          items:
            $ref: '#/components/schemas/ControlRange'
        languages:
          type: array
          items:
            $ref: '#/components/schemas/Language'
        stt:
          type: array
          items:
            $ref: '#/components/schemas/SttProvider'
        tts:
          type: array
          items:
            $ref: '#/components/schemas/TtsProvider'
        noise_cancellation:
          type: array
          items:
            $ref: '#/components/schemas/NoiseCancellationOption'
        ambient_sounds:
          type: array
          items:
            type: object
            required:
            - id
            - label
            properties:
              id:
                type: string
                examples:
                - office_ambience
              label:
                type: string
              preview_url:
                type:
                - string
                - 'null'
                format: uri
    WarningEvent:
      allOf:
      - $ref: '#/components/schemas/EventBase'
      - type: object
        required:
        - code
        properties:
          type:
            enum:
            - warning
            - error
          code:
            type: string
            examples:
            - background_audio_unavailable
            - config_value_clamped
            - vendor_retry
            - vendor_error
          component:
            type: string
            enum:
            - stt
            - llm
            - tts
            - nc
            - vad
            - runtime
            - recording
          provider:
            type: string
          detail:
            type: string
            maxLength: 2000
    WebCallRequest:
      type: object
      additionalProperties: false
      required:
      - agent_id
      properties:
        agent_id:
          type: string
          pattern: ^agt_[0-9A-HJKMNP-TV-Z]{26}$
        version:
          description: '`draft` (default), `published`, or a specific `agv_` id of this agent.'
          type: string
          default: draft
          pattern: ^(draft|published|agv_[0-9A-HJKMNP-TV-Z]{26})$
        dynamic_variables:
          $ref: '#/components/schemas/DynamicVariables'
        metadata:
          type: object
          description: Passthrough echoed in webhooks; max 4 KB serialized, max 20 keys.
          maxProperties: 20
          additionalProperties: true
    WebCallSession:
      type: object
      required:
      - call_id
      - agent_version_id
      - room_name
      - server_url
      - participant_token
      - expires_at
      - status
      properties:
        call_id:
          type: string
          pattern: ^call_[0-9A-HJKMNP-TV-Z]{26}$
        agent_version_id:
          type: string
          pattern: ^agv_[0-9A-HJKMNP-TV-Z]{26}$
        room_name:
          type: string
        server_url:
          type: string
          format: uri
          description: WebSocket URL of the realtime media server.
        participant_token:
          type: string
          description: Join credential for this room only; publish microphone and data, subscribe.
        expires_at:
          type: string
          format: date-time
          description: Join deadline (15 minutes after issue).
        status:
          type: string
          const: queued
        missing_variables:
          type: array
          items:
            type: string
        ignored_overrides:
          type: array
          items:
            type: string
    WebhookCall:
      type: object
      required:
      - call_id
      - agent_id
      - agent_version_id
      - channel
      - direction
      - status
      - created_at
      properties:
        call_id:
          type: string
        agent_id:
          type: string
        agent_version_id:
          type: string
        channel:
          type: string
          enum:
          - web
          - sip_inbound
          - sip_outbound
          - whatsapp
        direction:
          type: string
          enum:
          - inbound
          - outbound
        from_number:
          type:
          - string
          - 'null'
        to_number:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - queued
          - ringing
          - in_progress
          - ended
          - processing
          - completed
          - failed
          - no_answer
          - busy
          - voicemail
        disconnect_reason:
          type:
          - string
          - 'null'
          enum:
          - user_hangup
          - agent_hangup
          - call_transfer
          - voicemail_reached
          - inactivity
          - max_duration_reached
          - error
          - concurrency_limit
          - insufficient_credit
          - null
        created_at:
          type: string
          format: date-time
        connected_at:
          type:
          - string
          - 'null'
          format: date-time
        ended_at:
          type:
          - string
          - 'null'
          format: date-time
        billable_seconds:
          type:
          - integer
          - 'null'
        dynamic_variables:
          type: object
          additionalProperties:
            type: string
        metadata:
          type: object
          additionalProperties: true
        transcript:
          description: call_analyzed only
          type:
          - object
          - 'null'
          properties:
            items:
              type: array
              items:
                type: object
                additionalProperties: true
        summary:
          type:
          - string
          - 'null'
        sentiment:
          type:
          - string
          - 'null'
        analysis:
          type:
          - object
          - 'null'
          additionalProperties: true
        cost:
          description: call_analyzed only; breakdown as defined by 001 pricing
          type:
          - object
          - 'null'
          additionalProperties: true
        latency:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - integer
            - 'null'
        recording_enabled:
          type: boolean
          description: Effective recording setting resolved at admission (workspace default and agent
            override).
        recording_status:
          type: string
          enum:
          - none
          - recording
          - available
          - failed
          - not_recorded
          description: '`not_recorded` when recording was off for this call (no audio exists); `failed`
            when a recording was expected but is unavailable.

            '
        recording_url:
          type:
          - string
          - 'null'
          format: uri
          description: 'Signed, valid 10 minutes. Fetch a fresh one from the calls API after that. Always
            null when `recording_status` is `not_recorded`.

            '
        processing_warnings:
          type: array
          items:
            type: string
    WebhookDelivery:
      type: object
      required:
      - id
      - event
      - url
      - status
      - attempts
      - created_at
      properties:
        id:
          type: string
        call_id:
          type:
          - string
          - 'null'
        event:
          $ref: '#/components/schemas/WebhookEventName'
        url:
          type: string
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryAttempt'
        next_attempt_at:
          type:
          - string
          - 'null'
          format: date-time
        redelivery_of:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
    WebhookEnvelope:
      type: object
      required:
      - event
      - event_id
      - occurred_at
      - call
      properties:
        event:
          $ref: '#/components/schemas/WebhookEventName'
        event_id:
          type: string
          description: Stable across retries and redeliveries of the same event; use it to de-duplicate.
        occurred_at:
          type: string
          format: date-time
        call:
          $ref: '#/components/schemas/WebhookCall'
    WebhookEventName:
      type: string
      enum:
      - call_started
      - call_ended
      - call_analyzed
      - ping
    Window:
      type: object
      required:
      - from
      - to
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    Workspace:
      type: object
      required:
      - id
      - name
      - concurrency_limit
      - recording_default
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/WorkspaceId'
        name:
          type: string
        concurrency_limit:
          type: integer
          minimum: 1
          description: Read-only for users; shown on the Settings page
        recording_default:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
    WorkspaceId:
      type: string
      pattern: ^ws_[0-9A-HJKMNP-TV-Z]{26}$
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by the identity provider via /v1/auth endpoints.
    serviceToken:
      type: http
      scheme: bearer
      description: Static service token for /v1/internal/* endpoints (voice worker only).
