          description: True while the workspace still uses 09:00 to 21:00 every day.
        updated_by_user_id:
          type:
          - string
          - 'null'
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
    CallingHoursUpdate:
      type: object
      additionalProperties: false
      required:
      - windows
      properties:
        windows:
          $ref: '#/components/schemas/WeeklyWindows'
    Catalog:
