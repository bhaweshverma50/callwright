      x-spec: 007-quality-evals
  /agents/{agent_id}/eval-settings/{evaluator_id}:
    put:
      operationId: putAgentEvalSetting
      description: 'Replaces the whole setting. The quality tab sends this both when the on/off switch
        is flipped (with the saved overrides) and on "Save settings" (with every field value). Overrides
        are validated against the settings schema (type, min, max, options; unknown keys rejected).

        '
      parameters:
      - $ref: '#/components/parameters/AgentIdPath'
      - name: evaluator_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^evl_
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - enabled
              properties:
                enabled:
                  type: boolean
                overrides:
                  type: object
                  additionalProperties: true
                  description: Validated against the evaluator's settings_schema
                is_headline:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEvalSetting'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: More than 4 headline evaluators ("Up to 4 headline checks per agent")
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Field errors, for example sample_rate_pct 150 gives errors[{field "overrides.sample_rate_pct",
