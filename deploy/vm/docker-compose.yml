# Callwright realtime VM (asia-south1): Caddy (TLS), LiveKit server, Redis, the arq jobs worker,
# the voice worker and its text simulation role (textsim). Secrets come from /opt/callwright/.env, worker.env and voice.env, written
# by deploy/vm/render-env.sh from Secret Manager (see deploy/vm/README.md).
# Every service restarts on its own after the VM boots (restart: unless-stopped, docker enabled
# at boot by install-idle.sh); the VM powers itself off when idle (idle-shutdown.sh).
services:
  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  livekit:
    image: livekit/livekit-server:v1.13.3
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      - redis

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    network_mode: host
    # Reachable on the VPC (firewall allows tcp:6379 only from internal ranges) with a password.
    command: ["redis-server", "--port", "6379", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  # arq jobs worker: the API image (deploy/cloudrun builds and pushes it) in ROLE=worker, with a
  # small health listener on PORT. Pull access: the VM service account needs
  # roles/artifactregistry.reader (see README.md).
  worker:
    image: ${API_IMAGE:-asia-south1-docker.pkg.dev/callwright-dev/callwright/api:latest}
    restart: unless-stopped
    network_mode: host
    env_file: worker.env
    environment:
      ROLE: worker
      PORT: "8191"
    depends_on:
      - redis

  # Voice worker (services/voice-worker image, built by deploy/vm/cloudbuild-voice.yaml): joins
  # LiveKit on ws://127.0.0.1:7880 and calls the API's /v1/internal endpoints. voice.env comes
  # from render-env.sh; VOICE_IMAGE is pinned in .env. Health on 127.0.0.1:8190.
  voice:
    image: ${VOICE_IMAGE:-asia-south1-docker.pkg.dev/callwright-dev/callwright/voice-worker:latest}
    restart: unless-stopped
    network_mode: host
    env_file: voice.env
    stop_grace_period: 30s
    depends_on:
      - livekit

  # Text simulations (008): the same voice worker image in WORKER_ROLE=textsim, an arq consumer
  # of queue arq:textsim on the local Redis (REDIS_URL in voice.env). It needs no LiveKit, only
  # Redis, the internal API and the LLM vendor keys from voice.env; without a key for a model's
  # provider it runs that model on deterministic offline scripts. Simulations are not latency
  # sensitive, so OpenAI priority processing is off here. Health on 127.0.0.1:8192.
  textsim:
    image: ${VOICE_IMAGE:-asia-south1-docker.pkg.dev/callwright-dev/callwright/voice-worker:latest}
    restart: unless-stopped
    network_mode: host
    env_file: voice.env
    environment:
      WORKER_ROLE: textsim
      WORKER_HEALTH_PORT: "8192"
      TEXTSIM_MAX_JOBS: "${TEXTSIM_MAX_JOBS:-10}"
      OPENAI_SERVICE_TIER: ""
    stop_grace_period: 30s
    depends_on:
      - redis

  # LiveKit SIP (010 channels): carriers, WhatsApp and the lab PBX send calls here and LiveKit
  # dials out through it. Only in the "telephony" profile, which render-env.sh adds to
  # COMPOSE_PROFILES in .env once CW_LIVEKIT_SIP_HOST is set (README.md, "Telephony").
  # Pin SIP_IMAGE in .env to a release from https://github.com/livekit/sip/releases.
  sip:
    image: ${SIP_IMAGE:-livekit/sip:v1.2.0}
    profiles: ["telephony"]
    restart: unless-stopped
    network_mode: host
    # The image's entrypoint passes --config=/sip/config.yaml, which beats SIP_CONFIG_FILE.
    volumes:
      - ./sip.yaml:/sip/config.yaml:ro
      - ./sip-certs:/certs:ro
    depends_on:
      - livekit
      - redis

  # Lab PBX (Asterisk, deploy/vm/lab-pbx): a stand-in carrier for demos without a phone number.
  # Softphones register on 5080 and call Callwright numbers; Callwright's outbound calls ring
  # them. "lab" profile, added by render-env.sh with CW_LAB_PBX=true. Media on UDP 52000-52199.
  lab-pbx:
    build: ./lab-pbx
    image: callwright-lab-pbx
    profiles: ["lab"]
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./lab-pbx/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./lab-pbx/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./lab-pbx/rtp.conf:/etc/asterisk/rtp.conf:ro
      - ./lab-pbx/modules.conf:/etc/asterisk/modules.conf:ro
    depends_on:
      - sip

volumes:
  caddy_data:
  caddy_config:
  redis_data:
