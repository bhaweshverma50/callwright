; Lab PBX dialplan. Two directions, nothing else (no route to any public phone network):
;   softphone -> Callwright: any number a softphone dials goes to livekit-sip, which answers it
;                when a Callwright number with that E.164 exists (imported with termination
;                127.0.0.1:5080).
;   Callwright -> softphone: the last digit of the dialled number picks the softphone, so
;                +919000000001 rings phone1 and +919000000002 rings phone2.

[from-phones]
exten => _+X.,1,Dial(PJSIP/${EXTEN}@livekit,60)
 same => n,Hangup()
; Keypads without "+": 919000000100 is sent as +919000000100.
exten => _X.,1,Goto(+${EXTEN},1)

[from-callwright]
exten => _[+0-9].,1,Dial(PJSIP/phone${EXTEN:-1},30)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy)
; Softphone not registered (app closed, phone asleep, network changed): 410 Gone (cause 22),
; so Callwright reports "not reachable" instead of "no answer" for a phone that never rang.
 same => n,GotoIf($["${DIALSTATUS}" = "CHANUNAVAIL"]?gone)
; Rang and nobody answered: 480 Temporarily Unavailable (cause 20).
 same => n,Hangup(20)
 same => n(gone),Hangup(22)
 same => n(busy),Busy(2)
