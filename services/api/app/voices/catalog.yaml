  - {code: ar, label: Arabic}
  - {code: bn, label: Bengali}
  - {code: zh, label: Chinese}
  - {code: zh-CN, label: Chinese (Simplified)}
  - {code: zh-TW, label: Chinese (Traditional)}
  - {code: da, label: Danish}
  - {code: nl, label: Dutch}
  - {code: en, label: English}
  - {code: en-AU, label: English (Australia)}
  - {code: en-IN, label: English (India)}
  - {code: en-NZ, label: English (New Zealand)}
  - {code: en-GB, label: English (UK)}
  - {code: en-US, label: English (US)}
  - {code: fr, label: French}
  - {code: fr-CA, label: French (Canada)}
  - {code: de, label: German}
  - {code: gu, label: Gujarati}
  - {code: he, label: Hebrew}
  - {code: hi, label: Hindi}
  - {code: hi-Latn, label: Hindi (Latin script)}
  - {code: id, label: Indonesian}
  - {code: it, label: Italian}
  - {code: ja, label: Japanese}
  - {code: kn, label: Kannada}
  - {code: ko, label: Korean}
  - {code: ms, label: Malay}
  - {code: ml, label: Malayalam}
  - {code: mr, label: Marathi}
  - {code: "no", label: Norwegian}
  - {code: or, label: Odia}
  - {code: pl, label: Polish}
  - {code: pt, label: Portuguese}
  - {code: pt-BR, label: Portuguese (Brazil)}
  - {code: pa, label: Punjabi}
  - {code: ru, label: Russian}
  - {code: es, label: Spanish}
  - {code: es-419, label: Spanish (Latin America)}
  - {code: sv, label: Swedish}
  - {code: taq, label: Tamasheq}
  - {code: ta, label: Tamil}
  - {code: te, label: Telugu}
  - {code: th, label: Thai}
  - {code: tr, label: Turkish}
  - {code: uk, label: Ukrainian}
  - {code: ur, label: Urdu}

defaults:
  stt: {provider: deepgram, model: null}
  # Indic languages default to Sarvam Auto (data-model 8.1).
  stt_by_language:
    bn: {provider: sarvam, model: null}
    gu: {provider: sarvam, model: null}
    hi: {provider: sarvam, model: null}
    hi-Latn: {provider: sarvam, model: null}
    kn: {provider: sarvam, model: null}
    ml: {provider: sarvam, model: null}
    mr: {provider: sarvam, model: null}
    or: {provider: sarvam, model: null}
    pa: {provider: sarvam, model: null}
    ta: {provider: sarvam, model: null}
    te: {provider: sarvam, model: null}
  tts_provider: elevenlabs

# 8.3 Speech recognition. A model's `languages` is its coverage; Auto (model null) covers the
# union of the provider's models and resolves through `auto_rule` at call time (003). Rule
# keys match a language code exactly first, then its base (the part before "-").
stt:
  - provider: deepgram
    label: Deepgram
    supports_auto: true
    default_model: null
    auto_label: Auto
    auto_description: Picks Nova-3 for English, Nova-2 otherwise
    auto_rule:
      default: nova-2
      by_language: {en: nova-3, multi: nova-3, ar: nova-3, he: nova-3, ur: nova-3, taq: nova-3}
    models:
      - id: nova-3
        label: Nova-3
        description: Most accurate for English
        languages: [multi, en, en-US, en-GB, en-AU, en-IN, en-NZ, ar, he, ur, taq]
        builtin_turn_detection: false
      - id: nova-2
        label: Nova-2
        description: Broad language coverage (36 languages)
        languages: [en, en-US, en-GB, en-AU, en-IN, en-NZ, zh, zh-CN, zh-TW, da, nl, fr, fr-CA, de, hi,
                    id, it, ja, ko, ms, "no", pl, pt, pt-BR, ru, es, es-419, sv, th, tr, uk]
        builtin_turn_detection: false
      - id: flux-general-en
        label: Flux
        description: Conversational English, lowest latency
        languages: [en, en-US, en-GB, en-AU, en-IN, en-NZ]
        builtin_turn_detection: true
  - provider: assemblyai
    label: AssemblyAI
    supports_auto: true
    default_model: null
    auto_label: Auto
    auto_description: English model for English, multilingual model for es, fr, de, it, pt
    auto_rule:
      default: universal-streaming
      by_language:
        es: universal-streaming-multilingual
        fr: universal-streaming-multilingual
        de: universal-streaming-multilingual
        it: universal-streaming-multilingual
        pt: universal-streaming-multilingual
    models:
      - id: universal-streaming
        label: Universal Streaming
        description: English-focused
        languages: [en, en-US, en-GB, en-AU, en-IN, en-NZ]
        builtin_turn_detection: true
      - id: universal-streaming-multilingual
        label: Universal Streaming Multilingual
        description: Spanish, French, German, Italian, Portuguese
        languages: [es, es-419, fr, fr-CA, de, it, pt, pt-BR]
        builtin_turn_detection: true
  - provider: sarvam
    label: Sarvam AI
    supports_auto: true
    default_model: null
    auto_label: Auto
    auto_description: Uses Saarika v2.5
    auto_rule:
      default: saarika:v2.5
      by_language: {}
    models:
      - id: saarika:v2.5
        label: Saarika v2.5
        description: Transcribes in the spoken language
        languages: [hi, hi-Latn, bn, gu, kn, ml, mr, or, pa, ta, te, en-IN]
        builtin_turn_detection: false
      - id: saaras:v3
        label: Saaras v3
        description: Newest Sarvam model
        languages: [hi, hi-Latn, bn, gu, kn, ml, mr, or, pa, ta, te, en-IN]
        builtin_turn_detection: false

# 8.4 Text-to-speech. A model's `languages` are the base languages it speaks (012 caller language);
# an English-only model names the `multilingual_model` a call switches to for another language.
# `default_voice` applies to every language without an entry in
# `default_voice_by_language` (keys match exactly, then by base language). `voice_id_pattern`
# lets validation tell a voice of another provider without a vendor call.
tts:
  - provider: elevenlabs
    label: ElevenLabs
    default_model: eleven_multilingual_v2
    capabilities: {speed: true, expressiveness: true, volume: true}
    voice_listing: {source: live, server_search: true, gender_filter: true, language_filter: true, previews: true}
    voice_id_pattern: '^[A-Za-z0-9]{20}$'
    default_voice: EXAVITQu4vr4xnSDxMaL
