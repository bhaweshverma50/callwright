# Speech capability catalog (data-model.md sections 8.1 and 8.3 to 8.6, research R6, R7).
# Prices are joined from the 001 pricing catalog at request time. Providers and models are data:
# a new vendor is one entry here, one pricing row and one runtime adapter (Principle I).

# 8.1 Languages: "Multilingual" first, then alphabetical by label. stt_default and tts_default
# are expanded by the service from the defaults block below.
languages:
