# US3 scenario 5: values become variables; after max rounds the task completes with what it has.
name: flow_task_max_rounds
flow: task_max_rounds
llm:
  default_reply: "Could you tell me that again?"
  extract:
    "priya": {name: Priya}
caller:
  - "My name is Priya"
  - "I would rather not say"
  - "Still no"
expect:
  path: [n_start000, n_task0000, n_thanks00, n_end00000]
  triggers: [always, success, always]
  agent_says: ["Thanks Priya."]
  end_reason: agent_hangup
