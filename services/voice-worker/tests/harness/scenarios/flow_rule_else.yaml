# US3 scenario 4: a rule that does not match follows "otherwise".
name: flow_rule_else
flow: rule_else
llm:
  rules:
    - {match: years, tool: route_to_gave_age}
  extract:
    "12 years": {age: 12}
caller:
  - "I am 12 years old"
expect:
  path: [n_start000, n_triage00, n_extract0, n_rule0000, n_minor000, n_end00000]
  triggers: [always, llm_condition, always, else, always]
  variables: {age: 12}
  end_reason: agent_hangup
