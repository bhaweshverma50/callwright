# US3 independent test: Start, Triage, Route (Sales, Support), Support line, End.
name: flow_triage_support
flow: triage_support
llm:
  rules:
    - {match: support, tool: route_to_knows_the_need}
  classify: {support: Support}
caller:
  - "Hi, I need support with my router"
expect:
  path: [n_start000, n_triage00, n_route000, n_suppline, n_end00000]
  triggers: [always, llm_condition, category, always]
  end_reason: agent_hangup
  agent_says: ["Connecting you with support guidance now.", "Thanks for calling. Goodbye."]
