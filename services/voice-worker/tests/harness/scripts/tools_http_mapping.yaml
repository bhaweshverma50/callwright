name: tools_http_mapping
description: An HTTP tool calls the API (in-process stub) and maps a response value into the call variables (005 T040).
runtime:
  http_stub: {status: 200, body: {data: {slots: [{time: "10:00"}]}}}
config:
  tools:
    - tool_id: tool_slots
      type: http
      name: check_availability
      description: Look up free slots
      config:
        url: "https://api.example.com/slots"
        method: POST
        headers: []
        body_template: null
        timeout_ms: 1000
        response_mappings: [{variable_name: next_slot, json_path: "data.slots[0].time"}]
        speak_during_execution: true
        execution_message: "One moment while I check that."
        parameters: {type: object, properties: {date: {type: string}}, required: [date]}
fakes:
  rules:
    - {match: "tomorrow", reply: "We have 10:00 free.", tool: check_availability, tool_arguments: {date: "2026-10-27"}, tool_ms: 200}
steps:
  - say: "Anything tomorrow?"
  - expect_event: {type: tool_call, name: check_availability, http_status: 200, is_error: false, mapped_variables: "{'next_slot': '10:00'}"}
  - hangup: true
