name: tools_http_slow_filler
description: A lookup still running after 400 ms with nothing said yet speaks the waiting line once (005 T040).
runtime:
  http_stub: {status: 200, delay_ms: 700, body: {data: {slots: [{time: "10:00"}]}}}
config:
  tools:
    - tool_id: tool_slots
      type: http
      name: check_availability
      description: Look up free slots
      config:
        url: "https://api.example.com/slots"
        method: POST
        headers: []
        body_template: null
        timeout_ms: 3000
        response_mappings: [{variable_name: next_slot, json_path: "data.slots[0].time"}]
        speak_during_execution: true
        execution_message: "One moment while I check that."
        parameters: {type: object, properties: {date: {type: string}}, required: [date]}
fakes:
  rules:
    - {match: "tomorrow", reply: "We have 10:00 free.", tool: check_availability, tool_arguments: {date: "2026-10-27"}, tool_ms: 700}
steps:
  - say: "Anything tomorrow?"
  - expect_event: {type: tool_call, name: check_availability, spoke_execution_message: true}
  - hangup: true
