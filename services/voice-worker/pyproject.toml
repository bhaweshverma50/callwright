[project]
name = "callwright-voice-worker"
version = "0.1.0"
description = "Callwright voice worker: LiveKit Agents runtime (role=live) and text runner (role=textsim)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "livekit-agents[anthropic,assemblyai,cartesia,deepgram,elevenlabs,fishaudio,openai,sarvam,silero,turn-detector]~=1.8.8",
    "livekit-plugins-ai-coustics~=0.3.4",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "arq>=0.26,<0.29",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "aiohttp>=3.9",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["worker", "tests"]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
