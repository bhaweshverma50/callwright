# Sections for GitHub's generated release notes, from the PR labels.
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: Features
      labels: ["type: feat"]
    - title: Fixes
      labels: ["type: fix"]
    - title: Performance
      labels: ["type: perf"]
    - title: Docs
      labels: ["type: docs"]
    - title: Other changes
      labels: ["*"]
