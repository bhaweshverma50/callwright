name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Assembled contract is current
        run: uv run --directory services/api python ../../scripts/assemble_contracts.py --check

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: callwright
          POSTGRES_PASSWORD: callwright
          POSTGRES_DB: callwright
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U callwright -d callwright"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types
        run: uv run mypy app
      - name: Migrations apply to an empty database
        run: uv run alembic upgrade head
      - name: Unit tests
        run: uv run pytest -q tests/unit
      - name: Contract tests
        run: uv run pytest -q tests/contract
      - name: Integration tests
        run: uv run pytest -q tests/integration

  web:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('apps/web/package.json') != '' }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: API types match the contract
        run: |
          pnpm run --if-present gen:api
          git diff --exit-code -- src/api/schema.d.ts
      - run: pnpm run --if-present lint
      - run: pnpm run --if-present typecheck
      - run: pnpm run --if-present test
      - name: Playwright
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm run --if-present e2e

  voice-worker:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('services/voice-worker/pyproject.toml') != '' }}
    defaults:
      run:
        working-directory: services/voice-worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run pytest -q
