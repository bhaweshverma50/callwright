name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - name: Served contract (features.txt) is current
        run: uv run --directory services/api python ../../scripts/assemble_contracts.py --check
      - name: Every spec assembles with zero conflicts and every ref resolves
        run: uv run --directory services/api python ../../scripts/assemble_contracts.py --all
      - name: OpenAPI validator on every fragment and the assembled contract
        run: uvx --from openapi-spec-validator openapi-spec-validator specs/*/contracts/*.yaml contracts/openapi.yaml

  api:
    name: api
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: callwright
          POSTGRES_PASSWORD: callwright
          POSTGRES_DB: callwright
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U callwright -d callwright"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types
        run: uv run mypy app
      - name: Migrations apply to an empty database
        run: uv run alembic upgrade head
      - name: Tests (unit, contract, integration)
        run: uv run pytest -q

  # The voice-worker jobs (lint, types, tests, latency benchmark gate) live in voice-worker.yml.

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
      - name: Playwright journeys (mock API)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm run e2e
